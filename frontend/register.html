<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CampusDealz - Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center h-screen">

  <div class="bg-white p-6 rounded shadow w-80">
    <h2 class="text-xl font-bold mb-4 text-center">Create Account</h2>

    <form id="registerForm">
      <input type="email" id="email" placeholder="Email" class="border p-2 w-full mb-2" required>
      <input type="password" id="password" placeholder="Password" class="border p-2 w-full mb-3" required>

      <div class="mb-3">
  <label class="block text-sm font-semibold text-gray-700 mb-1">
    Account Type
  </label>

  <select 
    id="role" 
    class="w-full border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
  >
    <option value="buyer">👤 Buyer</option>
    <option value="seller">🧑‍💼 Seller</option>
  </select>
      </div>

      <button class="bg-green-500 text-white w-full py-2 rounded">Register</button>
    </form>

    <p class="text-sm mt-3 text-center">
      Already have an account? 
      <a href="login.html" class="text-blue-500">Login</a>
    </p>
  </div>

<script>
document.getElementById("registerForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const role = document.getElementById("role").value;

  const res = await fetch("https://marketplace-5nn2.onrender.com/api/auth/register", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      email,
      password,
      role
    })
  });

  const data = await res.json();

  if (data.message) {
    alert("Registered successfully ✅");
    window.location.href = "login.html";
  } else {
    alert("Registration failed ❌");
  }
});
</script>

</body>
</html>
