<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusDealz - Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: { brand: '#ea580c', navy: '#1e293b' } } }
    }
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark')
    } else { document.documentElement.classList.remove('dark') }
  </script>
</head>

<body class="bg-gray-50 dark:bg-gray-900 flex items-center justify-center min-h-screen p-4 transition-colors duration-200">

  <div class="bg-white dark:bg-gray-800 p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100 dark:border-gray-700">
    <div class="flex flex-col items-center mb-6">
      <div class="bg-white rounded-full p-2 shadow-sm mb-3">
        <img src="http://googleusercontent.com/generated_image_content/0" alt="CampusDealz Logo" class="h-16 w-16 object-contain rounded-full">
      </div>
      <h2 class="text-2xl font-extrabold text-navy dark:text-white">Create Account</h2>
      <p class="text-gray-500 dark:text-gray-400 text-sm">Join the student marketplace today.</p>
    </div>

    <form id="registerForm" class="space-y-4">
      <input type="text" id="name" placeholder="Full Name" class="w-full border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-brand" required>
      <input type="email" id="email" placeholder="Email" class="w-full border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-brand" required>
      <input type="password" id="password" placeholder="Password" class="w-full border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-brand" required>

      <div>
        <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">Account Type</label>
        <select id="role" class="w-full border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-brand">
          <option value="buyer">👤 Buyer</option>
          <option value="seller">🧑‍💼 Seller</option>
        </select>
      </div>

      <button type="submit" class="w-full bg-navy hover:bg-gray-800 dark:hover:bg-blue-900 text-white font-bold py-3 rounded-lg shadow-md transition-transform active:scale-95">Register</button>
    </form>

    <p class="text-sm mt-6 text-center text-gray-600 dark:text-gray-400">
      Already have an account? 
      <a href="login.html" class="text-brand hover:underline font-semibold">Login</a>
    </p>
  </div>

<script>
document.getElementById("registerForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const name = document.getElementById("name").value;
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const role = document.getElementById("role").value;

  const res = await fetch("https://marketplace-5nn2.onrender.com/api/auth/register", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name, email, password, role })
  });

  const data = await res.json();
  if (data.message) {
    alert("Registered successfully ✅");
    window.location.href = "login.html";
  } else {
    alert("Registration failed ❌");
  }
});
</script>
</body>
</html>
