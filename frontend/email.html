<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Email & Password - CampusDealz</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: '#ea580c', navy: '#1e293b' } } } }
  </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen">

  <header class="bg-white dark:bg-gray-800 shadow-sm sticky top-0 z-40 border-b border-gray-200 dark:border-gray-700">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center gap-4">
      <div class="cursor-pointer p-2 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-full transition" onclick="window.location.href='settings.html'">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
      </div>
      <span class="text-xl font-black text-navy dark:text-white">Change Email & Password</span>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-8 space-y-6">
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 p-6">
      <div class="mb-6">
        <p class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-1">Current Email</p>
        <p id="currentEmail" class="text-lg font-bold text-navy dark:text-white">Loading...</p>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-gray-400 uppercase mb-2">New Email Address</label>
          <input id="emailInput" type="email" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 p-3 rounded-xl focus:ring-2 focus:ring-brand outline-none transition">
        </div>
        <button onclick="updateEmail()" class="w-full bg-brand text-white font-bold py-4 rounded-2xl shadow-lg transition transform active:scale-95">
          Update Email
        </button>
      </div>
    </div>

    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 p-6">
      <div class="flex justify-between items-center">
        <div>
          <p class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-1">Security</p>
          <p class="text-lg font-bold text-navy dark:text-white">Password</p>
        </div>
        <button id="showPasswordBtn" onclick="togglePasswordForm()" class="bg-gray-100 dark:bg-gray-700 text-navy dark:text-white text-sm font-bold py-2 px-4 rounded-xl hover:bg-gray-200 dark:hover:bg-gray-600 transition">
          Change
        </button>
      </div>

      <div id="passwordForm" class="hidden space-y-4 mt-6 border-t border-gray-100 dark:border-gray-700 pt-6">
        <div>
          <label class="block text-xs font-bold text-gray-400 uppercase mb-2">Current Password</label>
          <input id="currentPassword" type="password" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 p-3 rounded-xl focus:ring-2 focus:ring-brand outline-none transition">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-400 uppercase mb-2">New Password</label>
          <input id="newPassword" type="password" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 p-3 rounded-xl focus:ring-2 focus:ring-brand outline-none transition">
        </div>
        
        <div class="flex gap-3 pt-2">
          <button onclick="togglePasswordForm()" class="w-1/3 bg-gray-200 dark:bg-gray-700 text-navy dark:text-white font-bold py-4 rounded-2xl shadow-sm transition transform active:scale-95">
            Cancel
          </button>
          <button onclick="updatePassword()" class="w-2/3 bg-navy hover:bg-gray-800 dark:bg-gray-700 dark:hover:bg-gray-600 text-white font-bold py-4 rounded-2xl shadow-lg transition transform active:scale-95">
            Save New Password
          </button>
        </div>
      </div>
    </div>
  </main>

  <script>
    const API = "https://marketplace-5nn2.onrender.com";
    
    async function load() {
      const token = localStorage.getItem("token");
      const res = await fetch(`${API}/api/auth/me`, { headers: { Authorization: token } });
      const user = await res.json();
      document.getElementById("currentEmail").innerText = user.email;
    }

    async function updateEmail() {
      const email = document.getElementById("emailInput").value;
      const token = localStorage.getItem("token");

      if (!email || !email.includes("@")) {
        alert("Enter a valid email ❌");
        return;
      }

      try {
        const res = await fetch(`${API}/api/auth/update`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            Authorization: token
          },
          body: JSON.stringify({ email })
        });

        if (!res.ok) {
          alert("Update failed ❌");
          return;
        }

        alert("Email Updated ✅");
        document.getElementById("emailInput").value = "";
        load();

      } catch (err) {
        console.log(err);
        alert("Network error ❌");
      }
    }

    // Toggle visibility of the password form
    function togglePasswordForm() {
      const form = document.getElementById('passwordForm');
      const btn = document.getElementById('showPasswordBtn');
      
      if (form.classList.contains('hidden')) {
        form.classList.remove('hidden');
        btn.classList.add('hidden');
      } else {
        form.classList.add('hidden');
        btn.classList.remove('hidden');
        // Clear inputs when closing
        document.getElementById('currentPassword').value = '';
        document.getElementById('newPassword').value = '';
      }
    }

    async function updatePassword() {
      const currentPassword = document.getElementById("currentPassword").value;
      const newPassword = document.getElementById("newPassword").value;
      const token = localStorage.getItem("token");

      if (!currentPassword || !newPassword) {
  alert("Please fill in both password fields ❌");
  return;
}

if (newPassword.length < 6) {
  alert("Password too short ❌");
  return;
}
     

      try {
        const res = await fetch(`${API}/api/auth/password`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            Authorization: token
          },
          body: JSON.stringify({ currentPassword, newPassword })
        });

        if (!res.ok) {
  const err = await res.json();
  alert(err.message || "Password failed ❌");
  return;
        }

        alert("Password Reset Successfully ✅");

        // Hide form and clear fields on success
        togglePasswordForm();

      } catch (err) {
        console.log(err);
        alert("Network error ❌");
      }
    }

    load();
    if (localStorage.theme === 'dark') document.documentElement.classList.add('dark');
  </script>
</body>
</html>
