<!DOCTYPE html>
<html>
<head>
  <title>Phone</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-6">

<div class="max-w-md mx-auto bg-white p-6 rounded shadow">

  <h1 class="text-xl font-bold mb-4">Phone Number</h1>

  <p id="currentPhone" class="mb-4 text-gray-600">Loading...</p>

  <input id="phoneInput" class="w-full border p-2 rounded mb-4" placeholder="Enter new phone">

  <button onclick="updatePhone()" class="w-full bg-orange-600 text-white py-2 rounded">
    Update Phone
  </button>

</div>

<script>
const API = "https://marketplace-5nn2.onrender.com";

async function load() {
  const token = localStorage.getItem("token");

  const res = await fetch(`${API}/api/auth/me`, {
    headers: { Authorization: token }
  });

  const user = await res.json();

  document.getElementById("currentPhone").innerText =
    user.phone || "No phone added";
}

async function updatePhone() {
  const phone = document.getElementById("phoneInput").value;
  const token = localStorage.getItem("token");

  const res = await fetch(`${API}/api/auth/update`, {
    method: "PUT",
    headers: {
      "Content-Type": "application/json",
      Authorization: token
    },
    body: JSON.stringify({ phone })
  });

  if (res.ok) {
    alert("Updated ✅");
    load();
  } else {
    alert("Failed ❌");
  }
}

load();
</script>

</body>
</html>
