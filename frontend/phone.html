<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Numbers - CampusDealz</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: '#ea580c', navy: '#1e293b' } } } }
  </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen pb-20">

  <header class="bg-white dark:bg-gray-800 shadow-sm sticky top-0 z-40 border-b border-gray-200 dark:border-gray-700">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center gap-4">
      <div class="cursor-pointer p-2 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-full transition" onclick="window.location.href='settings.html'">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
      </div>
      <span class="text-xl font-black text-navy dark:text-white">Contact Numbers</span>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-8">
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 p-6 space-y-8">
      
      <div class="flex items-center gap-4 p-4 bg-green-50 dark:bg-green-900/10 rounded-xl border border-green-200 dark:border-green-800">
        <span class="text-2xl">📱</span>
        <p class="text-sm font-medium text-green-800 dark:text-green-200">Buyers will use these numbers to contact you about deals.</p>
      </div>

      <div class="space-y-6">
        <div>
          <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">Direct Call Number</label>
          <input id="phoneCall" type="tel" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 p-3 rounded-xl font-mono focus:ring-2 focus:ring-brand outline-none transition" placeholder="+234...">
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">WhatsApp Number</label>
          <input id="phoneWhatsApp" type="tel" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 p-3 rounded-xl font-mono focus:ring-2 focus:ring-brand outline-none transition" placeholder="+234...">
        </div>

        <button onclick="updatePhone()" class="w-full bg-brand text-white font-bold py-4 rounded-2xl shadow-lg transition transform active:scale-95">
          Verify & Save Numbers
        </button>
      </div>
    </div>
  </main>

  <nav class="md:hidden fixed bottom-0 w-full bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 flex justify-around items-center pb-safe pt-2 pb-2">
    <a href="index.html" class="flex flex-col items-center text-gray-400 hover:text-brand"><span class="text-[10px] font-bold">Home</span></a>
    <a href="profile.html" class="flex flex-col items-center text-brand"><span class="text-[10px] font-bold">Profile</span></a>
  </nav>

  <script>
    const API = "https://marketplace-5nn2.onrender.com";
    async function load() {
      const token = localStorage.getItem("token");
      const res = await fetch(`${API}/api/auth/me`, { headers: { Authorization: token } });
      const user = await res.json();
      document.getElementById("phoneCall").value = user.phone || "";
      document.getElementById("phoneWhatsApp").value = user.whatsapp || "";
    }

    async function updatePhone() {
  const token = localStorage.getItem("token");

  const phone = document.getElementById("phoneCall").value;
  const whatsapp = document.getElementById("phoneWhatsApp").value;

  if (!phone) {
    alert("Phone number required ❌");
    return;
  }

  const res = await fetch(`${API}/api/auth/update`, {
    method: "PUT",
    headers: {
      "Content-Type": "application/json",
      Authorization: token
    },
    body: JSON.stringify({ phone, whatsapp })
  });

  if (res.ok) {
    alert("Numbers Updated ✅");
    load();
  } else {
    alert("Failed ❌");
  }
    }
    
    load();
    if (localStorage.theme === 'dark') document.documentElement.classList.add('dark');
  </script>
</body>
</html>
