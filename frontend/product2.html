            </div>

        </div>
      </div>
    </div>
  </main>

  <div class="fixed bottom-0 left-0 right-0 p-4 z-50">

    async function loadProduct() {
  const id = new URLSearchParams(window.location.search).get("id");

  if (!id) {
    alert("Invalid product");
    return;
  }

  try {
    const res = await fetch(`${API}/api/products/${id}`);

    if (!res.ok) {
      alert("Product not found ❌");
      return;
    }

    const data = await res.json();
    productData = data;

    document.getElementById("image").src = data.image;
    document.getElementById("title").innerText = data.title;

    document.getElementById("description").innerText =
      data.description || "No description provided.";

    document.getElementById("price").innerText =
      "₦" + Number(data.price).toLocaleString();

    document.getElementById("categoryLabel").innerText =
      data.category || "General";

    const storeName = data.users?.store_name || "Campus Store";
    const sellerName = data.users?.name || "Unknown Seller";

    document.getElementById("storeName").innerText = storeName;
    document.getElementById("sellerName").innerText = sellerName;

    // 🔥 avatar
    document.getElementById("sellerAvatar").src =
      data.users?.avatar ||
      `https://ui-avatars.com/api/?name=${encodeURIComponent(sellerName)}`;

    lucide.createIcons();

  } catch (err) {
    console.log(err);
    alert("Failed to load product ❌");
  }
}

    function goToSeller() {
      if (productData) window.location.href = `seller.html?user=${productData.user_id}`;
    }

    function startChat() {
      if (!productData) return;
      const message = `Hi, I’m interested in your ${productData.title} (₦${Number(productData.price).toLocaleString()})`;
      window.location.href = `chat.html?product=${productData.id}&seller=${productData.user_id}&msg=${encodeURIComponent(message)}`;
    }

    window.onload = loadProduct;

    
    async function loadUnreadCount() {
  const token = localStorage.getItem("token");

  if (!token) return;

  try {
    const res = await fetch(`${API}/api/messages/unread-count`, {
      headers: { Authorization: token }
    });

    const data = await res.json();

    console.log("Unread:", data.count);

  } catch (err) {
    console.log("Unread failed");
  }
}

loadUnreadCount();
