<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Ads - Campus Dealz</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { 
        extend: { 
          colors: { 
            brand: '#ea580c', 
            navy: '#1e293b',
            surface: '#f8fafc'
          } 
        } 
      }
    }
  </script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen font-sans pb-24">

  <div id="app-loader" class="fixed inset-0 bg-white dark:bg-gray-900 z-[100] flex items-center justify-center transition-opacity duration-500">
    <img src="logo.svg" alt="Loading..." class="w-24 h-24 object-contain animate-pulse mix-blend-multiply dark:bg-white dark:p-2 dark:rounded-xl" onerror="this.style.display='none'">
  </div>

  <header class="bg-white dark:bg-gray-800 shadow-sm sticky top-0 z-40 border-b border-gray-200 dark:border-gray-700">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2 cursor-pointer" onclick="window.location.href='index.html'">
        <img src="logo.svg" alt="Logo" class="w-8 h-8 object-contain mix-blend-multiply dark:bg-white dark:rounded dark:p-0.5" onerror="this.style.display='none'">
        <span class="text-xl font-black text-navy dark:text-white tracking-tight">My Ads</span>
      </div>
      <div class="flex items-center gap-4">
        <a href="seller.html" class="bg-brand hover:bg-orange-600 text-white px-4 py-2 rounded-lg font-bold text-xs shadow-sm transition uppercase">Post Ad</a>
      </div>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-6 md:py-8">
    
    <div class="mb-8">
      <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 flex items-center justify-between">
        <div>
          <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1">Active Inventory</p>
          <h3 id="activeAdsCount" class="text-3xl font-black text-navy dark:text-white">0</h3>
        </div>
        <div class="h-12 w-12 bg-orange-50 dark:bg-orange-900/20 rounded-full flex items-center justify-center text-brand text-xl">
          📦
        </div>
      </div>
    </div>

    <div class="flex items-center justify-between mb-4">
      <h2 class="text-sm font-black text-gray-500 dark:text-gray-400 uppercase tracking-widest">Active Listings</h2>
      <div class="relative w-48">
        <input type="text" id="inventorySearch" onkeyup="filterAds()" placeholder="Filter..." class="w-full bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg py-1.5 px-3 text-xs focus:outline-none focus:border-brand transition-all"/>
      </div>
    </div>

    <div id="products-container" class="space-y-3">
      <div class="p-12 text-center animate-pulse">
        <p class="text-gray-400 font-bold">Loading your inventory...</p>
      </div>
    </div>

  </main>

  <nav class="md:hidden fixed bottom-0 w-full bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 flex justify-around items-center pb-safe pt-2 pb-2 z-50">
    <a href="index.html" class="flex flex-col items-center text-gray-400 hover:text-brand transition">
      <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
      <span class="text-[10px] font-bold">Home</span>
    </a>
    <a href="seller.html" class="flex flex-col items-center text-gray-400 hover:text-brand transition">
      <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
      <span class="text-[10px] font-bold">Sell</span>
    </a>
    <a href="messages.html" class="flex flex-col items-center text-gray-400 hover:text-brand transition relative">
        <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
        <span class="text-[10px] font-bold">Messages</span>
        <span id="msgBadge" class="absolute -top-1 right-1 bg-red-500 text-white text-[10px] px-1.5 py-0.5 rounded-full hidden">0</span>
    </a>
    <a href="profile.html" class="flex flex-col items-center text-brand">
      <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
      <span class="text-[10px] font-bold">Profile</span>
    </a>
  </nav>

  <div id="editModal" class="fixed inset-0 z-[60] hidden flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
    <div class="bg-white dark:bg-gray-800 w-full max-w-md rounded-2xl shadow-2xl overflow-hidden">
      <div class="px-6 py-4 border-b border-gray-100 dark:border-gray-700 flex justify-between items-center">
        <h2 class="text-lg font-black text-navy dark:text-white">Quick Edit</h2>
        <button onclick="closeEditModal()" class="text-gray-400 hover:text-gray-600">✕</button>
      </div>
      <form id="editForm" class="p-6 space-y-4">
        <div>
          <label class="block text-[10px] font-black text-gray-400 uppercase mb-1.5">Product Title</label>
          <input id="editTitle" class="w-full px-4 py-2.5 border border-gray-200 dark:border-gray-700 rounded-xl bg-gray-50 dark:bg-gray-900 text-sm focus:border-brand outline-none" required/>
        </div>
        <div>
          <label class="block text-[10px] font-black text-gray-400 uppercase mb-1.5">Price (₦)</label>
          <input id="editPrice" type="number" class="w-full px-4 py-2.5 border border-gray-200 dark:border-gray-700 rounded-xl bg-gray-50 dark:bg-gray-900 text-sm focus:border-brand outline-none" required/>
        </div>
        <button type="submit" id="updateBtn" class="w-full bg-brand text-white font-black py-3 rounded-xl hover:bg-orange-600 transition-all uppercase tracking-widest text-xs">
          Update Listing
        </button>
      </form>
    </div>
  </div>

  <script>
    const API = "https://marketplace-5nn2.onrender.com";
    let myProducts = [];
    let currentEditId = null;

    // Initialize page
    window.addEventListener('load', () => {
      const loader = document.getElementById('app-loader');
      if (loader) {
        loader.classList.add('opacity-0');
        setTimeout(() => loader.style.display = 'none', 500);
      }
      loadMyAds();
      loadUnreadCount();
    });

    async function loadMyAds() {
      const token = localStorage.getItem("token");
      if (!token) {
        window.location.href = "login.html";
        return;
      }

      try {
        const res = await fetch(`${API}/api/products/my`, {
          headers: { Authorization: token }
        });
        const data = await res.json();
        myProducts = data;
        document.getElementById("activeAdsCount").innerText = data.length;
        renderAds(data);
      } catch (err) {
        console.error("Failed to load ads:", err);
      }
    }

    function renderAds(ads) {
      const container = document.getElementById("products-container");
      container.innerHTML = "";

      if (ads.length === 0) {
        container.innerHTML = `
          <div class="p-12 text-center bg-white dark:bg-gray-800 rounded-2xl border border-dashed border-gray-300 dark:border-gray-700">
            <p class="text-gray-400 font-bold mb-4">You haven't posted any ads yet.</p>
            <a href="seller.html" class="text-brand font-black text-sm uppercase underline">Start Selling Now</a>
          </div>`;
        return;
      }

      ads.forEach(p => {
        container.innerHTML += `
          <div class="bg-white dark:bg-gray-800 p-3 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 flex gap-4 items-center group hover:border-brand/30 transition-all">
            <div class="h-16 w-16 overflow-hidden rounded-lg bg-gray-100 flex-shrink-0" onclick="window.location.href='product.html?id=${p.id}'">
              <img src="${p.image}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/150'">
            </div>
            <div class="flex-grow min-w-0" onclick="window.location.href='product.html?id=${p.id}'">
              <h3 class="font-bold text-sm text-navy dark:text-white truncate mb-0.5">${p.title}</h3>
              <p class="text-brand font-black text-sm">₦${Number(p.price).toLocaleString()}</p>
            </div>
            <div class="flex gap-2">
              <button onclick="openEditModal('${p.id}')" class="p-2.5 bg-gray-50 dark:bg-gray-700 hover:bg-brand/10 hover:text-brand rounded-lg text-gray-400 transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
              </button>
              <button onclick="deleteAd('${p.id}')" class="p-2.5 bg-gray-50 dark:bg-gray-700 hover:bg-red-50 hover:text-red-500 rounded-lg text-gray-400 transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
              </button>
            </div>
          </div>
        `;
      });
    }

    function filterAds() {
      const query = document.getElementById("inventorySearch").value.toLowerCase();
      const filtered = myProducts.filter(p => p.title.toLowerCase().includes(query));
      renderAds(filtered);
    }

    function openEditModal(id) {
      const p = myProducts.find(x => x.id == id);
      if (!p) return;
      currentEditId = id;
      document.getElementById("editTitle").value = p.title;
      document.getElementById("editPrice").value = p.price;
      document.getElementById("editModal").classList.remove("hidden");
    }

    function closeEditModal() {
      document.getElementById("editModal").classList.add("hidden");
      currentEditId = null;
    }

    document.getElementById("editForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const token = localStorage.getItem("token");
      const btn = document.getElementById("updateBtn");
      btn.disabled = true;
      btn.innerText = "Updating...";

      try {
        const res = await fetch(`${API}/api/products/${currentEditId}`, {
          method: "PUT",
          headers: { 
            Authorization: token, 
            "Content-Type": "application/json" 
          },
          body: JSON.stringify({
            title: document.getElementById("editTitle").value,
            price: document.getElementById("editPrice").value
          })
        });

        if (res.ok) {
          closeEditModal();
          loadMyAds();
        } else {
          alert("Update failed ❌");
        }
      } catch (err) {
        alert("Connection error ❌");
      } finally {
        btn.disabled = false;
        btn.innerText = "Update Listing";
      }
    });

    async function deleteAd(id) {
      if (!confirm("Remove this listing permanently?")) return;
      try {
        const res = await fetch(`${API}/api/products/${id}`, {
          method: "DELETE",
          headers: { Authorization: localStorage.getItem("token") }
        });
        if (res.ok) loadMyAds();
      } catch (err) {
        alert("Delete failed ❌");
      }
    }

    async function loadUnreadCount() {
      try {
        const res = await fetch(`${API}/api/messages/unread-count`, {
          headers: { Authorization: localStorage.getItem("token") }
        });
        const data = await res.json();
        const badge = document.getElementById("msgBadge");
        if (data.count > 0) {
          badge.innerText = data.count;
          badge.classList.remove("hidden");
        } else {
          badge.classList.add("hidden");
        }
      } catch (e) {}
    }

    setInterval(loadUnreadCount, 10000);
  </script>
</body>
</html>
