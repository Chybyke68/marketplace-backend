<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages - Campus Dealz</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'media',
      theme: { extend: { colors: { brand: '#ea580c', navy: '#0f172a' }, fontFamily: { sans: ['Inter', 'sans-serif'] } } }
    }
  </script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .glass-panel { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.3); }
    @media (prefers-color-scheme: dark) { .glass-panel { background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255, 255, 255, 0.05); } }
  </style>
</head>
<body class="bg-gray-50 dark:bg-navy text-gray-800 dark:text-gray-100 antialiased pb-24 transition-colors duration-300">

  <nav class="fixed top-0 left-0 right-0 z-50 glass-panel px-4 h-16 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <button onclick="window.location.href='index.html'" class="w-10 h-10 rounded-xl flex items-center justify-center hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
        <i data-lucide="chevron-left" class="w-6 h-6 text-brand"></i>
      </button>
      <h1 class="text-xl font-black tracking-tighter">My <span class="text-brand">Messages</span></h1>
    </div>
  </nav>

  <main class="max-w-2xl mx-auto px-4 pt-24">
    <div id="chats-container" class="space-y-3">
      <div class="flex justify-center py-20"><i data-lucide="loader-2" class="w-8 h-8 text-brand animate-spin"></i></div>
    </div>
  </main>

  <nav class="md:hidden fixed bottom-0 w-full glass-panel flex justify-around items-center py-3 z-50 border-t border-gray-100 dark:border-gray-800">
    <a href="index.html" class="flex flex-col items-center text-gray-400"><i data-lucide="home" class="w-5 h-5"></i><span class="text-[10px] font-bold mt-1">Home</span></a>
    <a href="messages.html" class="flex flex-col items-center text-brand"><i data-lucide="message-square" class="w-5 h-5"></i><span class="text-[10px] font-bold mt-1">Inbox</span></a>
    <a href="seller.html" class="relative -top-5 w-14 h-14 bg-brand rounded-full flex items-center justify-center text-white shadow-xl border-4 border-gray-50 dark:border-navy"><i data-lucide="plus" class="w-7 h-7"></i></a>
    <a href="my-ads.html" class="flex flex-col items-center text-gray-400"><i data-lucide="layers" class="w-5 h-5"></i><span class="text-[10px] font-bold mt-1">My Ads</span></a>
    <a href="profile.html" class="flex flex-col items-center text-gray-400"><i data-lucide="user" class="w-5 h-5"></i><span class="text-[10px] font-bold mt-1">Profile</span></a>
  </nav>

  <script>
    const API = "https://marketplace-5nn2.onrender.com";
    const token = localStorage.getItem("token");

    async function loadChats() {
      const res = await fetch(`${API}/api/messages/chats`, {
        headers: { Authorization: token }
      });
      const chats = await res.json();
      const container = document.getElementById("chats-container");
      container.innerHTML = "";

      if (chats.length === 0) {
        container.innerHTML = `<div class="text-center py-20 opacity-50 font-bold">No conversations yet.</div>`;
        return;
      }

      chats.forEach(chat => {
        const timeString = new Date(chat.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        const initial = (chat.store_name || "S").charAt(0).toUpperCase();

        container.innerHTML += `
          <div onclick="openChat('${chat.product_id}', '${chat.other_user_id}')" 
               class="glass-panel p-4 rounded-2xl flex items-center gap-4 cursor-pointer hover:border-brand transition-all active:scale-[0.98]">
            <div class="w-12 h-12 bg-brand rounded-xl flex items-center justify-center text-white font-black text-lg shadow-lg shadow-brand/20">
              ${initial}
            </div>
            <div class="flex-1 min-w-0">
              <div class="flex justify-between items-start mb-0.5">
                <h3 class="font-bold text-sm truncate">${chat.store_name || "Seller"}</h3>
                <span class="text-[10px] text-gray-400 font-bold">${timeString}</span>
              </div>
              <p class="text-xs text-gray-500 dark:text-gray-400 truncate">${chat.last_message}</p>
            </div>
            <i data-lucide="chevron-right" class="w-4 h-4 text-gray-300"></i>
          </div>
        `;
      });
      lucide.createIcons();
    }

    function openChat(prodId, otherId) {
      window.location.href = `chat.html?product_id=${prodId}&receiver_id=${otherId}`;
    }

    window.onload = () => {
      loadChats();
      lucide.createIcons();
    };
  </script>
</body>
</html>
