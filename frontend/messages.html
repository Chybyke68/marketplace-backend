<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages - CampusDealz</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: { brand: '#ea580c', navy: '#1e293b' } } }
    }
  </script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen pb-20 md:pb-0">

  <header class="bg-white dark:bg-gray-800 shadow-sm sticky top-0 z-40 border-b border-gray-200 dark:border-gray-700">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <button onclick="window.location.href='buyer.html'" class="text-brand font-bold text-sm tracking-widest hidden md:block mr-2">← BACK</button>
        <div class="w-8 h-8 bg-brand rounded flex items-center justify-center text-white font-black text-xs">CD</div>
        <span class="text-xl font-black text-navy dark:text-white tracking-tight">Messages</span>
      </div>
      <div class="flex items-center gap-4">
        <a href="buyer.html" class="hidden md:block text-sm font-bold text-gray-500 hover:text-brand transition">Home</a>
      </div>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-6">
    <div class="bg-white dark:bg-gray-800 rounded shadow-sm border border-gray-200 dark:border-gray-700 overflow-hidden">
      <div id="chatList" class="divide-y divide-gray-100 dark:divide-gray-700">
        </div>
    </div>
  </main>

  <nav class="md:hidden fixed bottom-0 w-full bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 flex justify-around items-center pb-safe pt-2 pb-2 z-50">
    <a href="buyer.html" class="flex flex-col items-center text-gray-400 hover:text-brand transition">
      <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
      <span class="text-[10px] font-bold">Home</span>
    </a>
    <a href="seller.html" class="flex flex-col items-center text-gray-400 hover:text-brand transition">
      <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
      <span class="text-[10px] font-bold">Sell</span>
    </a>
    <a href="messages.html" class="flex flex-col items-center text-brand">
      <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
      <span class="text-[10px] font-bold">Messages</span>
    </a>
    <a href="profile.html" class="flex flex-col items-center text-gray-400 hover:text-brand transition">
      <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
      <span class="text-[10px] font-bold">Profile</span>
    </a>
  </nav>

<script>
const API = "https://marketplace-5nn2.onrender.com";
const token = localStorage.getItem("token");

async function loadChats() {
  try {
    const res = await fetch(`${API}/api/messages/conversations`, {
      headers: { Authorization: token }
    });

    const data = await res.json();
    const container = document.getElementById("chatList");

    container.innerHTML = "";

    if (!data.length) {
      container.innerHTML = `
        <div class="p-10 text-center flex flex-col items-center justify-center">
            <span class="text-4xl mb-3 opacity-50">📭</span>
            <p class="font-bold text-gray-400 uppercase tracking-widest text-sm">
                No conversations yet
            </p>
        </div>`;
      return;
    }

    data.forEach(chat => {
      // Formatted date to look cleaner (e.g., 2:30 PM)
      const timeString = new Date(chat.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
      const initial = (chat.store_name || "S").charAt(0).toUpperCase();

      container.innerHTML += `
        <div onclick="openChat('${chat.product_id}', '${chat.other_user_id}')"
             class="p-4 flex justify-between items-center cursor-pointer hover:bg-orange-50 dark:hover:bg-gray-700/50 transition-colors">
          
          <div class="flex items-center gap-4 overflow-hidden">
            <div class="w-12 h-12 bg-orange-100 dark:bg-orange-900/30 text-brand rounded-full flex items-center justify-center text-xl font-black flex-shrink-0">
              ${initial}
            </div>
            <div class="min-w-0">
              <h3 class="font-bold text-navy dark:text-white truncate text-sm md:text-base">${chat.store_name || "Seller"}</h3>
              <p class="text-xs md:text-sm text-gray-500 dark:text-gray-400 truncate mt-0.5">${chat.last_message}</p>
            </div>
          </div>

          <span class="text-[10px] md:text-xs text-gray-400 font-bold whitespace-nowrap ml-4">
            ${timeString}
          </span>
          
        </div>
      `;
    });

  } catch (err) {
    console.log("Failed to load chats");
  }
}

function openChat(productId, userId) {
  window.location.href = `chat.html?product=${productId}&seller=${userId}`;
}

loadChats();
</script>

</body>
</html>
