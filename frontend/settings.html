            <div class="w-10 h-10 rounded-[10px] bg-gray-800 dark:bg-gray-600 flex items-center justify-center text-white">

            </div>

        <button onclick="toggleDarkMode()" id="themeToggle" class="w-12 h-6 rounded-full bg-gray-200 dark:bg-brand relative transition-colors shadow-inner">

    </div>

    <button onclick="logout()" class="w-full flex items-center justify-between px-4 py-3.5 hover:bg-red-50 dark:hover:bg-red-500/10 transition">

            </div>

  <nav class="md:hidden fixed bottom-0 w-full bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 flex justify-around items-center pb-safe pt-2 pb-2 z-50">
    <a href="index.html" class="flex flex-col items-center text-gray-400 hover:text-brand transition">

      <span class="text-[10px] font-bold">Home</span>
    </a>
    <a href="seller.html" class="flex flex-col items-center text-gray-400 hover:text-brand transition">
      <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
      <span class="text-[10px] font-bold">Sell</span>
    </a>
    <a href="profile.html" class="flex flex-col items-center text-brand">
      <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
      <span class="text-[10px] font-bold">Profile</span>
    </a>
  </nav>

  <script>
    const API = "https://marketplace-5nn2.onrender.com";

    window.addEventListener('load', () => {
      const loader = document.getElementById('app-loader');
      if (loader) {
        loader.classList.add('opacity-0');
        setTimeout(() => loader.style.display = 'none', 500);
      }
      loadUserData();
    });

    async function loadUserData() {
      const token = localStorage.getItem("token");
      if (!token) { window.location.href = "login.html"; return; }

      try {
        const res = await fetch(`${API}/api/auth/me`, {
          headers: { Authorization: token }
        });
        const user = await res.json();
        
        // Dynamically update the list items with user data
        if(user.phone) document.getElementById("displayPhone").innerText = user.phone;
        if(user.email) document.getElementById("displayEmail").innerText = user.email;
      } catch (e) { console.error("Error loading profile", e); }
    }

    function toggleDarkMode() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }

    // Apply saved theme
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
    }

    function logout() {
      if(confirm("Are you sure you want to log out?")) {
        localStorage.removeItem("token");
        window.location.href = "login.html";
      }
    }
  </script>

</html>
