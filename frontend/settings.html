<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Settings - Campus Dealz</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { 
        extend: { 
          colors: { 
            brand: '#ea580c', 
            navy: '#1e293b',
            surface: '#f8fafc'
          } 
        } 
      }
    }
  </script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen font-sans pb-24">

  <div id="app-loader" class="fixed inset-0 bg-white dark:bg-gray-900 z-[100] flex items-center justify-center transition-opacity duration-500">
    <img src="logo.svg" alt="Loading..." class="w-24 h-24 object-contain animate-pulse mix-blend-multiply dark:bg-white dark:p-2 dark:rounded-xl" onerror="this.style.display='none'">
  </div>

  <header class="bg-white dark:bg-gray-800 shadow-sm sticky top-0 z-40 border-b border-gray-200 dark:border-gray-700">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3 cursor-pointer" onclick="window.history.back()">
        <svg class="w-6 h-6 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        <span class="text-xl font-black text-navy dark:text-white tracking-tight">Settings</span>
      </div>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-4 py-6 space-y-6">
    
    <section class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 overflow-hidden">
      <div class="px-6 py-4 border-b border-gray-100 dark:border-gray-700">
        <h2 class="text-xs font-black text-gray-400 uppercase tracking-widest">Personal Information</h2>
      </div>
      <form id="profileForm" class="p-6 space-y-4">
        <div class="flex items-center gap-4 mb-4">
            <div class="relative group">
                <img id="userAvatar" src="https://via.placeholder.com/80" class="w-20 h-20 rounded-full object-cover border-2 border-brand/20">
                <label class="absolute bottom-0 right-0 bg-brand text-white p-1.5 rounded-full cursor-pointer shadow-lg">
                    <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z"></path></svg>
                    <input type="file" class="hidden" accept="image/*" onchange="previewAvatar(event)">
                </label>
            </div>
            <div>
                <h3 class="font-bold text-navy dark:text-white" id="displayName">Loading...</h3>
                <p class="text-xs text-gray-500" id="displayEmail">loading@campusdealz.com</p>
            </div>
        </div>

        <div>
          <label class="block text-[10px] font-black text-gray-400 uppercase mb-1.5">Full Name</label>
          <input id="userName" type="text" class="w-full px-4 py-3 border border-gray-200 dark:border-gray-700 rounded-xl bg-gray-50 dark:bg-gray-900 text-sm focus:border-brand outline-none transition-all"/>
        </div>
        
        <div>
          <label class="block text-[10px] font-black text-gray-400 uppercase mb-1.5">Phone Number</label>
          <input id="userPhone" type="tel" placeholder="080..." class="w-full px-4 py-3 border border-gray-200 dark:border-gray-700 rounded-xl bg-gray-50 dark:bg-gray-900 text-sm focus:border-brand outline-none transition-all"/>
        </div>

        <button type="submit" class="w-full bg-brand text-white font-black py-3 rounded-xl hover:bg-orange-600 transition-all uppercase tracking-widest text-xs">
          Save Changes
        </button>
      </form>
    </section>

    <section class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 overflow-hidden">
        <div class="px-6 py-4 border-b border-gray-100 dark:border-gray-700">
          <h2 class="text-xs font-black text-gray-400 uppercase tracking-widest">Preferences</h2>
        </div>
        <div class="p-6 space-y-4">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-sm font-bold">Dark Mode</p>
                    <p class="text-[10px] text-gray-500 uppercase font-black">Switch theme appearance</p>
                </div>
                <button onclick="toggleDarkMode()" id="themeToggle" class="w-12 h-6 rounded-full bg-gray-200 dark:bg-brand relative transition-colors">
                    <div class="w-4 h-4 bg-white rounded-full absolute top-1 left-1 dark:translate-x-6 transition-transform"></div>
                </button>
            </div>
        </div>
    </section>

    <section class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-red-100 dark:border-red-900/30 overflow-hidden">
        <div class="p-6 flex flex-col gap-4">
            <button onclick="logout()" class="flex items-center justify-between text-red-500 hover:bg-red-50 dark:hover:bg-red-500/10 p-3 -m-3 rounded-xl transition-all">
                <span class="font-bold text-sm">Sign Out</span>
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
            </button>
        </div>
    </section>

  </main>

  <nav class="md:hidden fixed bottom-0 w-full bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 flex justify-around items-center pb-safe pt-2 pb-2 z-50">
    <a href="index.html" class="flex flex-col items-center text-gray-400 hover:text-brand transition">
      <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
      <span class="text-[10px] font-bold">Home</span>
    </a>
    <a href="seller.html" class="flex flex-col items-center text-gray-400 hover:text-brand transition">
      <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
      <span class="text-[10px] font-bold">Sell</span>
    </a>
    <a href="profile.html" class="flex flex-col items-center text-brand">
      <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
      <span class="text-[10px] font-bold">Profile</span>
    </a>
  </nav>

  <script>
    const API = "https://marketplace-5nn2.onrender.com";

    window.addEventListener('load', () => {
      const loader = document.getElementById('app-loader');
      if (loader) {
        loader.classList.add('opacity-0');
        setTimeout(() => loader.style.display = 'none', 500);
      }
      loadUserData();
    });

    async function loadUserData() {
      const token = localStorage.getItem("token");
      if (!token) { window.location.href = "login.html"; return; }

      try {
        const res = await fetch(`${API}/api/auth/me`, {
          headers: { Authorization: token }
        });
        const user = await res.json();
        
        document.getElementById("displayName").innerText = user.name;
        document.getElementById("displayEmail").innerText = user.email;
        document.getElementById("userName").value = user.name;
        document.getElementById("userPhone").value = user.phone || "";
        if(user.avatar) document.getElementById("userAvatar").src = user.avatar;
      } catch (e) { console.error("Error loading profile", e); }
    }

    function previewAvatar(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (e) => document.getElementById('userAvatar').src = e.target.result;
        reader.readAsDataURL(file);
      }
    }

    function toggleDarkMode() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }

    // Apply saved theme
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
    }

    document.getElementById("profileForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('button');
        btn.innerText = "Saving...";
        btn.disabled = true;

        // Implementation for profile update API call
        setTimeout(() => {
            alert("Settings saved successfully! ✅");
            btn.innerText = "Save Changes";
            btn.disabled = false;
        }, 1000);
    });

    function logout() {
      if(confirm("Are you sure you want to log out?")) {
        localStorage.removeItem("token");
        window.location.href = "login.html";
      }
    }
  </script>
</body>
</html>
