<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Account Settings</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-6">

<div class="max-w-xl mx-auto bg-white p-6 rounded shadow">
  
  <h1 class="text-2xl font-bold mb-6">Account Settings</h1>

  <form id="settingsForm" class="space-y-4">

    <div>
      <label class="block text-sm font-bold mb-1">Full Name</label>
      <input id="name" class="w-full border p-2 rounded" required>
    </div>

    <div>
      <label class="block text-sm font-bold mb-1">Email (read only)</label>
      <input id="email" class="w-full border p-2 rounded bg-gray-100" disabled>
    </div>

    <div>
      <label class="block text-sm font-bold mb-1">Store Name</label>
      <input id="store_name" class="w-full border p-2 rounded">
    </div>

    <button class="w-full bg-orange-600 text-white py-2 rounded font-bold">
      Save Changes
    </button>

  </form>

</div>

<script>
const API = "https://marketplace-5nn2.onrender.com";

async function loadSettings() {
  const token = localStorage.getItem("token");

  if (!token) {
    window.location.href = "login.html";
    return;
  }

  try {
    const res = await fetch(`${API}/api/auth/me`, {
      headers: { Authorization: token }
    });

    const user = await res.json();

    document.getElementById("name").value = user.name || "";
    document.getElementById("email").value = user.email || "";
    document.getElementById("store_name").value = user.store_name || "";

  } catch (err) {
    console.log(err);
  }
}

document.getElementById("settingsForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const token = localStorage.getItem("token");

  const body = {
    name: document.getElementById("name").value,
    store_name: document.getElementById("store_name").value
  };

  try {
    const res = await fetch(`${API}/api/auth/update`, {
      method: "PUT",
      headers: {
        "Content-Type": "application/json",
        Authorization: token
      },
      body: JSON.stringify(body)
    });

    if (!res.ok) {
      alert("Update failed ❌");
      return;
    }

    alert("Profile updated ✅");

  } catch (err) {
    console.log(err);
  }
});

loadSettings();
</script>

</body>
</html>
