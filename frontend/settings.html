  <script>
    const API = "https://marketplace-5nn2.onrender.com";

    window.addEventListener('load', () => {
      const loader = document.getElementById('app-loader');
      if (loader) {
        loader.classList.add('opacity-0');
        setTimeout(() => loader.style.display = 'none', 500);
      }
      loadUserData();
      loadUnreadCount();
    });

    async function loadUserData() {
  const token = localStorage.getItem("token");
  if (!token) {
    window.location.href = "login.html";
    return;
  }

  try {
    const res = await fetch(`${API}/api/auth/me`, {
      headers: { Authorization: token }
    });

    if (!res.ok) {
      console.log("Failed to load user");
      return;
    }

    const user = await res.json();

    // ✅ EMAIL
    document.getElementById("displayEmail").innerText =
      user.email || "Not set";

    // ✅ PHONE
    document.getElementById("displayPhone").innerText =
      user.phone || "Add phone";

  } catch (e) {
    console.error("Error loading settings data", e);
  }
    }

    async function editPhone() {
  const phone = prompt("Enter phone number:");

  if (!phone) return;

  const token = localStorage.getItem("token");

  try {
    const res = await fetch(`${API}/api/auth/update`, {
      method: "PUT",
      headers: {
        "Content-Type": "application/json",
        Authorization: token
      },
      body: JSON.stringify({ phone })
    });

    if (!res.ok) {
      alert("Failed ❌");
      return;
    }

    alert("Phone updated ✅");
    loadUserData();

  } catch (err) {
    console.log(err);
  }
    }

    async function editEmail() {
  const email = prompt("Enter new email:");

  if (!email) return;

  const token = localStorage.getItem("token");

  try {
    const res = await fetch(`${API}/api/auth/update`, {
      method: "PUT",
      headers: {
        "Content-Type": "application/json",
        Authorization: token
      },
      body: JSON.stringify({ email })
    });

    if (!res.ok) {
      alert("Failed ❌");
      return;
    }

    alert("Email updated ✅");
    loadUserData();

  } catch (err) {
    console.log(err);
  }
    }

    // Unread count logic from Profile UI
    async function loadUnreadCount() {
      try {
        const token = localStorage.getItem("token");
        if (!token) return;
        
        const res = await fetch(`${API}/api/messages/unread-count`, {
          headers: { Authorization: token }
        });
        
        const data = await res.json();
        const badge = document.getElementById("msgBadge");

        if (data.count > 0) {
          badge.innerText = data.count;
          badge.classList.remove("hidden");
        } else {
          badge.classList.add("hidden");
        }
      } catch (err) {
        console.error("Failed to fetch unread count:", err);
      }
    }

    function toggleDarkMode() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }

    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
    }

    function logout() {
      if(confirm("Are you sure you want to log out?")) {
        localStorage.removeItem("token");
        window.location.href = "login.html";
      }
    }

    setInterval(loadUnreadCount, 5000);
  </script>
