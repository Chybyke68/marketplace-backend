  async function loadMyProducts() {
  const token = localStorage.getItem("token");

  if (!token) {
    document.getElementById("products").innerHTML = "<p>Please login</p>";
    return;
  }

  // 🔐 Decode logged-in user ID
  let userId = null;
  try {
    const payload = JSON.parse(atob(token.split(".")[1]));
    userId = payload.id;
  } catch (err) {
    console.log("Invalid token");
    return;
  }

  const res = await fetch("https://marketplace-5nn2.onrender.com/api/products/my", {
    headers: {
      Authorization: token
    }
  });

  if (!res.ok) {
    console.log("Error:", res.status);
    document.getElementById("products").innerHTML = "<p>Error loading products</p>";
    return;
  }

  const data = await res.json();
  

  const container = document.getElementById("products");
  container.innerHTML = "";

  data.forEach(p => {
   container.innerHTML += `
  <div onclick="viewProduct('${p.id}')" 
     class="bg-white rounded-xl shadow hover:shadow-lg transition overflow-hidden cursor-pointer">
    
    <img src="${p.image}" class="w-full h-48 object-cover">

    <div class="p-3">
      <h2 class="font-semibold text-lg">${p.title}</h2>
      <p class="text-blue-500 text-sm">${p.category || "General"}</p>
      <p class="text-gray-600 text-sm">${p.description}</p>
      <p class="text-green-600 font-bold text-lg mt-2">₦${p.price}</p>

      ${
        p.user_id === userId ? `
          <div class="flex gap-2 mt-3">
            <button onclick="editProduct('${p.id}', '${p.title}', '${p.description}', '${p.price}')" 
              class="flex-1 bg-yellow-500 hover:bg-yellow-600 text-white py-1 rounded">
              Edit
            </button>

            <button onclick="deleteProduct('${p.id}')" 
              class="flex-1 bg-red-500 hover:bg-red-600 text-white py-1 rounded">
              Delete
            </button>
          </div>
        ` : ""
      }

    </div>
  </div>
`;
  });
}

    function showUser() {
  const container = document.getElementById("userInfo");
  const token = localStorage.getItem("token");

  if (!token) {
    container.innerHTML = `
      <div class="bg-white p-3 rounded shadow flex justify-between">
        <span>Not logged in</span>
        <a href="login.html" class="bg-blue-500 text-white px-3 py-1 rounded">Login</a>
      </div>
    `;
    return;
  }

  try {
    const payload = JSON.parse(atob(token.split(".")[1]));

    container.innerHTML = `
      <div class="bg-white p-3 rounded shadow flex justify-between items-center">
        <span class="text-sm">User: ${payload.id}</span>
        <button onclick="logout()" class="bg-red-500 text-white px-3 py-1 rounded">
          Logout
        </button>
      </div>
    `;
  } catch (err) {
    console.log("Token error:", err);

    container.innerHTML = `
      <div class="bg-white p-3 rounded shadow flex justify-between">
        <span>Session expired</span>
        <a href="login.html" class="bg-blue-500 text-white px-3 py-1 rounded">Login again</a>
      </div>
    `;
  }
    }

function logout() {
  localStorage.removeItem("token");
  alert("Logged out!");
  window.location.href = "login.html";
}

async function deleteProduct(id) {
  const token = localStorage.getItem("token");

  if (!token) {
    alert("Login first");
    return;
  }

  const confirmDelete = confirm("Are you sure you want to delete?");
  if (!confirmDelete) return;

  const res = await fetch(`https://marketplace-5nn2.onrender.com/api/products/${id}`, {
    method: "DELETE",
    headers: {
      Authorization: token
    }
  });

  const data = await res.json();

  alert(data.message);

    if (currentView === "all") {
  await loadAllProducts();
} else {
  await loadMyProducts();
}
}

async function editProduct(id, oldTitle, oldDesc, oldPrice) {
  const token = localStorage.getItem("token");

  if (!token) {
    alert("Login first");
    return;
  }

  // Prompt user for new values
  const title = prompt("Edit title:", oldTitle);
  const description = prompt("Edit description:", oldDesc);
  const price = prompt("Edit price:", oldPrice);

  if (!title || !description || !price) {
    alert("All fields required");
    return;
  }

  const res = await fetch(`https://marketplace-5nn2.onrender.com/api/products/${id}`, {
    method: "PUT",
    headers: {
      "Content-Type": "application/json",
      Authorization: token
    },
    body: JSON.stringify({ title, description, price })
  });

  const data = await res.json();

  alert(data.message);

    if (currentView === "all") {
  await loadAllProducts();
} else {
  await loadMyProducts();
}
}

function showAll() {
  currentView = "all";

function showMy() {

     console.log("Clicked product:", id);

function displayProducts(data) {
  const container = document.getElementById("products");
  container.innerHTML = "";

  const token = localStorage.getItem("token");
  let userId = null;

  if (token) {

      const payload = JSON.parse(atob(token.split(".")[1]));

    } catch {}
  }

  data.forEach(p => {
    container.innerHTML += `
      <div onclick="viewProduct('${p.id}')" 
        class="bg-white rounded-xl shadow hover:shadow-lg transition overflow-hidden cursor-pointer">

        <img src="${p.image}" class="w-full h-48 object-cover">

        <div class="p-3">
          <h2 class="font-semibold text-lg">${p.title}</h2>
          <p class="text-blue-500 text-sm">${p.category || "General"}</p>
          <p class="text-gray-600 text-sm">${p.description}</p>
          <p class="text-green-600 font-bold text-lg mt-2">₦${p.price}</p>

          ${
            p.user_id === userId ? `
              <div class="flex gap-2 mt-3">
                <button onclick="event.stopPropagation(); editProduct('${p.id}', '${p.title}', '${p.description}', '${p.price}')" 
                  class="flex-1 bg-yellow-500 text-white py-1 rounded">Edit</button>

                <button onclick="event.stopPropagation(); deleteProduct('${p.id}')" 
                  class="flex-1 bg-red-500 text-white py-1 rounded">Delete</button>
              </div>
            ` : ""
          }
        </div>
      </div>
    `;
  });
}

function filterProducts() {
  const searchValue = document.getElementById("searchInput").value.toLowerCase();
  const min = document.getElementById("minPrice").value;
  const max = document.getElementById("maxPrice").value;
  const category = document.getElementById("categoryFilter").value;

  const filtered = allProducts.filter(p => {
    const matchesSearch =
      p.title.toLowerCase().includes(searchValue) ||
      p.description.toLowerCase().includes(searchValue);

    const matchesMin = min ? p.price >= Number(min) : true;
    const matchesMax = max ? p.price <= Number(max) : true;
    const matchesCategory = category ? p.category === category : true;

    return matchesSearch && matchesMin && matchesMax && matchesCategory;
  });

  displayProducts(filtered);
}

document.getElementById("searchInput").addEventListener("input", filterProducts);
document.getElementById("minPrice").addEventListener("input", filterProducts);
document.getElementById("maxPrice").addEventListener("input", filterProducts);
document.getElementById("categoryFilter").addEventListener("change", filterProducts);
