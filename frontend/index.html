<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusDealz</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { 
        extend: { 
          colors: { 
            geminiBgLight: '#f0f4f9', 
            geminiCardLight: '#ffffff',
            geminiBgDark: '#131314',
            geminiCardDark: '#1e1f20',
            primary: '#0b57d0', // A professional blue
            primaryDark: '#a8c7fa'
          } 
        } 
      }
    }
    
    // Theme Initialization
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark')
    } else { 
      document.documentElement.classList.remove('dark') 
    }

    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
      localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
    }
  </script>
  <style>
    /* Smooth transitions for view swapping */
    .view-section { display: none; opacity: 0; transition: opacity 0.3s ease; }
    .view-section.active { display: block; opacity: 1; }
    
    /* Hide scrollbar for clean UI */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    .dark ::-webkit-scrollbar-thumb { background: #475569; }
  </style>
</head>
<body class="bg-geminiBgLight dark:bg-geminiBgDark text-gray-800 dark:text-gray-200 min-h-screen transition-colors duration-300 font-sans antialiased">

  <nav class="sticky top-0 z-40 bg-geminiBgLight/80 dark:bg-geminiBgDark/80 backdrop-blur-md border-b border-gray-200/50 dark:border-gray-800/50">
    <div class="max-w-[1400px] mx-auto px-4 sm:px-6 py-3 flex items-center justify-between gap-4">
      
      <div class="flex items-center gap-2 cursor-pointer" onclick="switchView('marketplace')">
        <div class="w-8 h-8 bg-primary dark:bg-primaryDark text-white dark:text-gray-900 rounded-full flex items-center justify-center font-bold text-sm">
          CD
        </div>
        <span class="text-xl font-medium tracking-tight hidden sm:block">CampusDealz</span>
      </div>

      <div class="flex-grow max-w-2xl hidden md:block">
        <div class="relative">
          <svg class="absolute left-4 top-3 w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
          <input type="text" placeholder="Search campus deals..." class="w-full bg-white dark:bg-geminiCardDark border-none rounded-full py-2.5 pl-12 pr-4 focus:ring-2 focus:ring-primary dark:focus:ring-primaryDark outline-none transition-shadow shadow-sm">
        </div>
      </div>

      <div class="flex items-center gap-2 sm:gap-4">
        <button onclick="toggleTheme()" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-800 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
        </button>
        
        <button id="navActionBtn" onclick="handleNavAction()" class="bg-primary hover:bg-blue-700 dark:bg-primaryDark dark:hover:bg-blue-300 dark:text-gray-900 text-white font-medium px-5 py-2.5 rounded-full transition-colors text-sm">
          Sell an Item
        </button>

        <div class="h-9 w-9 bg-gray-300 dark:bg-gray-700 rounded-full cursor-pointer border-2 border-white dark:border-gray-800 shadow-sm flex items-center justify-center overflow-hidden" onclick="logout()">
          <svg class="w-5 h-5 text-gray-500 dark:text-gray-400" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"></path></svg>
        </div>
      </div>
    </div>
  </nav>

  <main class="max-w-[1400px] mx-auto px-4 sm:px-6 py-8">
    
    <div id="view-marketplace" class="view-section active">
      <div class="mb-8 flex flex-col sm:flex-row sm:items-end justify-between gap-4">
        <div>
          <h1 class="text-3xl sm:text-4xl font-normal mb-2">Discover Deals</h1>
          <p class="text-gray-500 dark:text-gray-400">Find what you need from students on campus.</p>
        </div>
        <div class="flex gap-2 overflow-x-auto pb-2 sm:pb-0 hide-scrollbar">
          <button class="whitespace-nowrap px-4 py-1.5 rounded-full bg-white dark:bg-geminiCardDark border border-gray-200 dark:border-gray-700 text-sm font-medium hover:bg-gray-50 dark:hover:bg-gray-800 transition">📱 Tech</button>
          <button class="whitespace-nowrap px-4 py-1.5 rounded-full bg-white dark:bg-geminiCardDark border border-gray-200 dark:border-gray-700 text-sm font-medium hover:bg-gray-50 dark:hover:bg-gray-800 transition">📚 Books</button>
          <button class="whitespace-nowrap px-4 py-1.5 rounded-full bg-white dark:bg-geminiCardDark border border-gray-200 dark:border-gray-700 text-sm font-medium hover:bg-gray-50 dark:hover:bg-gray-800 transition">🛏️ Dorm</button>
        </div>
      </div>

      <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
        </div>
    </div>

    <div id="view-dashboard" class="view-section">
      <div class="flex items-center gap-4 mb-8">
        <button onclick="switchView('marketplace')" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-800 transition">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        </button>
        <h1 class="text-3xl font-normal">Seller Hub</h1>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <section class="lg:col-span-1 bg-geminiCardLight dark:bg-geminiCardDark p-6 sm:p-8 rounded-[2rem] shadow-sm">
          <h2 class="text-xl font-medium mb-6">Create New Ad</h2>
          <form id="postAdForm" class="space-y-5">
            <div>
              <input type="text" id="title" placeholder="What are you selling?" class="w-full bg-geminiBgLight dark:bg-geminiBgDark border-none rounded-2xl px-5 py-4 focus:ring-2 focus:ring-primary outline-none transition" required/>
            </div>
            <div>
               <div class="relative">
                 <span class="absolute left-5 top-4 text-gray-500 font-medium">₦</span>
                 <input type="number" id="price" placeholder="0.00" class="w-full bg-geminiBgLight dark:bg-geminiBgDark border-none rounded-2xl px-5 py-4 pl-10 focus:ring-2 focus:ring-primary outline-none transition" required/>
               </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
              <select id="category" class="w-full bg-geminiBgLight dark:bg-geminiBgDark border-none rounded-2xl px-4 py-4 focus:ring-2 focus:ring-primary outline-none transition text-sm">
                <option value="Electronics">Electronics</option>
                <option value="Textbooks">Textbooks</option>
                <option value="Home">Dorm Gear</option>
              </select>
              <select id="condition" class="w-full bg-geminiBgLight dark:bg-geminiBgDark border-none rounded-2xl px-4 py-4 focus:ring-2 focus:ring-primary outline-none transition text-sm">
                <option value="New">Brand New</option>
                <option value="Used">Used</option>
              </select>
            </div>
            <div>
               <textarea id="description" placeholder="Item description..." class="w-full bg-geminiBgLight dark:bg-geminiBgDark border-none rounded-2xl px-5 py-4 focus:ring-2 focus:ring-primary outline-none transition resize-none" rows="3"></textarea>
            </div>
            <button type="submit" class="w-full bg-primary hover:bg-blue-700 dark:bg-primaryDark dark:hover:bg-blue-300 dark:text-gray-900 text-white font-medium py-4 rounded-full transition-colors">
              Publish Advertisement
            </button>
          </form>
        </section>

        <section class="lg:col-span-2 space-y-8">
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
            <div class="bg-geminiCardLight dark:bg-geminiCardDark p-5 rounded-[1.5rem] shadow-sm">
              <p class="text-sm text-gray-500">Revenue</p>
              <p class="text-2xl font-medium mt-1">₦0.00</p>
            </div>
            <div class="bg-geminiCardLight dark:bg-geminiCardDark p-5 rounded-[1.5rem] shadow-sm">
              <p class="text-sm text-gray-500">Active Ads</p>
              <p class="text-2xl font-medium mt-1" id="activeAdsCount">0</p>
            </div>
            <div class="bg-geminiCardLight dark:bg-geminiCardDark p-5 rounded-[1.5rem] shadow-sm">
              <p class="text-sm text-gray-500">Items Sold</p>
              <p class="text-2xl font-medium mt-1">0</p>
            </div>
            <div class="bg-geminiCardLight dark:bg-geminiCardDark p-5 rounded-[1.5rem] shadow-sm">
              <p class="text-sm text-gray-500">Views</p>
              <p class="text-2xl font-medium mt-1">0</p>
            </div>
          </div>

          <div>
            <h3 class="text-xl font-medium mb-4">Your Listings</h3>
            <div id="seller-products" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              </div>
          </div>
        </section>
      </div>
    </div>

  </main>

  <dialog id="verifyModal" class="bg-transparent p-0 backdrop:bg-black/50 backdrop:backdrop-blur-sm fixed inset-0 m-auto z-50">
    <div class="bg-geminiCardLight dark:bg-geminiCardDark text-gray-900 dark:text-gray-100 w-full max-w-md p-8 rounded-[2rem] shadow-2xl mx-4 transform transition-all scale-95 opacity-0" id="verifyModalContent">
      <div class="text-center mb-6">
        <div class="w-16 h-16 bg-blue-100 dark:bg-blue-900/30 text-primary dark:text-primaryDark rounded-full flex items-center justify-center mx-auto mb-4">
          <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        </div>
        <h2 class="text-2xl font-medium mb-2">Verify to Sell</h2>
        <p class="text-gray-500 dark:text-gray-400 text-sm">To maintain a safe campus marketplace, we need a few details before you can list items.</p>
      </div>
      
      <form id="verifyForm" class="space-y-4">
        <input type="text" placeholder="Student ID Number" class="w-full bg-geminiBgLight dark:bg-geminiBgDark border-none rounded-2xl px-5 py-4 focus:ring-2 focus:ring-primary outline-none transition" required/>
        <input type="text" placeholder="Phone Number" class="w-full bg-geminiBgLight dark:bg-geminiBgDark border-none rounded-2xl px-5 py-4 focus:ring-2 focus:ring-primary outline-none transition" required/>
        
        <div class="flex gap-3 mt-6">
          <button type="button" onclick="closeVerifyModal()" class="flex-1 px-4 py-3 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 font-medium transition">Cancel</button>
          <button type="submit" class="flex-1 bg-primary hover:bg-blue-700 dark:bg-primaryDark dark:hover:bg-blue-300 dark:text-gray-900 text-white font-medium px-4 py-3 rounded-full transition">Verify Me</button>
        </div>
      </form>
    </div>
  </dialog>

  <script>
    const API = "https://marketplace-5nn2.onrender.com";

    // Application State Management
    let isSeller = localStorage.getItem('isSeller') === 'true';
    let currentView = localStorage.getItem('currentView') || 'marketplace';

    // Initialize UI based on state
    function initApp() {
      updateNavButton();
      
      // Ensure unauthorized users can't force dashboard view via localstorage
      if (!isSeller && currentView === 'dashboard') {
        currentView = 'marketplace';
      }
      
      switchView(currentView, false); // false = don't animate on first load
      loadMarketplaceProducts();
      
      if (isSeller) {
        loadSellerProducts();
      }
    }

    // View Routing
    function switchView(viewId, animate = true) {
      document.querySelectorAll('.view-section').forEach(el => {
        el.classList.remove('active');
        if(!animate) el.style.transition = 'none';
      });
      
      const targetView = document.getElementById(`view-${viewId}`);
      if (targetView) {
        if(animate) {
          setTimeout(() => targetView.classList.add('active'), 50);
        } else {
          targetView.classList.add('active');
          setTimeout(() => targetView.style.transition = '', 50);
        }
      }
      
      currentView = viewId;
      localStorage.setItem('currentView', currentView);
    }

    // Navigation Action Logic
    function handleNavAction() {
      if (isSeller) {
        switchView('dashboard');
      } else {
        openVerifyModal();
      }
    }

    function updateNavButton() {
      const btn = document.getElementById('navActionBtn');
      if (isSeller) {
        btn.innerText = "Dashboard";
        btn.classList.remove('bg-primary');
        btn.classList.add('bg-gray-800', 'dark:bg-white', 'text-white', 'dark:text-gray-900');
      } else {
        btn.innerText = "Sell an Item";
      }
    }

    // Modal Logic
    const modal = document.getElementById('verifyModal');
    const modalContent = document.getElementById('verifyModalContent');

    function openVerifyModal() {
      modal.showModal();
      setTimeout(() => {
        modalContent.classList.remove('scale-95', 'opacity-0');
        modalContent.classList.add('scale-100', 'opacity-100');
      }, 10);
    }

    function closeVerifyModal() {
      modalContent.classList.remove('scale-100', 'opacity-100');
      modalContent.classList.add('scale-95', 'opacity-0');
      setTimeout(() => modal.close(), 200);
    }

    // Verify Form Submission
    document.getElementById('verifyForm').addEventListener('submit', (e) => {
      e.preventDefault();
      // Simulate API verification
      const btn = e.target.querySelector('button[type="submit"]');
      btn.innerText = "Verifying...";
      
      setTimeout(() => {
        isSeller = true;
        localStorage.setItem('isSeller', 'true');
        closeVerifyModal();
        updateNavButton();
        switchView('dashboard');
        loadSellerProducts();
        btn.innerText = "Verify Me";
      }, 1000);
    });

    // Mock API Loading Functions
    async function loadMarketplaceProducts() {
      const container = document.getElementById("products-grid");
      try {
        const res = await fetch(`${API}/api/products`).catch(() => null);
        let data = res ? await res.json() : [];
        
        // Fallback dummy data if API fails to load
        if (!data || data.length === 0) {
            data = [
                { id: 1, title: "iPhone 13 Pro", price: 450000, image: "https://via.placeholder.com/400x300?text=iPhone" },
                { id: 2, title: "Intro to Calc Textbook", price: 15000, image: "https://via.placeholder.com/400x300?text=Textbook" },
                { id: 3, title: "Mini Fridge", price: 45000, image: "https://via.placeholder.com/400x300?text=Fridge" },
                { id: 4, title: "Study Desk", price: 25000, image: "https://via.placeholder.com/400x300?text=Desk" }
            ];
        }

        container.innerHTML = data.map(p => `
          <div class="bg-geminiCardLight dark:bg-geminiCardDark rounded-[1.5rem] shadow-sm hover:shadow-md transition-shadow overflow-hidden cursor-pointer">
            <div class="h-48 bg-gray-100 dark:bg-gray-800">
              <img src="${p.image}" class="w-full h-full object-cover">
            </div>
            <div class="p-5">
              <h2 class="font-medium text-lg mb-1 truncate">${p.title}</h2>
              <p class="font-semibold text-primary dark:text-primaryDark mt-2">₦${p.price.toLocaleString()}</p>
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.error(err);
      }
    }

    async function loadSellerProducts() {
        const container = document.getElementById("seller-products");
        // Simulated user products
        const data = [
            { id: 3, title: "Mini Fridge", price: 45000, image: "https://via.placeholder.com/400x300?text=Fridge" }
        ];
        
        document.getElementById('activeAdsCount').innerText = data.length;

        if(data.length === 0) {
            container.innerHTML = `<p class="text-gray-500">No active ads. Post one to get started!</p>`;
            return;
        }

        container.innerHTML = data.map(p => `
          <div class="bg-geminiBgLight dark:bg-geminiBgDark p-4 rounded-[1.5rem] flex gap-4 items-center">
            <img src="${p.image}" class="w-20 h-20 rounded-xl object-cover">
            <div class="flex-grow">
              <h3 class="font-medium truncate">${p.title}</h3>
              <p class="text-primary dark:text-primaryDark text-sm font-semibold">₦${p.price.toLocaleString()}</p>
            </div>
            <button class="text-gray-400 hover:text-red-500 p-2 transition-colors">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
            </button>
          </div>
        `).join('');
    }

    function logout() {
      localStorage.clear();
      location.reload();
    }

    // Run Initialization
    initApp();
  </script>
</body>
</html>
