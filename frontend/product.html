<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details - CampusDealz</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: { brand: '#ea580c', navy: '#1e293b' } } }
    }
    // Shared Theme Logic from buyer.html
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark')
    } else { document.documentElement.classList.remove('dark') }

    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
      localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
    }
  </script>
  <style>
    .sticky-box { top: 5rem; }
  </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen transition-colors duration-200">

<div id="sidebarOverlay" class="fixed inset-0 bg-black/50 z-40 hidden opacity-0 transition-opacity duration-300" onclick="closeSidebar()"></div>

<div id="sidebar" class="fixed inset-y-0 left-0 w-72 bg-white dark:bg-gray-800 shadow-2xl z-50 transform -translate-x-full transition-transform duration-300 ease-in-out flex flex-col">
  <div class="p-5 flex justify-between items-center border-b border-gray-100 dark:border-gray-700">
    <span class="text-xl font-extrabold text-navy dark:text-white tracking-tight">Menu</span>
    <button onclick="closeSidebar()" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 transition">
      <svg class="w-6 h-6 text-gray-600 dark:text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
    </button>
  </div>
  <div class="flex-grow p-4">
    <ul class="space-y-1">
        <li><a href="buyer.html" class="block px-3 py-2 rounded-lg hover:bg-orange-50 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-200 transition font-medium">🏠 Home</a></li>
        <li><a href="seller.html" class="block px-3 py-2 rounded-lg hover:bg-orange-50 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-200 transition font-medium">💰 Sell Items</a></li>
    </ul>
  </div>
</div>

<nav class="bg-white dark:bg-gray-800 shadow-sm sticky top-0 z-30">
  <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
    <div class="flex items-center gap-2">
      <button onclick="openSidebar()" class="p-2 -ml-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition">
        <svg class="w-6 h-6 text-navy dark:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
      </button>
      <span class="text-xl font-extrabold text-navy dark:text-white tracking-tight">CampusDealz</span>
    </div>
    <div class="flex items-center gap-4">
      <button onclick="toggleTheme()" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 transition">🌓</button>
      <button onclick="goBack()" class="text-sm font-bold text-brand hover:underline">Back to List</button>
    </div>
  </div>
</nav>

<main class="max-w-7xl mx-auto p-4 md:p-6 lg:p-8">
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">
    
    <div class="lg:col-span-2 space-y-4">
      <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm overflow-hidden border border-gray-100 dark:border-gray-700">
        <div class="relative h-72 md:h-[500px] bg-gray-50 dark:bg-gray-900/50">
          <img id="image" class="w-full h-full object-contain" alt="Product Image">
          <div class="absolute top-4 left-4">
            <span id="categoryLabel" class="bg-navy/90 text-white text-[10px] font-bold px-3 py-1 rounded-full uppercase tracking-widest backdrop-blur-sm"></span>
          </div>
        </div>
      </div>

      <div class="bg-white dark:bg-gray-800 p-6 md:p-8 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700">
        <div class="flex justify-between items-start mb-2">
          <h1 id="title" class="text-2xl md:text-3xl font-extrabold text-navy dark:text-white"></h1>
          <button class="p-2 text-gray-300 hover:text-brand transition"><svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg></button>
        </div>
        
        <div class="flex items-baseline gap-2 mb-6">
          <span id="price" class="text-3xl font-black text-brand"></span>
          <span class="text-sm text-gray-400 dark:text-gray-500 font-semibold uppercase tracking-tighter">Negotiable</span>
        </div>

        <hr class="border-gray-100 dark:border-gray-700 mb-6">
        
        <div class="prose dark:prose-invert max-w-none">
          <h3 class="text-lg font-bold text-navy dark:text-white mb-3">Description</h3>
          <p id="description" class="text-gray-600 dark:text-gray-400 leading-relaxed whitespace-pre-line"></p>
        </div>
      </div>
    </div>

    <div class="lg:col-span-1 space-y-4 lg:sticky lg:top-24">
      <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700">
        <div class="flex items-center gap-4 mb-6">
          <div id="sellerInitial" class="w-14 h-14 bg-orange-100 dark:bg-orange-900/30 text-brand rounded-full flex items-center justify-center text-xl font-black border-2 border-brand/10">
            ?
          </div>
          <div>
            <h2 id="storeName" class="text-lg font-bold text-navy dark:text-white leading-tight"></h2>
                <p id="sellerName" class="text-sm text-gray-500"></p>
            <!-- <h2 id="sellerName" class="text-lg font-bold text-navy dark:text-white leading-tight"></h2> -->
            <div class="flex items-center text-xs text-green-600 font-bold mt-1">
                <svg class="w-3 h-3 mr-1" fill="currentColor" viewBox="0 0 20 20"><path d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"></path></svg>
                Verified Student
            </div>
          </div>
        </div>

        <div class="space-y-3 mb-6">
          <button onclick="startChat()" class="w-full bg-brand hover:bg-orange-600 text-white font-bold py-4 rounded-xl shadow-lg shadow-orange-100 dark:shadow-none transition-all flex justify-center items-center gap-2">
            Show Contact / Chat
          </button>
          <button class="w-full bg-navy hover:bg-black text-white font-bold py-4 rounded-xl transition-colors">
            Share Advertisement
          </button>
        </div>

        <div class="p-4 bg-gray-50 dark:bg-gray-900/40 rounded-xl border border-gray-100 dark:border-gray-700">
            <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-3">Safety First</p>
            <ul class="text-xs text-gray-600 dark:text-gray-400 space-y-2">
                <li class="flex items-start gap-2"><span>🛡️</span> Meet in an open campus area</li>
                <li class="flex items-start gap-2"><span>🔍</span> Check quality before payment</li>
                <li class="flex items-start gap-2"><span>❌</span> No advance payments</li>
            </ul>
        </div>
      </div>

      <button class="w-full py-4 text-sm font-bold text-gray-400 hover:text-red-500 transition-colors uppercase tracking-widest">
        Report Abuse
      </button>
    </div>
  </div>
</main>

<script>
// Sidebar Logic (From buyer.html)
function openSidebar() {
  document.getElementById('sidebarOverlay').classList.remove('hidden');
  setTimeout(() => {
    document.getElementById('sidebarOverlay').classList.remove('opacity-0');
    document.getElementById('sidebar').classList.remove('-translate-x-full');
  }, 10);
}
function closeSidebar() {
  document.getElementById('sidebarOverlay').classList.add('opacity-0');
  document.getElementById('sidebar').classList.add('-translate-x-full');
  setTimeout(() => document.getElementById('sidebarOverlay').classList.add('hidden'), 300);
}

const BACKEND = "https://marketplace-5nn2.onrender.com";
let productData = null;

async function loadProduct() {
  try {
    const id = new URLSearchParams(window.location.search).get("id");
    const res = await fetch(`${BACKEND}/api/products/${id}`);
    if (!res.ok) { alert("Ad not found ❌"); return; }
    
    const data = await res.json();
    productData = data;

    document.getElementById("image").src = data.image;
    document.getElementById("title").innerText = data.title;
    document.getElementById("description").innerText = data.description || "No description provided.";
    document.getElementById("price").innerText = "₦" + data.price.toLocaleString();
    document.getElementById("categoryLabel").innerText = data.category || "General";

    // const sellerName = data.seller_name || "Campus Seller";
    // document.getElementById("sellerName").innerText = sellerName;
    // document.getElementById("sellerInitial").innerText = sellerName.charAt(0).toUpperCase();

    // 🔥 GET DATA FROM users
      const storeName = data.users?.store_name || "Campus Store";
      const sellerName = data.users?.name || "Unknown Seller";

// 🔥 SET UI
      document.getElementById("storeName").innerText = storeName;
      document.getElementById("sellerName").innerText = sellerName;

// 🔥 SET INITIAL
      document.getElementById("sellerInitial").innerText =
      sellerName.charAt(0).toUpperCase();

    console.log(data);

  } catch (err) { console.error(err); }
}

function startChat() {
  if (!productData) return;
  window.location.href = `chat.html?product=${productData.id}&seller=${productData.user_id}`;
}

function goBack() { window.history.back(); }
loadProduct();
</script>
</body>
</html>
