<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Details</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-5">

<div class="max-w-3xl mx-auto bg-white p-5 rounded shadow">

  <button onclick="goBack()" class="mb-4 text-blue-500">← Back</button>

  <img id="image" class="w-full h-64 object-cover rounded mb-4">

  <h1 id="title" class="text-2xl font-bold"></h1>
  <p id="category" class="text-blue-500 text-sm mb-2"></p>
  <p id="description" class="text-gray-700 mb-3"></p>
  <p id="price" class="text-green-600 text-xl font-bold"></p>

  <button id="contactBtn" 
    class="w-full bg-blue-600 text-white py-2 mt-4 rounded">
    Contact Seller
  </button>

  <button onclick="startChat()" class="bg-blue-600 text-white p-2 rounded">
  Chat Seller
  </button>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const id = params.get("id");

async function loadProduct() {
  const res = await fetch(`https://marketplace-5nn2.onrender.com/api/products/${id}`);
  
  if (!res.ok) {
  alert("Product not found ❌");
  return;
}

const p = await res.json();

  document.getElementById("image").src = p.image;
  document.getElementById("title").innerText = p.title;
  document.getElementById("description").innerText = p.description;
  document.getElementById("price").innerText = "₦" + p.price;
  document.getElementById("category").innerText = p.category || "General";

  document.getElementById("contactBtn").onclick = () => {
    const message = `Hello, I'm interested in "${p.title}"`;
    alert(message);
  };
}


  function startChat() {
  const productId = new URLSearchParams(window.location.search).get("id");
  const sellerId = product.user_id;

  window.location.href = `chat.html?product=${productId}&seller=${sellerId}`;
  }
  
function goBack() {
  window.history.back();
}

loadProduct();
</script>

</body>
</html>
