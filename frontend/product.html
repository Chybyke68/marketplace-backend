<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details - CampusDealz</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: { brand: '#ea580c', navy: '#1e293b' } } }
    }
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark')
    } else { document.documentElement.classList.remove('dark') }
    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
      localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
    }
  </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen pb-20 md:pb-0">

<div id="sidebarOverlay" class="fixed inset-0 bg-black/50 z-40 hidden opacity-0 transition-opacity duration-300" onclick="closeSidebar()"></div>

<div id="sidebar" class="fixed inset-y-0 left-0 w-72 bg-white dark:bg-gray-800 shadow-2xl z-50 transform -translate-x-full transition-transform duration-300 ease-in-out flex flex-col">
  <div class="p-5 flex justify-between items-center border-b border-gray-100 dark:border-gray-700">
    <span class="text-xl font-black text-navy dark:text-white">Menu</span>
    <button onclick="closeSidebar()" class="p-2 text-gray-400">✕</button>
  </div>
  <div class="flex-grow p-4">
    <ul class="space-y-1">
        <li><a href="buyer.html" class="block px-3 py-2 rounded text-gray-700 font-bold">🏠 Home</a></li>
        <li><a href="seller.html" class="block px-3 py-2 rounded text-gray-700 font-bold">💰 Sell Items</a></li>
    </ul>
  </div>
</div>

<nav class="bg-white dark:bg-gray-800 shadow-sm sticky top-0 z-30 border-b border-gray-200 dark:border-gray-700">
  <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <button onclick="goBack()" class="text-brand font-bold text-sm tracking-widest hidden md:block mr-2">← BACK</button>
      <div class="w-8 h-8 bg-brand rounded flex items-center justify-center text-white font-black text-xs">CD</div>
      <span class="text-xl font-black text-navy dark:text-white tracking-tight">CampusDealz</span>
    </div>
    <div class="flex items-center gap-4">
      <button onclick="toggleTheme()" class="p-2 text-gray-400">🌓</button>
      <button onclick="goBack()" class="md:hidden text-sm font-bold text-gray-500">Close</button>
    </div>
  </div>
</nav>

<main class="max-w-6xl mx-auto p-4 md:p-6 lg:py-8">
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">
    
    <div class="lg:col-span-2 space-y-4">
      <div class="bg-white dark:bg-gray-800 rounded shadow-sm border border-gray-200 dark:border-gray-700">
        <div class="relative h-72 md:h-[450px] bg-black flex items-center justify-center">
          <img id="image" class="max-h-full object-contain" alt="Product Image">
        </div>
      </div>

      <div class="bg-white dark:bg-gray-800 p-6 rounded shadow-sm border border-gray-200 dark:border-gray-700">
        <h1 id="title" class="text-xl md:text-2xl font-bold text-navy dark:text-white mb-2"></h1>
        <span id="categoryLabel" class="bg-gray-100 dark:bg-gray-700 text-gray-500 dark:text-gray-300 text-[10px] font-bold px-2 py-1 rounded uppercase"></span>
        
        <div class="mt-6 border-t border-gray-100 dark:border-gray-700 pt-6">
          <h3 class="text-xs font-black text-gray-400 uppercase tracking-widest mb-3">Description</h3>
          <p id="description" class="text-gray-600 dark:text-gray-400 text-sm leading-relaxed whitespace-pre-line"></p>
        </div>
      </div>
    </div>

    <div class="lg:col-span-1 space-y-4 lg:sticky lg:top-24">
      <div class="bg-white dark:bg-gray-800 p-6 rounded shadow-sm border-t-4 border-brand border-x border-b border-gray-200 dark:border-gray-700">
        <div class="mb-6">
           <span id="price" class="text-3xl font-black text-brand"></span>
        </div>

        <div class="flex items-center gap-4 mb-6 p-3 bg-gray-50 dark:bg-gray-700/50 rounded cursor-pointer border border-gray-100 dark:border-gray-600" onclick="goToSeller()">
          <div id="sellerInitial" class="w-12 h-12 bg-brand text-white rounded-full flex items-center justify-center text-xl font-black">?</div>
          <div>
            <h2 id="storeName" class="font-bold text-navy dark:text-white leading-tight"></h2>
            <p id="sellerName" class="text-xs text-gray-500"></p>
          </div>
        </div>

        <button onclick="startChat()" class="w-full bg-brand hover:bg-orange-600 text-white font-bold py-3.5 rounded shadow-sm transition-all mb-3 text-sm">
          SHOW CONTACT
        </button>
        <button class="w-full border-2 border-brand text-brand font-bold py-3 rounded transition-colors text-sm hover:bg-orange-50 dark:hover:bg-gray-700">
          START CHAT
        </button>
      </div>

      <div class="p-4 bg-orange-50 dark:bg-orange-900/20 rounded border border-orange-100 dark:border-orange-900/50">
          <p class="text-xs font-black text-orange-800 dark:text-orange-500 uppercase tracking-widest mb-2">Safety Tips</p>
          <ul class="text-[11px] text-orange-700 dark:text-orange-400 space-y-1">
              <li>• Meet in open campus areas</li>
              <li>• Inspect item before paying</li>
              <li>• Do not pay in advance</li>
          </ul>
      </div>
    </div>
  </div>
</main>

<script>
function openSidebar() {
  document.getElementById('sidebarOverlay').classList.remove('hidden');
  setTimeout(() => {
    document.getElementById('sidebarOverlay').classList.remove('opacity-0');
    document.getElementById('sidebar').classList.remove('-translate-x-full');
  }, 10);
}
function closeSidebar() {
  document.getElementById('sidebarOverlay').classList.add('opacity-0');
  document.getElementById('sidebar').classList.add('-translate-x-full');
  setTimeout(() => document.getElementById('sidebarOverlay').classList.add('hidden'), 300);
}

const BACKEND = "https://marketplace-5nn2.onrender.com";
let productData = null;

async function loadProduct() {
  try {
    const id = new URLSearchParams(window.location.search).get("id");
    const res = await fetch(`${BACKEND}/api/products/${id}`);
    if (!res.ok) { alert("Ad not found ❌"); return; }
    
    const data = await res.json();
    productData = data;

    document.getElementById("image").src = data.image;
    document.getElementById("title").innerText = data.title;
    document.getElementById("description").innerText = data.description || "No description provided.";
    document.getElementById("price").innerText = "₦" + data.price.toLocaleString();
    document.getElementById("categoryLabel").innerText = data.category || "General";

      const storeName = data.users?.store_name || "Campus Store";
      const sellerName = data.users?.name || "Unknown Seller";

      document.getElementById("storeName").innerText = storeName;
      document.getElementById("sellerName").innerText = sellerName;

      document.getElementById("sellerInitial").innerText =
      sellerName.charAt(0).toUpperCase();

    console.log(data);

  } catch (err) { console.error(err); }
}

function goToSeller() {
  if (!productData) return;
  window.location.href = `seller.html?user=${productData.user_id}`;
}


function startChat() {
  if (!productData) return;

  const message = `Hi, I’m interested in your ${productData.title} (₦${Number(productData.price).toLocaleString()})`;

  const encodedMessage = encodeURIComponent(message);

  window.location.href =
    `chat.html?product=${productData.id}&seller=${productData.user_id}&msg=${encodedMessage}`;
}

function goBack() { window.history.back(); }
loadProduct();
</script>
</body>
</html>
