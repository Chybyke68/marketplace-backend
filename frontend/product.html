<!DOCTYPE html>
<html lang="en">

<body class="bg-gray-100 p-5">

<div class="max-w-3xl mx-auto bg-white p-5 rounded shadow">

  <button onclick="goBack()" class="mb-4 text-blue-500">← Back</button>

  <img id="image" class="w-full h-64 object-cover rounded mb-4">

  <h1 id="title" class="text-2xl font-bold"></h1>
  <p id="category" class="text-blue-500 text-sm mb-2"></p>
  <p id="description" class="text-gray-700 mb-3"></p>
  <p id="price" class="text-green-600 text-xl font-bold"></p>

  <button onclick="startChat()" 
  class="bg-green-600 text-white w-full p-2 rounded mt-2">

<script>

const id = params.get("id");

  if (!res.ok) {
  alert("Product not found ❌");

  let productData = null;

// LOAD PRODUCT
async function loadProduct() {
  const id = new URLSearchParams(window.location.search).get("id");

  const res = await fetch(`https://marketplace-5nn2.onrender.com/api/products/${id}`);
  const data = await res.json();

  productData = data; // ✅ store product

  document.getElementById("product").innerHTML = `
    <img src="${data.image}" class="w-full h-60 object-cover mb-3">
    <h2 class="text-xl font-bold">${data.title}</h2>
    <p>${data.description}</p>
    <p class="text-green-600 font-bold">₦${data.price}</p>
  `;
}


// START CHAT
function startChat() {
  if (!productData) {
    alert("Product not loaded yet");
    return;
  }

  const productId = productData.id;
  const sellerId = productData.user_id;

  window.location.href = `chat.html?product=${productId}&seller=${sellerId}`;
}


// LOAD PAGE
loadProduct();
  
  
function goBack() {
  window.history.back();
}

//loadProduct();
</script>

</body>
