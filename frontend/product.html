<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CampusDealz - Product</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-5">

<div class="max-w-4xl mx-auto" id="productDetail"></div>

<script>
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");

  async function loadProduct() {
    const res = await fetch("http://localhost:5000/api/products");
    const data = await res.json();

    const product = data.find(p => p.id === id);

    if (!product) {
      document.getElementById("productDetail").innerHTML = "<p>Product not found</p>";
      return;
    }

    document.getElementById("productDetail").innerHTML = `
      <div class="bg-white rounded shadow p-5">
        <img src="${product.image}" class="w-full h-80 object-cover mb-4">

        <h1 class="text-2xl font-bold">${product.title}</h1>
        <p class="text-gray-600 mt-2">${product.description}</p>

        <p class="text-green-600 text-xl font-bold mt-4">₦${product.price}</p>

        <button onclick="history.back()" 
          class="mt-5 bg-blue-500 text-white px-4 py-2 rounded">
          Back
        </button>
      </div>
    `;
  }

  loadProduct();
</script>

</body>
</html>
