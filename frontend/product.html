<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details - CampusDealz</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: { brand: '#ea580c', navy: '#1e293b' } } }
    }
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark')
    } else { document.documentElement.classList.remove('dark') }
  </script>
  <style>
    .sticky-box { top: 5rem; }
  </style>
</head>

<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen transition-colors duration-200">

<nav class="bg-white dark:bg-gray-800 shadow-sm sticky top-0 z-30 mb-4 md:mb-8">
  <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
    <button onclick="goBack()" class="flex items-center text-navy dark:text-white font-bold hover:text-brand transition">
      <svg class="w-6 h-6 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
      Back
    </button>
    <span class="text-lg font-extrabold text-navy dark:text-white tracking-tight">CampusDealz</span>
    <div class="w-8"></div> </div>
</nav>

<main class="max-w-6xl mx-auto px-4 pb-24 md:pb-12">
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">
    
    <div class="lg:col-span-2 space-y-4">
      <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm overflow-hidden border border-gray-200 dark:border-gray-700">
        <div class="relative h-64 md:h-[450px] bg-gray-200 dark:bg-gray-700">
          <img id="image" class="w-full h-full object-contain mx-auto" alt="Product Image">
          <div class="absolute bottom-4 left-4">
            <span id="categoryLabel" class="bg-navy/80 text-white text-[10px] font-bold px-3 py-1 rounded-full uppercase tracking-wider backdrop-blur-sm"></span>
          </div>
        </div>
      </div>

      <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700">
        <div class="flex justify-between items-start mb-4">
          <h1 id="title" class="text-2xl md:text-3xl font-extrabold text-navy dark:text-white leading-tight"></h1>
          <button class="p-2 text-gray-400 hover:text-red-500 transition">
             <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
          </button>
        </div>
        
        <div class="flex items-center gap-2 mb-6">
          <span id="price" class="text-3xl font-black text-brand"></span>
          <span class="text-sm text-gray-400 line-through decoration-1">₦45,000</span> </div>

        <hr class="border-gray-100 dark:border-gray-700 mb-6">
        
        <div>
          <h3 class="text-lg font-bold text-navy dark:text-white mb-3">Description</h3>
          <p id="description" class="text-gray-600 dark:text-gray-400 leading-relaxed whitespace-pre-line"></p>
        </div>
      </div>
    </div>

    <div class="lg:col-span-1 space-y-4 sticky-box lg:sticky">
      <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700">
        <div class="flex items-center gap-4 mb-6">
          <div id="sellerInitial" class="w-16 h-16 bg-orange-100 dark:bg-orange-900/30 text-brand rounded-full flex items-center justify-center text-2xl font-black border-2 border-brand/20">
            ?
          </div>
          <div>
            <h2 id="sellerName" class="text-xl font-bold text-navy dark:text-white">Seller Name</h2>
            <div class="flex items-center text-sm text-gray-500 dark:text-gray-400 gap-1">
              <svg class="w-4 h-4 text-yellow-400" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>
              <span>4.8 (12 Reviews)</span>
            </div>
          </div>
        </div>

        <div class="space-y-3 mb-6">
          <button onclick="startChat()" class="w-full bg-brand hover:bg-orange-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-orange-200 dark:shadow-none transition-all flex justify-center items-center gap-2">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
            Show Contact / Chat
          </button>
          <a href="#" class="block text-center w-full bg-navy hover:bg-black text-white font-bold py-4 rounded-xl transition-colors">
            View Seller Profile
          </a>
        </div>

        <div class="bg-orange-50 dark:bg-gray-700/50 p-4 rounded-xl border border-orange-100 dark:border-gray-600">
          <h4 class="text-xs font-bold text-brand uppercase tracking-widest mb-2">Safety Tips</h4>
          <ul class="text-xs text-gray-600 dark:text-gray-300 space-y-2">
            <li class="flex gap-2"><span>✅</span> Meet in a public campus location</li>
            <li class="flex gap-2"><span>✅</span> Inspect the item before paying</li>
            <li class="flex gap-2"><span>✅</span> Avoid paying in advance</li>
          </ul>
        </div>
      </div>

      <button class="w-full text-center py-4 border-2 border-gray-200 dark:border-gray-700 rounded-2xl text-gray-500 font-bold hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors">
        Report This Ad
      </button>
    </div>
  </div>
</main>

<div class="md:hidden fixed bottom-0 left-0 right-0 bg-white dark:bg-gray-800 p-4 border-t border-gray-100 dark:border-gray-700 flex gap-3 z-50">
    <button onclick="startChat()" class="flex-1 bg-brand text-white font-bold py-3 rounded-xl shadow-lg">Chat</button>
    <button class="flex-1 bg-navy text-white font-bold py-3 rounded-xl shadow-lg">Call Seller</button>
</div>

<script>
const BACKEND = "https://marketplace-5nn2.onrender.com";
let productData = null;

async function loadProduct() {
  try {
    const id = new URLSearchParams(window.location.search).get("id");
    const res = await fetch(`${BACKEND}/api/products/${id}`);
    if (!res.ok) { alert("Product not found ❌"); return; }
    
    const data = await res.json();
    productData = data;

    // Update Product Details
    document.getElementById("image").src = data.image;
    document.getElementById("title").innerText = data.title;
    document.getElementById("description").innerText = data.description || "The seller hasn't provided a detailed description yet.";
    document.getElementById("price").innerText = "₦" + data.price.toLocaleString();
    document.getElementById("categoryLabel").innerText = data.category || "Uncategorized";

    // Update Seller Info (Simulated or fetched)
    const sellerName = data.seller_name || "Verified Student";
    document.getElementById("sellerName").innerText = sellerName;
    document.getElementById("sellerInitial").innerText = sellerName.charAt(0).toUpperCase();

  } catch (err) { 
    console.error("Error loading product:", err); 
    // Fallback for demo
    document.getElementById("title").innerText = "Item Not Found";
  }
}

function startChat() {
  if (!productData) return;
  window.location.href = `chat.html?product=${productData.id}&seller=${productData.user_id}`;
}

function goBack() { window.history.back(); }
loadProduct();
</script>
</body>
</html>
