<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Details</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-5">

<div class="max-w-3xl mx-auto bg-white p-5 rounded shadow">

  <!-- Back -->
  <button onclick="goBack()" class="mb-4 text-blue-500">← Back</button>

  <!-- Product -->
  <img id="image" class="w-full h-64 object-cover rounded mb-4">

  <h1 id="title" class="text-2xl font-bold"></h1>
  <p id="category" class="text-blue-500 text-sm mb-2"></p>
  <p id="description" class="text-gray-700 mb-3"></p>
  <p id="price" class="text-green-600 text-xl font-bold"></p>

  <!-- Chat Button -->
  <button onclick="startChat()" 
    class="bg-green-600 text-white w-full p-2 rounded mt-4">
    Chat Seller 💬
  </button>

</div>

<script>
const BACKEND = "https://marketplace-5nn2.onrender.com";

let productData = null;


// 🔥 LOAD PRODUCT
async function loadProduct() {
  try {
    const id = new URLSearchParams(window.location.search).get("id");

    const res = await fetch(`${BACKEND}/api/products/${id}`);

    if (!res.ok) {
      alert("Product not found ❌");
      return;
    }

    const data = await res.json();

    productData = data;

    // ✅ SET DATA
    document.getElementById("image").src = data.image;
    document.getElementById("title").innerText = data.title;
    document.getElementById("description").innerText = data.description;
    document.getElementById("price").innerText = "₦" + data.price;
    document.getElementById("category").innerText = data.category || "General";

  } catch (err) {
    console.log("Error loading product");
  }
}


// 💬 START CHAT
function startChat() {
  if (!productData) {
    alert("Product not loaded yet");
    return;
  }

  const productId = productData.id;
  const sellerId = productData.user_id;

  window.location.href = `chat.html?product=${productId}&seller=${sellerId}`;
}


// 🔙 BACK BUTTON
function goBack() {
  window.history.back();
}


// 🚀 INIT
loadProduct();
</script>

</body>
</html>
