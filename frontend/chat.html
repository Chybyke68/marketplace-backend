<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusDealz - Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: { brand: '#ea580c', navy: '#1e293b' } } }
    }
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark')
    } else { document.documentElement.classList.remove('dark') }
  </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 h-screen flex flex-col transition-colors duration-200">

<div id="app-loader" class="fixed inset-0 bg-white dark:bg-gray-900 z-[100] flex items-center justify-center transition-opacity duration-500">
  <img src="logo.png" alt="Loading..." class="w-24 h-24 object-contain animate-pulse mix-blend-multiply dark:bg-white dark:p-2 dark:rounded-xl">
</div>
<script>
  window.addEventListener('load', () => {
    const loader = document.getElementById('app-loader');
    if (loader) {
      loader.classList.add('opacity-0');
      setTimeout(() => loader.style.display = 'none', 500);
    }
  });
</script>

<div class="max-w-2xl mx-auto w-full h-full flex flex-col bg-white dark:bg-gray-800 shadow-xl md:my-5 md:h-[calc(100vh-40px)] md:rounded-2xl overflow-hidden border-0 md:border border-gray-200 dark:border-gray-700">
  
  <div class="bg-white dark:bg-gray-800 shadow-sm border-b border-gray-200 dark:border-gray-700 px-4 py-3 flex items-center justify-between sticky top-0 z-10">
    <div class="flex items-center gap-3">
      <button onclick="window.location.href='messages.html'" class="p-2 -ml-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-500 transition-colors">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
      </button>
      <div class="flex items-center gap-3">
        <img src="logo.png" alt="Logo" class="w-8 h-8 object-contain mix-blend-multiply dark:bg-white dark:rounded dark:p-0.5">
        <div>
          <h1 id="chatHeader" class="font-bold text-navy dark:text-white leading-tight">Loading...</h1>
          <p class="text-xs text-brand font-semibold">Online</p>
        </div>
      </div>
    </div>
  </div>

  <div id="messages" class="flex-grow p-4 overflow-y-auto space-y-4 bg-gray-50 dark:bg-gray-900 scroll-smooth">
  </div>

  <div class="p-4 bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700">
    <div class="flex gap-2">
      <input id="msg" type="text" placeholder="Type a message..." class="flex-grow px-4 py-3 bg-gray-100 dark:bg-gray-700 border-transparent focus:border-brand focus:bg-white dark:focus:bg-gray-800 focus:ring-0 rounded-full text-sm transition-all" onkeypress="if(event.key === 'Enter') sendMessage()"/>
      <button onclick="sendMessage()" class="bg-brand hover:bg-orange-600 text-white w-12 h-12 rounded-full flex items-center justify-center shadow-md hover:shadow-lg transition-all transform active:scale-95">
        <svg class="w-5 h-5 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
      </button>
    </div>
  </div>
</div>

<script>
const BACKEND = "https://marketplace-5nn2.onrender.com";
const token = localStorage.getItem("token");
const urlParams = new URLSearchParams(window.location.search);
const product_id = urlParams.get("product");
const receiver_id = urlParams.get("seller");
const initialMessage = urlParams.get("msg");

let currentUser = null;
try { currentUser = JSON.parse(atob(token.split(".")[1])).id; } catch(e){}

async function loadMessages() {
  try {
    const res = await fetch(`${BACKEND}/api/messages/${product_id}/${receiver_id}`, {
      headers: { Authorization: token }
    });
    const data = await res.json();
    
    const box = document.getElementById("messages");
    box.innerHTML = "";
    
    data.forEach(m => {
      const isMe = m.sender_id === currentUser;
      const time = new Date(m.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
      
      box.innerHTML += `
        <div class="flex w-full ${isMe ? "justify-end" : "justify-start"}">
          <div class="max-w-[75%] md:max-w-[60%] flex flex-col ${isMe ? "items-end" : "items-start"}">
            <div class="p-3 rounded-2xl ${
              isMe 
                ? "bg-brand text-white rounded-br-none shadow-sm" 
                : "bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-100 border border-gray-100 dark:border-gray-700 rounded-bl-none shadow-sm"
            }">
              <p class="text-[15px] leading-relaxed break-words">${m.message}</p>
            </div>
            <span class="text-[10px] text-gray-400 mt-1 mx-1 font-medium">${time}</span>
          </div>
        </div>
      `;
    });
    
    // Auto-scroll logic removed to stop visual jumps
  } catch (err) {
    console.log("Chat load failed");
  }
}

async function fetchChatHeader() {
  try {
    const res = await fetch(`${BACKEND}/api/users/${receiver_id}`);
    const data = await res.json();
    document.getElementById("chatHeader").innerText = data.store_name;
  } catch (err) {
    console.log("Header load failed");
  }
}

async function sendMessage() {
  const input = document.getElementById("msg");
  const text = input.value.trim();
  if (!text) return;

  input.value = ""; // clear immediately for UX
  
  await fetch(`${BACKEND}/api/messages/send`, {
    method: "POST",
    headers: { "Content-Type": "application/json", Authorization: token },
    body: JSON.stringify({ receiver_id, product_id, text })
  });
  
  loadMessages();
  setTimeout(() => {
  const box = document.getElementById("messages");
  box.scrollTo({
    top: box.scrollHeight,
    behavior: "smooth"
  });
}, 100);
}

async function sendInitialMessage() {
  if (!initialMessage) return;

  try {
    await fetch(`${BACKEND}/api/messages/send`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: token
      },
      body: JSON.stringify({
        receiver_id,
        product_id,
        text: decodeURIComponent(initialMessage)
      })
    });

    // remove message from URL so it doesn't resend on refresh
    const url = new URL(window.location);
    url.searchParams.delete("msg");
    window.history.replaceState({}, "", url);

    loadMessages();
    setTimeout(() => {
        const box = document.getElementById("messages");
        box.scrollTo({
            top: box.scrollHeight,
            behavior: "smooth"
        });
    }, 100);
  } catch (err) {
    console.error("Failed to send initial message", err);
  }
}


fetchChatHeader();
loadMessages();

// Only send if there is an initial message in URL
if (initialMessage) {
  sendInitialMessage();
}

setInterval(loadMessages, 3000);
</script>
</body>
</html>
