<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusDealz - Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: { brand: '#ea580c', navy: '#1e293b' } } }
    }
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark')
    } else { document.documentElement.classList.remove('dark') }
  </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 h-screen flex flex-col transition-colors duration-200">

<div class="max-w-2xl mx-auto w-full h-full flex flex-col bg-white dark:bg-gray-800 shadow-xl md:my-5 md:h-[calc(100vh-40px)] md:rounded-2xl overflow-hidden border-0 md:border border-gray-200 dark:border-gray-700">
  
  <div class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 p-4 flex items-center justify-between z-10 shadow-sm">
    <div class="flex items-center gap-3">
      <button onclick="window.history.back()" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 transition">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
      </button>
      <div class="bg-white rounded-full p-1 border dark:border-none">
        <img src="http://googleusercontent.com/generated_image_content/0" class="h-8 w-8 object-contain rounded-full">
      </div>
      <h2 class="text-lg font-bold text-navy dark:text-white">Seller Chat</h2>
    </div>
  </div>

  <div id="messages" class="flex-grow p-4 overflow-y-auto bg-gray-50 dark:bg-gray-900 flex flex-col space-y-3">
    </div>

  <div class="p-4 bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700">
    <form id="chatForm" class="flex gap-2" onsubmit="event.preventDefault(); sendMessage();">
      <input id="msg" placeholder="Type your message..." autocomplete="off" class="flex-grow border border-gray-300 dark:border-gray-600 bg-gray-100 dark:bg-gray-700 rounded-full px-5 py-3 focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent transition" />
      <button type="submit" class="bg-brand hover:bg-orange-700 text-white rounded-full p-3 w-12 h-12 flex items-center justify-center transition-transform active:scale-95 shadow-md">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
      </button>
    </form>
  </div>

</div>

<script>
const BACKEND = "https://marketplace-5nn2.onrender.com"; 
const token = localStorage.getItem("token");
const params = new URLSearchParams(window.location.search);
const product_id = params.get("product");
const receiver_id = params.get("seller");

async function loadMessages() {
  try {
    const res = await fetch(`${BACKEND}/api/messages/${product_id}/${receiver_id}`, {
      headers: { Authorization: token }
    });
    const data = await res.json();
    const box = document.getElementById("messages");
    
    // Check if scroll is at bottom before updating to prevent jumpiness
    const isScrolledToBottom = box.scrollHeight - box.clientHeight <= box.scrollTop + 50;

    box.innerHTML = "";
    data.forEach(m => {
      const isMe = m.sender_id !== receiver_id;
      box.innerHTML += `
        <div class="flex w-full ${isMe ? "justify-end" : "justify-start"}">
          <div class="max-w-[75%] px-4 py-2 rounded-2xl ${isMe ? "bg-brand text-white rounded-br-sm shadow-md" : "bg-gray-200 dark:bg-gray-700 text-gray-900 dark:text-gray-100 rounded-bl-sm shadow-sm"}">
            <p class="text-sm md:text-base">${m.text}</p>
          </div>
        </div>
      `;
    });

    if (isScrolledToBottom) {
      box.scrollTop = box.scrollHeight;
    }
  } catch (err) { console.log("Error loading messages"); }
}

async function sendMessage() {
  const input = document.getElementById("msg");
  const text = input.value.trim();
  if (!text) return;

  input.value = ""; // clear immediately for UX
  
  await fetch(`${BACKEND}/api/messages/send`, {
    method: "POST",
    headers: { "Content-Type": "application/json", Authorization: token },
    body: JSON.stringify({ receiver_id, product_id, text })
  });
  
  loadMessages();
  setTimeout(() => {
     const box = document.getElementById("messages");
     box.scrollTop = box.scrollHeight;
  }, 100);
}

setInterval(loadMessages, 2000);
loadMessages();
</script>
</body>
</html>
