<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusDealz - Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: { brand: '#ea580c', navy: '#1e293b' } } }
    }
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark')
    } else { document.documentElement.classList.remove('dark') }
  </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 h-screen flex flex-col transition-colors duration-200">

<div class="max-w-2xl mx-auto w-full h-full flex flex-col bg-white dark:bg-gray-800 shadow-xl md:my-5 md:h-[calc(100vh-40px)] md:rounded-2xl overflow-hidden border-0 md:border border-gray-200 dark:border-gray-700">
  
  <div class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 p-4 flex items-center justify-between z-10 shadow-sm">
    <div class="flex items-center gap-3">
      <button onclick="window.history.back()" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 transition">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
      </button>
      <div class="bg-white rounded-full p-1 border dark:border-none">
        <img src="logo.png" class="h-8 w-8 object-contain rounded-full">
      </div>
      <h2 class="text-lg font-bold text-navy dark:text-white">Seller Chat</h2>
    </div>
  </div>
<!-- 🔥 PRODUCT PREVIEW -->
<div id="productPreview" class="p-3 border-b bg-gray-50 dark:bg-gray-700 hidden">
  <div onclick="openProductFromChat()" class="flex gap-3 items-center cursor-pointer">
    
    <img id="chatProductImage" class="w-12 h-12 object-cover rounded">
    
    <div>
      <p id="chatProductTitle" class="font-bold text-sm"></p>
      <p id="chatProductPrice" class="text-brand text-xs font-bold"></p>
    </div>

  </div>
</div>

  <p id="typingIndicator"
   class="text-xs text-gray-400 px-4 hidden">
   Seller is typing...
  </p>
  
  <div id="messages" class="flex-grow p-4 overflow-y-auto bg-gray-50 dark:bg-gray-900 flex flex-col space-y-3">
    </div>

  <div class="p-4 bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700">
    <form id="chatForm" class="flex gap-2" onsubmit="event.preventDefault(); sendMessage();">
      <input id="msg" placeholder="Type your message..." autocomplete="off" class="flex-grow border border-gray-300 dark:border-gray-600 bg-gray-100 dark:bg-gray-700 rounded-full px-5 py-3 focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent transition" />
      <button type="submit" class="bg-brand hover:bg-orange-700 text-white rounded-full p-3 w-12 h-12 flex items-center justify-center transition-transform active:scale-95 shadow-md">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
      </button>
    </form>
  </div>

</div>

<script>
const BACKEND = "https://marketplace-5nn2.onrender.com"; 
const token = localStorage.getItem("token");
let currentUserId = null;

if (token) {
  try {
    const user = JSON.parse(atob(token.split(".")[1]));
    currentUserId = user.id;
  } catch (e) {
    console.log("Invalid token");
  }
}
const params = new URLSearchParams(window.location.search);
const product_id = params.get("product");
const receiver_id = params.get("seller");
const initialMessage = params.get("msg");
  let typingTimeout;

async function loadMessages() {
  try {
    const res = await fetch(`${BACKEND}/api/messages/${product_id}/${receiver_id}`, {
      headers: { Authorization: token }
    });
    const data = await res.json();
    const box = document.getElementById("messages");
    if (!data || data.length === 0) {
  box.innerHTML = `
    <div class="flex flex-col items-center justify-center h-full text-gray-400 text-sm">
      <p class="mb-2">No messages yet</p>
      <p class="text-xs">Start the conversation 👇</p>
    </div>
  `;
  return;
}
    
    // Check if scroll is at bottom before updating to prevent jumpiness
    const isScrolledToBottom = box.scrollHeight - box.clientHeight <= box.scrollTop + 50;

    box.innerHTML = "";
    data.forEach(m => {
      const isMe = m.sender_id === currentUserId;
     box.innerHTML += `
  <div class="flex w-full ${isMe ? "justify-end" : "justify-start"}">
    
    <div class="max-w-[75%] px-4 py-2 rounded-2xl ${
      isMe 
        ? "bg-brand text-white rounded-br-sm shadow-md" 
        : "bg-gray-200 dark:bg-gray-700 text-gray-900 dark:text-gray-100 rounded-bl-sm shadow-sm"
    }">

      <!-- 🔥 ADD THIS LABEL -->
      <p class="text-[10px] opacity-70 mb-1">
        ${isMe ? "You" : "Seller"}
      </p>

      <p class="text-sm md:text-base">${m.text}</p>

<p class="text-[10px] opacity-70 mt-1 text-right">
  ${new Date(m.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
</p>

${isMe ? `<span class="text-[10px] ml-1">✓✓</span>` : ""}

    </div>

  </div>
`;
    });

   if (isScrolledToBottom) {
  box.scrollTo({
    top: box.scrollHeight,
    behavior: "smooth"
  });
}
  } catch (err) { console.log("Error loading messages"); }
}

async function loadChatHeader() {
  try {
    const res = await fetch(`${BACKEND}/api/products/${product_id}`);
    const data = await res.json();

    const storeName = data.users?.store_name || "Seller";

    document.querySelector("h2").innerText = storeName;
  } catch (err) {
    console.log("Header load failed");
  }
}

async function sendMessage() {
  const input = document.getElementById("msg");
  const text = input.value.trim();
  if (!text) return;

  input.value = ""; // clear immediately for UX
  
  await fetch(`${BACKEND}/api/messages/send`, {
    method: "POST",
    headers: { "Content-Type": "application/json", Authorization: token },
    body: JSON.stringify({ receiver_id, product_id, text })
  });
  
  loadMessages();
  setTimeout(() => {
  const box = document.getElementById("messages");
  box.scrollTo({
    top: box.scrollHeight,
    behavior: "smooth"
  });
}, 100);

  
}

async function sendInitialMessage() {
  if (!initialMessage) return;

  try {
    await fetch(`${BACKEND}/api/messages/send`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: token
      },
      body: JSON.stringify({
        receiver_id,
        product_id,
        text: decodeURIComponent(initialMessage)
      })
    });

    // remove message from URL so it doesn't resend on refresh
    const url = new URL(window.location);
    url.searchParams.delete("msg");
    window.history.replaceState({}, "", url);

  } catch (err) {
    console.log("Initial message failed");
  }
}

async function loadProductPreview() {
  try {
    const res = await fetch(`${BACKEND}/api/products/${product_id}`);
    const data = await res.json();

    document.getElementById("productPreview").classList.remove("hidden");

    document.getElementById("chatProductImage").src = data.image;
    document.getElementById("chatProductTitle").innerText = data.title;
    document.getElementById("chatProductPrice").innerText =
      "₦" + Number(data.price).toLocaleString();

  } catch (err) {
    console.log("Preview failed");
  }
}

function openProductFromChat() {
  window.location.href = `product.html?id=${product_id}`;
}


  // 🔥 STEP 5 — DETECT TYPING
document.getElementById("msg").addEventListener("input", () => {

  clearTimeout(typingTimeout);

  // 🔥 SEND TYPING SIGNAL
  fetch(`${BACKEND}/api/messages/typing`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      Authorization: token
    },
    body: JSON.stringify({
      product_id: product_id
    })
  });

  // optional timeout (handled by backend)
  typingTimeout = setTimeout(() => {}, 2000);

});

  async function checkTyping() {
  try {
    const res = await fetch(
      `${BACKEND}/api/messages/typing-status?product=${product_id}&user=${receiver_id}`
    );

    const data = await res.json();

    const el = document.getElementById("typingIndicator");

    if (data.typing) {
      el.classList.remove("hidden");
    } else {
      el.classList.add("hidden");
    }

  } catch (err) {
    console.log("Typing check failed");
  }
  }
  
  
setInterval(loadMessages, 2000);
  setInterval(checkTyping, 1500);
loadChatHeader();
(async () => {
  await sendInitialMessage();
  await loadProductPreview();
  loadMessages();
  
})();
</script>
</body>
</html>
