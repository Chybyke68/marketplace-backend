<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CampusDealz - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center h-screen">

  <div class="bg-white p-6 rounded shadow w-80">
    <h2 class="text-xl font-bold mb-4 text-center">Login to CampusDealz</h2>

    <form id="loginForm">
      <input type="email" id="email" placeholder="Email" class="border p-2 w-full mb-2" required>
      <input type="password" id="password" placeholder="Password" class="border p-2 w-full mb-3" required>

      <button class="bg-blue-500 text-white w-full py-2 rounded">Login</button>
    </form>
  </div>

<script>

document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    console.log("Login clicked"); // debug

    const res = await fetch("https://marketplace-5nn2.onrender.com/api/auth/login", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        email: document.getElementById("email").value,
        password: document.getElementById("password").value
      })
    });

    const data = await res.json();
    console.log("Response:", data); // debug

    if (data.token) {
      localStorage.setItem("token", data.token);
      window.location.href = "index.html";
    } else {
      alert("Login failed");
    }
  });
});
</script>
</script>

</body>
</html>
