<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CampusDealz - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center h-screen">

  <div class="bg-white p-6 rounded shadow w-80">
    <h2 class="text-xl font-bold mb-4 text-center">Login to CampusDealz</h2>

    <form id="loginForm">
      <input type="email" id="email" placeholder="Email" class="border p-2 w-full mb-2" required>
      <input type="password" id="password" placeholder="Password" class="border p-2 w-full mb-3" required>

      <button class="bg-blue-500 text-white w-full py-2 rounded">Login</button>
      
    </form>
    <p class="text-sm mt-3 text-center">
  Don't have an account? 
  <a href="register.html" class="text-blue-500">Register</a>
    </p>

  </div>

</body>
<script>
document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    console.log("Login clicked");

    try {
      const res = await fetch("https://marketplace-5nn2.onrender.com/api/auth/login", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          email: document.getElementById("email").value,
          password: document.getElementById("password").value
        })
      });

      console.log("Status:", res.status);

      const data = await res.json();
      console.log("Response:", data);

      if (data.token) {
        localStorage.setItem("token", data.token);
        alert("Login successful ✅");
        const user = JSON.parse(atob(data.token.split(".")[1]));

     if (user.role === "seller") {
        window.location.href = "seller.html";
     } else {
        window.location.href = "buyer.html";
     }
        
        alert(data.message || "Login failed");
      }

    } catch (err) {
      console.error("ERROR:", err);
      alert("Server error or network issue");
    }
  });
});
</script>


</html>
