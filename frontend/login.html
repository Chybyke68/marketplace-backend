<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusDealz - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: { brand: '#ea580c', navy: '#1e293b' } } }
    }
    // Dark mode init
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark')
    } else { document.documentElement.classList.remove('dark') }
  </script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 flex items-center justify-center min-h-screen p-4 transition-colors duration-200">

  <div class="bg-white dark:bg-gray-800 p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100 dark:border-gray-700">
    <div class="flex flex-col items-center mb-6">
      <div class="bg-white rounded-full p-2 shadow-sm mb-3">
        <img src="http://googleusercontent.com/generated_image_content/0" alt="CampusDealz Logo" class="h-16 w-16 object-contain rounded-full">
      </div>
      <h2 class="text-2xl font-extrabold text-navy dark:text-white">CampusDealz</h2>
      <p class="text-gray-500 dark:text-gray-400 text-sm">Welcome back! Please login.</p>
    </div>

    <form id="loginForm" class="space-y-4">
      <div>
        <input type="email" id="email" placeholder="Email Address" class="w-full border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-brand transition" required>
      </div>
      <div>
        <input type="password" id="password" placeholder="Password" class="w-full border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-brand transition" required>
      </div>
      <button type="submit" class="w-full bg-brand hover:bg-orange-700 text-white font-bold py-3 rounded-lg shadow-md transition-transform active:scale-95">Login to Account</button>
    </form>
    
    <p class="text-sm mt-6 text-center text-gray-600 dark:text-gray-400">
      Don't have an account? 
      <a href="register.html" class="text-brand hover:underline font-semibold">Register here</a>
    </p>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("loginForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        try {
          const res = await fetch("https://marketplace-5nn2.onrender.com/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              email: document.getElementById("email").value,
              password: document.getElementById("password").value
            })
          });

          const data = await res.json();
          if (data.token) {
            localStorage.setItem("token", data.token);
            const user = JSON.parse(atob(data.token.split(".")[1]));
            window.location.href = user.role === "seller" ? "seller.html" : "buyer.html";
          } else {
            alert(data.message || "Login failed");
          }
        } catch (err) {
          alert("Server error or network issue");
        }
      });
    });
  </script>
</body>
</html>
