<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Info - CampusDealz</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: '#ea580c', navy: '#1e293b' } } } }
  </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen font-sans pb-20 md:pb-0">

  <header class="bg-white dark:bg-gray-800 shadow-sm sticky top-0 z-40 border-b border-gray-200 dark:border-gray-700">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center gap-4">
      <div class="cursor-pointer p-2 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-full transition" onclick="window.location.href='settings.html'">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
      </div>
      <span class="text-xl font-black text-navy dark:text-white">Personal Info</span>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-8 space-y-6">
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 p-6 space-y-5">
      
      <div>
        <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">First Name</label>
        <input id="firstName" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 p-3 rounded-xl focus:ring-2 focus:ring-brand outline-none transition">
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">Last Name</label>
        <input id="lastName" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 p-3 rounded-xl focus:ring-2 focus:ring-brand outline-none transition">
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">Location (Hostel/Area)</label>
        <input id="location" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 p-3 rounded-xl focus:ring-2 focus:ring-brand outline-none transition" placeholder="e.g. Hall 4, Main Campus">
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">Sex</label>
        <select id="sex" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 p-3 rounded-xl focus:ring-2 focus:ring-brand outline-none transition">
          <option value="male">Male</option>
          <option value="female">Female</option>
        </select>
      </div>

      <button onclick="update()" class="w-full bg-brand hover:bg-orange-600 text-white font-bold py-4 rounded-2xl shadow-lg transition transform active:scale-95">
        Save Profile
      </button>

    </div>
  </main>

  <script>
    const API = "https://marketplace-5nn2.onrender.com";
    async function load() {
      const token = localStorage.getItem("token");
      const res = await fetch(`${API}/api/auth/me`, { headers: { Authorization: token } });
      const user = await res.json();
      if(user.name) {
        const parts = user.name.split(' ');
        document.getElementById("firstName").value = parts[0] || "";
        document.getElementById("lastName").value = parts.slice(1).join(' ') || "";
      }
      document.getElementById("location").value = user.location || "";
      document.getElementById("sex").value = user.sex || "male";
    }



    async function update() {
  const token = localStorage.getItem("token");

  const first = document.getElementById("firstName").value.trim();
  const last = document.getElementById("lastName").value.trim();
  const location = document.getElementById("location").value;
  const sex = document.getElementById("sex").value;

  const name = `${first} ${last}`.trim();

  // ✅ VALIDATION
  if (!first) {
    alert("First name required ❌");
    return;
  }

  try {
    const res = await fetch(`${API}/api/auth/update`, {
      method: "PUT",
      headers: {
        "Content-Type": "application/json",
        Authorization: token
      },
      body: JSON.stringify({
        name,
        location,
        sex
      })
    });

    if (!res.ok) {
      alert("Update failed ❌");
      return;
    }

    alert("Profile Updated ✅");

    // 🔥 refresh UI
    load();

  } catch (err) {
    console.log(err);
    alert("Network error ❌");
  }
    }

    
    load();
    if (localStorage.theme === 'dark') document.documentElement.classList.add('dark');
  </script>
</body>
</html>
