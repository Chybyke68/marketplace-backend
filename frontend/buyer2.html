<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Dealz | Student Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'media',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: '#ea580c',
                            600: '#c2410c'
                        },
                        navy: '#0f172a'
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    animation: { 'fade-in': 'fadeIn 0.5s ease-out' },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        @media (prefers-color-scheme: dark) {
            .glass-panel {
                background: rgba(15, 23, 42, 0.7);
                border: 1px solid rgba(255, 255, 255, 0.05);
            }
        }
    </style>
</head>
<body class="font-sans bg-gray-50 dark:bg-navy text-gray-800 dark:text-gray-100 antialiased pb-24 md:pb-0 transition-colors duration-300">

    <nav class="fixed top-0 left-0 right-0 z-50 glass-panel shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16 md:h-20 gap-4">
                <a href="index.html" class="flex items-center gap-2.5 group shrink-0">
                    <div class="w-10 h-10 bg-brand-500 rounded-xl flex items-center justify-center shadow-lg shadow-brand-500/30">
                        <span class="text-white font-black text-sm tracking-tighter">CD</span>
                    </div>
                    <span class="text-xl md:text-2xl font-black text-gray-900 dark:text-white tracking-tight hidden sm:block">Campus<span class="text-brand-500">Dealz</span></span>
                </a>
                <div class="flex-1 max-w-2xl relative group">
                    <i data-lucide="search" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400 group-focus-within:text-brand-500"></i>
                    <input type="text" placeholder="Search textbooks, gadgets..." class="w-full pl-10 pr-4 py-2.5 md:py-3 bg-gray-100/80 dark:bg-gray-800/50 border border-transparent dark:border-gray-700/50 rounded-xl text-sm focus:outline-none focus:bg-white dark:focus:bg-gray-800 focus:ring-4 focus:ring-brand-500/10 transition-all">
                </div>
                <div class="hidden md:flex items-center gap-4 shrink-0">
                    <a href="seller.html" class="bg-brand-500 hover:bg-brand-600 text-white font-bold text-sm px-6 py-2.5 rounded-xl transition-all flex items-center gap-2">
                        <i data-lucide="plus" class="w-4 h-4"></i> Sell Item
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <section class="relative overflow-hidden pt-28 pb-16 md:pt-36 md:pb-20 border-b border-gray-200 dark:border-gray-800">
        <div class="max-w-7xl mx-auto px-4 text-center relative z-10">
            <h1 class="text-4xl sm:text-5xl md:text-6xl font-black text-gray-900 dark:text-white leading-tight mb-6 tracking-tight">
                The Best Deals On <span class="text-transparent bg-clip-text bg-gradient-to-r from-brand-500 to-orange-400">Campus</span> 🎓
            </h1>
            <p class="text-base md:text-xl text-gray-500 dark:text-gray-400 mb-10 max-w-2xl mx-auto font-medium">Buy and sell with fellow students. Safe, fast, and local.</p>
        </div>
    </section>

    <main class="max-w-7xl mx-auto px-4 py-8 md:py-12">
        <div class="flex gap-3 md:gap-5 overflow-x-auto no-scrollbar mb-6 pb-4 border-b border-gray-200 dark:border-gray-800">
            <button onclick="filterCategory('books')" class="flex flex-col items-center min-w-[76px] group transition-all">
                <div class="w-14 h-14 md:w-16 md:h-16 glass-panel rounded-2xl flex items-center justify-center shadow-sm group-hover:bg-brand-50 dark:group-hover:bg-brand-900/20 transition-all">
                    <i data-lucide="book" class="w-6 h-6 text-gray-600 dark:text-gray-300 group-hover:text-brand-500"></i>
                </div>
                <span class="text-[11px] md:text-xs font-bold mt-3 text-gray-500 dark:text-gray-400 group-hover:text-brand-500">Books</span>
            </button>
            <button onclick="filterCategory('computing')" class="flex flex-col items-center min-w-[76px] group">
                <div class="w-14 h-14 glass-panel rounded-2xl flex items-center justify-center group-hover:bg-brand-50">
                    <i data-lucide="laptop" class="w-6 h-6 text-gray-600 group-hover:text-brand-500"></i>
                </div>
                <span class="text-[11px] font-bold mt-3 text-gray-500 group-hover:text-brand-500">Computing</span>
            </button>
            <button onclick="filterCategory('phones')" class="flex flex-col items-center min-w-[76px] group">
                <div class="w-14 h-14 glass-panel rounded-2xl flex items-center justify-center group-hover:bg-brand-50">
                    <i data-lucide="smartphone" class="w-6 h-6 text-gray-600 group-hover:text-brand-500"></i>
                </div>
                <span class="text-[11px] font-bold mt-3 text-gray-500 group-hover:text-brand-500">Phones</span>
            </button>
            <button onclick="filterCategory('fashion')" class="flex flex-col items-center min-w-[76px] group">
                <div class="w-14 h-14 glass-panel rounded-2xl flex items-center justify-center group-hover:bg-brand-50">
                    <i data-lucide="shirt" class="w-6 h-6 text-gray-600 group-hover:text-brand-500"></i>
                </div>
                <span class="text-[11px] font-bold mt-3 text-gray-500 group-hover:text-brand-500">Fashion</span>
            </button>
        </div>

        <div id="subcategoryBar" class="flex gap-2 overflow-x-auto no-scrollbar mb-8 items-center pb-2"></div>

        <div class="mb-6">
            <h2 class="text-2xl font-black text-gray-900 dark:text-white">Trending Ads 🔥</h2>
            <p class="text-gray-500 text-sm font-medium">Recently added by students</p>
        </div>

        <div id="products-container" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3 md:gap-5">
            <div class="col-span-full py-20 flex justify-center">
                <i data-lucide="loader-2" class="w-8 h-8 text-brand-500 animate-spin"></i>
            </div>
        </div>
    </main>

    <nav class="md:hidden fixed bottom-0 w-full glass-panel border-t-0 flex justify-around items-center pb-safe pt-2 pb-2 z-50">
        <a href="index.html" class="flex flex-col items-center p-2 text-brand-500"><i data-lucide="home" class="w-5 h-5 mb-1"></i><span class="text-[10px] font-bold">Home</span></a>
        <a href="seller.html" class="relative -top-6 flex flex-col items-center group">
            <div class="w-14 h-14 bg-brand-500 text-white rounded-full flex items-center justify-center shadow-lg border-4 border-gray-50 dark:border-navy"><i data-lucide="plus" class="w-6 h-6"></i></div>
            <span class="text-[10px] font-bold text-gray-500 mt-1">Sell</span>
        </a>
        <a href="messages.html" class="flex flex-col items-center p-2 text-gray-400 relative"><i data-lucide="message-circle" class="w-5 h-5 mb-1"></i><span class="text-[10px] font-bold">Inbox</span><span id="msgBadge" class="absolute top-1.5 right-2 bg-red-500 text-white text-[9px] px-1.5 py-0.5 rounded-full font-bold hidden">0</span></a>
        <a href="profile.html" class="flex flex-col items-center p-2 text-gray-400"><i data-lucide="user" class="w-5 h-5 mb-1"></i><span class="text-[10px] font-bold">Profile</span></a>
    </nav>

    <script>
        lucide.createIcons();
        const API = "https://marketplace-5nn2.onrender.com";

        async function loadProducts() {
            const container = document.getElementById("products-container");
            const params = new URLSearchParams(window.location.search);
            const category = params.get("category");
            const subcategory = params.get("subcategory");

            let url = `${API}/api/products`;
            if (category) url += `?category=${category}`;
            if (subcategory) url += `${category ? "&" : "?"}subcategory=${subcategory}`;

            try {
                const res = await fetch(url);
                let data = await res.json();
                if (!data || !Array.isArray(data)) return;

                container.innerHTML = "";

                data.forEach((p, index) => {
                    // JIJI STYLE AD CARD
                    container.innerHTML += `
                        <div class="bg-white dark:bg-gray-800 rounded-xl overflow-hidden shadow-sm hover:shadow-md border border-gray-100 dark:border-gray-700/50 cursor-pointer transition-all flex flex-col animate-fade-in group" 
                             style="animation-delay: ${index * 50}ms" 
                             onclick="view('${p.id}')">
                            
                            <div class="relative aspect-[4/3] bg-gray-100 dark:bg-gray-900 overflow-hidden">
                                <img src="${p.image}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" onerror="this.src='https://via.placeholder.com/300?text=No+Image'">
                                <div class="absolute top-2 left-2 bg-brand-500 text-white text-[9px] font-black px-1.5 py-0.5 rounded shadow-sm">TOP</div>
                            </div>

                            <div class="p-3 flex flex-col flex-grow">
                                <h2 class="text-sm font-medium text-gray-700 dark:text-gray-200 line-clamp-2 leading-tight mb-2 min-h-[2.5rem]">
                                    ${p.title}
                                </h2>
                                
                                <div class="mt-auto">
                                    <p class="text-brand-500 font-black text-base md:text-lg">
                                        ₦ ${Number(p.price).toLocaleString()}
                                    </p>
                                    
                                    <div class="flex items-center gap-1 mt-1.5 text-gray-400 dark:text-gray-500">
                                        <i data-lucide="map-pin" class="w-3 h-3"></i>
                                        <span class="text-[10px] font-semibold uppercase tracking-wider">Campus Pickup</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });
                lucide.createIcons();

            } catch (error) {
                container.innerHTML = `<p class="col-span-full text-center py-10 text-gray-400">Unable to load ads.</p>`;
            }
        }

        function view(id) { window.location.href = "product.html?id=" + id; }
        function filterCategory(category) { window.location.href = `index.html?category=${category}`; }
        loadProducts();
    </script>
</body>
</html>
