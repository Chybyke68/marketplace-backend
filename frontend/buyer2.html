<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Dealz | Marketplace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'media',
      theme: { extend: { colors: { brand: '#ea580c', navy: '#0f172a' }, fontFamily: { sans: ['Inter', 'sans-serif'] } } }
    }
  </script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .glass-panel { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.3); }
    @media (prefers-color-scheme: dark) { .glass-panel { background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255, 255, 255, 0.05); } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
  </style>
</head>
<body class="bg-gray-50 dark:bg-navy text-gray-800 dark:text-gray-100 antialiased pb-24 transition-colors duration-300">

  <div id="app-loader" class="fixed inset-0 bg-white dark:bg-navy z-[100] flex flex-col items-center justify-center transition-opacity duration-500">
    <div class="w-20 h-20 bg-brand rounded-2xl flex items-center justify-center shadow-2xl animate-pulse">
      <i data-lucide="tag" class="text-white w-10 h-10"></i>
    </div>
    <h2 class="mt-6 text-xl font-black tracking-tighter">CAMPUS<span class="text-brand">DEALZ</span></h2>
  </div>

  <nav class="fixed top-0 left-0 right-0 z-50 glass-panel shadow-sm px-4 h-16 md:h-20 flex items-center justify-between gap-4">
    <a href="index.html" class="flex items-center gap-2 group">
      <div class="w-10 h-10 bg-brand rounded-xl flex items-center justify-center shadow-lg"><i data-lucide="shopping-bag" class="text-white w-5 h-5"></i></div>
      <span class="text-xl font-black tracking-tighter hidden sm:block">Campus<span class="text-brand">Dealz</span></span>
    </a>
    <div class="flex-1 max-w-xl relative">
      <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"></i>
      <input type="text" placeholder="Search for anything..." class="w-full pl-10 pr-4 py-2.5 bg-gray-100 dark:bg-gray-800/50 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand/20">
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-4 pt-24">
    <div id="categoryBar" class="flex gap-4 overflow-x-auto no-scrollbar pb-4 mb-4 border-b border-gray-100 dark:border-gray-800">
        </div>

    <div id="subcategoryBar" class="flex gap-2 overflow-x-auto no-scrollbar mb-8 items-center min-h-[40px]">
        </div>

    <h2 id="section-title" class="font-black text-lg mb-6 flex items-center gap-2">
        Trending Ads <span class="w-2 h-2 bg-brand rounded-full animate-pulse"></span>
    </h2>

    <div id="products-container" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3 md:gap-5">
      <div class="col-span-full py-20 flex justify-center"><i data-lucide="loader-2" class="w-8 h-8 text-brand animate-spin"></i></div>
    </div>
  </main>

  <nav class="md:hidden fixed bottom-0 w-full glass-panel flex justify-around items-center py-3 z-50 border-t border-gray-100 dark:border-gray-800">
    <a href="index.html" class="flex flex-col items-center text-brand"><i data-lucide="home" class="w-5 h-5"></i><span class="text-[10px] font-bold mt-1">Home</span></a>
    <a href="messages.html" class="flex flex-col items-center text-gray-400"><i data-lucide="message-square" class="w-5 h-5"></i><span class="text-[10px] font-bold mt-1">Inbox</span></a>
    <a href="seller.html" class="relative -top-5 w-14 h-14 bg-brand rounded-full flex items-center justify-center text-white shadow-xl border-4 border-gray-50 dark:border-navy"><i data-lucide="plus" class="w-7 h-7"></i></a>
    <a href="my-ads.html" class="flex flex-col items-center text-gray-400"><i data-lucide="layers" class="w-5 h-5"></i><span class="text-[10px] font-bold mt-1">My Ads</span></a>
    <a href="profile.html" class="flex flex-col items-center text-gray-400"><i data-lucide="user" class="w-5 h-5"></i><span class="text-[10px] font-bold mt-1">Profile</span></a>
  </nav>

  <script>
    const API = "https://marketplace-5nn2.onrender.com";

    const subMap = {
      books: { icon: 'book-open', subs: ["Textbooks"] },
      computing: { icon: 'laptop', subs: ["Laptops", "Keyboards", "Mouses", "Storage_Devices"] },
      phones: { icon: 'smartphone', subs: ["Androids", "iPhones"] },
      phones_accessories: { icon: 'headphones', subs: ["Chargers", "Powerbanks", "Earbuds", "Headphones", "Cases", "ScreenProtectors"] },
      fashion: { icon: 'shirt', subs: ["Clothes", "Shoes", "Bags", "Watches", "Jewelry", "Others"] },
      hostel: { icon: 'bed', subs: ["Beds_Foam", "Tables_Chairs", "Buckets_Mirrors", "Others"] },
      electronics: { icon: 'gamepad-2', subs: ["Speakers", "Smartwatches", "Gadgets", "Others"] },
      beauty: { icon: 'sparkles', subs: ["Skincare", "Hair_Products", "Perfumes", "Makeup", "Others"] },
      services: { icon: 'wrench', subs: ["Graphic_Design", "Hair_Barbing", "Laundry", "Phone_Repair", "Others"] }
    };

    window.addEventListener('load', () => {
      setTimeout(() => { 
        document.getElementById('app-loader').style.opacity = '0'; 
        setTimeout(() => document.getElementById('app-loader').remove(), 500); 
      }, 600);
      
      initCategories();
      loadProducts();
    });

    function initCategories() {
      const bar = document.getElementById("categoryBar");
      const params = new URLSearchParams(window.location.search);
      const activeCat = params.get("category");

      bar.innerHTML = "";
      Object.keys(subMap).forEach(key => {
        const isActive = activeCat === key;
        const activeStyles = isActive ? 'text-brand' : 'text-gray-400';
        const activeBg = isActive ? 'bg-brand/10 border-brand/50' : 'glass-panel';

        bar.innerHTML += `
          <button onclick="filterCategory('${key}')" class="flex flex-col items-center min-w-[72px] group transition-all">
            <div class="w-14 h-14 ${activeBg} rounded-2xl flex items-center justify-center group-hover:bg-brand/10 transition-all border">
              <i data-lucide="${subMap[key].icon}" class="${activeStyles} group-hover:text-brand transition-colors"></i>
            </div>
            <span class="text-[11px] font-bold mt-2 ${activeStyles} group-hover:text-brand capitalize">${key.replace('_', ' ')}</span>
          </button>
        `;
      });
      lucide.createIcons();
    }

    async function loadSubcategories(category) {
      const bar = document.getElementById("subcategoryBar");
      const params = new URLSearchParams(window.location.search);
      const activeSub = params.get("subcategory");

      if (!subMap[category]) {
        bar.innerHTML = "";
        return;
      }

      const subs = subMap[category].subs;
      bar.innerHTML = "";

      // "All" button
      const allActive = !activeSub ? 'bg-brand text-white shadow-lg' : 'glass-panel text-gray-500';
      bar.innerHTML += `
        <button onclick="filterCategory('${category}')" 
          class="px-5 py-2 ${allActive} rounded-xl text-xs font-bold whitespace-nowrap transition-all active:scale-95 border">
          All
        </button>
      `;

      subs.forEach(s => {
        const isActive = activeSub === s;
        const style = isActive ? 'bg-brand text-white shadow-lg' : 'glass-panel text-gray-500 hover:text-brand';
        
        bar.innerHTML += `
          <button onclick="filterSub('${category}', '${s}')"
            class="px-5 py-2 ${style} rounded-xl text-xs font-bold whitespace-nowrap transition-all active:scale-95 border">
            ${s.replaceAll("_", " ")}
          </button>
        `;
      });
    }

    async function loadProducts() {
      const container = document.getElementById("products-container");
      const params = new URLSearchParams(window.location.search);
      const category = params.get("category");
      const subcategory = params.get("subcategory");

      if (category) {
        loadSubcategories(category);
        document.getElementById("section-title").innerHTML = `${category.replace('_', ' ')} <span class="text-brand text-sm font-medium">/ ${subcategory || 'All'}</span>`;
      }

      let url = `${API}/api/products`;
      const queryParams = [];
      if (category) queryParams.push(`category=${category}`);
      if (subcategory) queryParams.push(`subcategory=${subcategory}`);
      if (queryParams.length > 0) url += `?${queryParams.join('&')}`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        container.innerHTML = "";

        if (data.length === 0) {
            container.innerHTML = `<p class="col-span-full text-center py-20 opacity-50 font-bold">No items found in this category.</p>`;
            return;
        }

        data.forEach((p, i) => {
          container.innerHTML += `
            <div class="bg-white dark:bg-gray-800 rounded-xl overflow-hidden shadow-sm hover:shadow-md border border-gray-100 dark:border-gray-700/50 cursor-pointer group animate-fade-in" style="animation-delay:${i*50}ms" onclick="location.href='product.html?id=${p.id}'">
              <div class="relative aspect-square bg-gray-50 dark:bg-gray-900 overflow-hidden">
                <img src="${p.image}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                <div class="absolute top-2 left-2 bg-brand text-white text-[9px] font-black px-1.5 py-0.5 rounded shadow-sm">TOP</div>
              </div>
              <div class="p-3">
                <h2 class="text-sm font-medium text-gray-700 dark:text-gray-200 line-clamp-2 min-h-[2.5rem] leading-tight">${p.title}</h2>
                <p class="text-brand font-black text-lg mt-1">₦${Number(p.price).toLocaleString()}</p>
                <div class="flex items-center gap-1 mt-2 text-gray-400 text-[10px] font-bold uppercase tracking-wider">
                  <i data-lucide="map-pin" class="w-3 h-3"></i> Campus Pickup
                </div>
              </div>
            </div>`;
        });
        lucide.createIcons();
      } catch (e) { container.innerHTML = "<p class='col-span-full text-center py-10 opacity-50'>Connection failed.</p>"; }
    }

    function filterCategory(category) {
      window.location.href = `buyer2.html?category=${category}`;
    }

    function filterSub(category, sub) {
      window.location.href = `buyer2.html?category=${category}&subcategory=${sub}`;
    }
  </script>
</body>
</html>
