<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Dealz | Student Marketplace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { 
        extend: { 
          colors: { 
            brand: '#f97316', // Vibrant Orange
            brandDark: '#ea580c',
            navy: '#0f172a',
            surface: '#f8fafc'
          },
          animation: {
            'fade-out': 'fadeOut 0.5s ease-out forwards',
            'spin-slow': 'spin 3s linear infinite',
          },
          keyframes: {
            fadeOut: {
              '0%': { opacity: '1' },
              '100%': { opacity: '0', visibility: 'hidden' },
            }
          }
        } 
      }
    }
  </script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .glass { backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  </style>
</head>
<body class="bg-gray-50 dark:bg-navy text-gray-800 dark:text-gray-100 min-h-screen font-sans pb-24 md:pb-0 selection:bg-brand selection:text-white transition-colors duration-300">

  <div id="app-loader" class="fixed inset-0 bg-white dark:bg-navy z-[100] flex flex-col items-center justify-center transition-all duration-500">
    <div class="relative flex items-center justify-center mb-4">
      <div class="absolute inset-0 rounded-full border-4 border-gray-100 dark:border-gray-800"></div>
      <div class="absolute inset-0 rounded-full border-4 border-brand border-t-transparent animate-spin"></div>
      <svg class="w-10 h-10 text-brand m-6 relative z-10" fill="currentColor" viewBox="0 0 24 24">
        <path d="M21 16.5c0 .38-.21.71-.53.88l-7.9 4.44c-.16.12-.36.18-.57.18-.21 0-.41-.06-.57-.18l-7.9-4.44A.991.991 0 013 16.5v-9c0-.38.21-.71.53-.88l7.9-4.44c.16-.12.36-.18.57-.18.21 0 .41.06.57.18l7.9 4.44c.32.17.53.5.53.88v9M12 4.15L6.04 7.5 12 10.85l5.96-3.35L12 4.15M5 15.91l6 3.38v-6.71L5 9.19v6.72m14 0v-6.72l-6 3.39v6.71l6-3.38z"/>
      </svg>
    </div>
    <h1 class="text-xl font-black text-navy dark:text-white tracking-tight">Campus<span class="text-brand">Dealz</span></h1>
  </div>
  <script>
    window.addEventListener('load', () => {
      const loader = document.getElementById('app-loader');
      if (loader) {
        setTimeout(() => {
          loader.classList.add('animate-fade-out');
          setTimeout(() => loader.style.display = 'none', 500);
        }, 600); // Slight delay to ensure smooth transition
      }
    });
  </script>

  <header class="bg-white/80 dark:bg-navy/80 glass shadow-sm sticky top-0 z-40 border-b border-gray-200 dark:border-gray-800">
    <div class="max-w-7xl mx-auto px-4 py-3 md:py-4">
      <div class="flex items-center justify-between gap-4 md:gap-8">
        
        <a href="index.html" class="flex items-center gap-2 group cursor-pointer shrink-0">
          <div class="bg-brand text-white p-1.5 rounded-lg group-hover:scale-105 transition-transform">
            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
              <path d="M21 16.5c0 .38-.21.71-.53.88l-7.9 4.44c-.16.12-.36.18-.57.18-.21 0-.41-.06-.57-.18l-7.9-4.44A.991.991 0 013 16.5v-9c0-.38.21-.71.53-.88l7.9-4.44c.16-.12.36-.18.57-.18.21 0 .41.06.57.18l7.9 4.44c.32.17.53.5.53.88v9M12 4.15L6.04 7.5 12 10.85l5.96-3.35L12 4.15M5 15.91l6 3.38v-6.71L5 9.19v6.72m14 0v-6.72l-6 3.39v6.71l6-3.38z"/>
            </svg>
          </div>
          <span class="text-xl md:text-2xl font-black text-navy dark:text-white tracking-tight hidden sm:block">
            Campus<span class="text-brand">Dealz</span>
          </span>
        </a>

        <div class="flex-grow max-w-2xl relative group">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <svg class="w-5 h-5 text-gray-400 group-focus-within:text-brand transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
          </div>
          <input type="text" placeholder="Search for items, textbooks, gadgets..." class="w-full pl-10 pr-4 py-2.5 border border-gray-200 dark:border-gray-700 rounded-xl bg-gray-50 dark:bg-gray-800/50 text-sm md:text-base focus:outline-none focus:border-brand focus:ring-2 focus:ring-brand/20 transition-all shadow-inner">
        </div>

        <div class="hidden md:flex items-center gap-4 shrink-0">

            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
            SELL ITEM
          </a>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6 md:py-8">

        <span class="text-xs font-semibold mt-3 text-gray-600 dark:text-gray-400 group-hover:text-brand tracking-tight">Books</span>

      <button onclick="filterCategory('computing')" class="flex flex-col items-center min-w-[80px] group transition-all">
        <div class="w-16 h-16 bg-white dark:bg-gray-800 rounded-2xl flex items-center justify-center text-2xl shadow-sm border border-gray-100 dark:border-gray-700 group-hover:border-brand group-hover:shadow-md group-hover:bg-orange-50 dark:group-hover:bg-gray-700 group-active:scale-95 transition-all duration-300">

        </div>
        <span class="text-xs font-semibold mt-3 text-gray-600 dark:text-gray-400 group-hover:text-brand tracking-tight">Computing</span>

      <button onclick="filterCategory('phones')" class="flex flex-col items-center min-w-[80px] group transition-all">

      <button onclick="filterCategory('phones_accessories')" class="flex flex-col items-center min-w-[80px] group transition-all">
        <div class="w-16 h-16 bg-white dark:bg-gray-800 rounded-2xl flex items-center justify-center text-2xl shadow-sm border border-gray-100 dark:border-gray-700 group-hover:border-brand group-hover:shadow-md group-hover:bg-orange-50 dark:group-hover:bg-gray-700 group-active:scale-95 transition-all duration-300">
          🎧
        </div>
        <span class="text-xs font-semibold mt-3 text-gray-600 dark:text-gray-400 group-hover:text-brand tracking-tight text-center leading-tight">Phone<br>Access.</span>

      <button onclick="filterCategory('fashion')" class="flex flex-col items-center min-w-[80px] group transition-all">
        <div class="w-16 h-16 bg-white dark:bg-gray-800 rounded-2xl flex items-center justify-center text-2xl shadow-sm border border-gray-100 dark:border-gray-700 group-hover:border-brand group-hover:shadow-md group-hover:bg-orange-50 dark:group-hover:bg-gray-700 group-active:scale-95 transition-all duration-300">
          👕
        </div>
        <span class="text-xs font-semibold mt-3 text-gray-600 dark:text-gray-400 group-hover:text-brand tracking-tight">Fashion</span>
      </button>

      <button onclick="filterCategory('hostel')" class="flex flex-col items-center min-w-[80px] group transition-all">
        <div class="w-16 h-16 bg-white dark:bg-gray-800 rounded-2xl flex items-center justify-center text-2xl shadow-sm border border-gray-100 dark:border-gray-700 group-hover:border-brand group-hover:shadow-md group-hover:bg-orange-50 dark:group-hover:bg-gray-700 group-active:scale-95 transition-all duration-300">
          🛏️
        </div>
        <span class="text-xs font-semibold mt-3 text-gray-600 dark:text-gray-400 group-hover:text-brand tracking-tight">Hostel</span>
      </button>

      <button onclick="filterCategory('electronics')" class="flex flex-col items-center min-w-[80px] group transition-all">
        <div class="w-16 h-16 bg-white dark:bg-gray-800 rounded-2xl flex items-center justify-center text-2xl shadow-sm border border-gray-100 dark:border-gray-700 group-hover:border-brand group-hover:shadow-md group-hover:bg-orange-50 dark:group-hover:bg-gray-700 group-active:scale-95 transition-all duration-300">
          🎮
        </div>
        <span class="text-xs font-semibold mt-3 text-gray-600 dark:text-gray-400 group-hover:text-brand tracking-tight">Electronics</span>
      </button>

      <button onclick="filterCategory('beauty')" class="flex flex-col items-center min-w-[80px] group transition-all">
        <div class="w-16 h-16 bg-white dark:bg-gray-800 rounded-2xl flex items-center justify-center text-2xl shadow-sm border border-gray-100 dark:border-gray-700 group-hover:border-brand group-hover:shadow-md group-hover:bg-orange-50 dark:group-hover:bg-gray-700 group-active:scale-95 transition-all duration-300">
          💄
        </div>
        <span class="text-xs font-semibold mt-3 text-gray-600 dark:text-gray-400 group-hover:text-brand tracking-tight">Beauty</span>
      </button>

      <button onclick="filterCategory('services')" class="flex flex-col items-center min-w-[80px] group transition-all">
        <div class="w-16 h-16 bg-white dark:bg-gray-800 rounded-2xl flex items-center justify-center text-2xl shadow-sm border border-gray-100 dark:border-gray-700 group-hover:border-brand group-hover:shadow-md group-hover:bg-orange-50 dark:group-hover:bg-gray-700 group-active:scale-95 transition-all duration-300">
          🎯
        </div>
        <span class="text-xs font-semibold mt-3 text-gray-600 dark:text-gray-400 group-hover:text-brand tracking-tight">Services</span>
      </button>

    </div>

    <div id="subcategoryBar" class="flex gap-2 overflow-x-auto no-scrollbar mb-8 pb-2 items-center"></div>

    <div class="flex items-center justify-between mb-6">
      <h2 class="font-black text-xl md:text-2xl text-navy dark:text-white flex items-center gap-3">
        Trending Ads 
        <span class="relative flex h-3 w-3">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-brand opacity-75"></span>
          <span class="relative inline-flex rounded-full h-3 w-3 bg-brand"></span>
        </span>
      </h2>
      <a href="#" class="text-sm font-bold text-brand hover:text-brandDark transition-colors">View All &rarr;</a>
    </div>

    <div id="products-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 md:gap-6">
      </div>

  </main>

  <nav class="md:hidden fixed bottom-0 w-full bg-white/90 dark:bg-navy/90 glass border-t border-gray-200 dark:border-gray-800 flex justify-around items-center pb-safe pt-3 pb-3 z-50">
    <a href="index.html" class="flex flex-col items-center text-brand transition">
      <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
      <span class="text-[10px] font-bold">Home</span>
    </a>
    <a href="seller.html" class="flex flex-col items-center text-gray-400 hover:text-brand transition">
      <div class="bg-brand text-white p-2 rounded-full -mt-6 shadow-lg shadow-brand/30 border-4 border-white dark:border-navy">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
      </div>
      <span class="text-[10px] font-bold mt-1 text-gray-500">Sell</span>
    </a>
    <a href="messages.html" class="flex flex-col items-center text-gray-400 hover:text-brand transition relative">
        <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
        <span class="text-[10px] font-bold">Inbox</span>
        <span id="msgBadge" class="absolute -top-1 right-2 bg-red-500 text-white text-[10px] px-1.5 py-0.5 rounded-full hidden border-2 border-white dark:border-navy">0</span>
    </a>
    <a href="profile.html" class="flex flex-col items-center text-gray-400 hover:text-brand transition">
      <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
      <span class="text-[10px] font-bold">Profile</span>
    </a>
  </nav>

  <script>
    const API = "https://marketplace-5nn2.onrender.com";

    async function loadProducts() {
      const container = document.getElementById("products-container");
      const params = new URLSearchParams(window.location.search);
      const category = params.get("category");
      const subcategory = params.get("subcategory");

      // Load subcategories UI
      if (category) {
        loadSubcategories(category);
      }

      let url = `${API}/api/products`;
      if (category) {
        url += `?category=${category}`;
      }
      if (subcategory) {
        url += `${category ? "&" : "?"}subcategory=${subcategory}`;
      }

      try {
        const res = await fetch(url);
        let data = await res.json();

        if (!data || !Array.isArray(data)) {
          container.innerHTML = `<div class="col-span-full py-10 text-center text-gray-500 font-medium">Failed to load products ❌</div>`;
          return;
        }

        if (data.length === 0) {
          container.innerHTML = `<div class="col-span-full py-10 text-center text-gray-500 font-medium">No items found in this category.</div>`;
          return;
        }

        container.innerHTML = "";

        // GENERATE UPGRADED PRODUCT CARDS
        data.forEach(p => {
          container.innerHTML += `
            <div class="group bg-white dark:bg-gray-800 rounded-2xl shadow-sm hover:shadow-xl overflow-hidden cursor-pointer border border-gray-100 dark:border-gray-700 transition-all duration-300 flex flex-col"
                 onclick="view('${p.id}')">
              <div class="aspect-[4/3] bg-gray-100 dark:bg-gray-700 relative overflow-hidden">
                <img src="${p.image}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
                  onerror="this.src='https://via.placeholder.com/300?text=No+Image'">
                <div class="absolute inset-0 bg-gradient-to-t from-black/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
              </div>
              <div class="p-3 md:p-4 flex flex-col flex-grow">
                <h2 class="text-sm font-semibold line-clamp-2 mb-2 text-gray-800 dark:text-gray-100 flex-grow">${p.title}</h2>
                <div class="flex items-end justify-between mt-auto">
                  <p class="text-brand font-black text-base md:text-lg tracking-tight">₦${Number(p.price).toLocaleString()}</p>
                  <button class="bg-gray-50 dark:bg-gray-700 text-gray-400 p-1.5 rounded-lg group-hover:bg-brand group-hover:text-white transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                  </button>
                </div>
              </div>
            </div>
          `;
        });

      } catch (error) {
        console.error("Failed:", error);
        container.innerHTML = `<div class="col-span-full py-10 text-center text-red-500 font-medium">Error connecting to server. Please try again.</div>`;
      }
    }

    const subMap = {
      phones: ["Androids", "iPhones"],
      phones_accessories: ["Chargers", "Powerbanks", "Earbuds", "Headphones", "Cases", "ScreenProtectors"],
      computing: ["Laptops", "Keyboards", "Mouses", "Storage_Devices"],
      books: ["Textbooks"],
      hostel: ["Beds_Foam", "Tables_Chairs", "Buckets_Mirrors", "Others"],
      fashion: ["Clothes", "Shoes", "Bags", "Watches", "Jewelry", "Others"],
      electronics: ["Speakers", "Smartwatches", "Gadgets", "Others"],
      beauty: ["Skincare", "Hair_Products", "Perfumes", "Makeup", "Others"],
      services: ["Graphic_Design", "Hair_Barbing", "Laundry", "Phone_Repair", "Others"]
    };

    function loadSubcategories(category) {
      const bar = document.getElementById("subcategoryBar");
      const params = new URLSearchParams(window.location.search);
      const activeSub = params.get("subcategory");

      if (!subMap[category]) {
        bar.innerHTML = "";
        return;
      }

      const subs = subMap[category];
      bar.innerHTML = "";

      const allBtnActive = !activeSub 
        ? 'bg-navy dark:bg-gray-100 text-white dark:text-navy border-transparent shadow-md' 
        : 'bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300 border-gray-200 dark:border-gray-700 hover:border-brand hover:text-brand';
      
      bar.innerHTML += `
        <button onclick="filterCategory('${category}')" 
          class="px-5 py-2 ${allBtnActive} border rounded-full text-xs font-bold whitespace-nowrap transition-all active:scale-95">
          All
        </button>
      `;

      subs.forEach(s => {
        const isActive = activeSub === s;
        const styleClass = isActive 
          ? 'bg-navy dark:bg-gray-100 text-white dark:text-navy border-transparent shadow-md' 
          : 'bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300 border-gray-200 dark:border-gray-700 hover:border-brand hover:text-brand';
        
        bar.innerHTML += `
          <button onclick="filterSub('${category}', '${s}')"
            class="px-5 py-2 ${styleClass} border rounded-full text-xs font-bold whitespace-nowrap transition-all active:scale-95">
            ${s.replaceAll("_", " ")}
          </button>
        `;
      });
    }

    function filterSub(category, sub) {
      window.location.href = `index.html?category=${category}&subcategory=${sub}`;
    }

    function view(id) {
      window.location.href = "product.html?id=" + id;
    }

    async function loadUnreadCount() {
      try {
        const token = localStorage.getItem("token");
        if (!token) return;
        
        const res = await fetch(`${API}/api/messages/unread-count`, {
          headers: { Authorization: token }
        });

        const data = await res.json();
        const badge = document.getElementById("msgBadge");

        if (data.count > 0) {
          badge.innerText = data.count > 99 ? '99+' : data.count;
          badge.classList.remove("hidden");
        } else {
          badge.classList.add("hidden");
        }
      } catch(e) {
        console.error("Message count error", e);
      }
    }

    function filterCategory(category) {
      window.location.href = `index.html?category=${category}`;
    }

    // Initialize functions
    loadUnreadCount();
    setInterval(loadUnreadCount, 5000);
    loadProducts();
  </script>
</body>
</html>
