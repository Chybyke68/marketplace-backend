<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Post Ad</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-6">

<h1 class="text-2xl font-bold mb-4">Post New Product</h1>

<form id="form" class="space-y-4 bg-white p-6 rounded shadow max-w-lg">

  <input id="title" placeholder="Title" class="w-full border p-2 rounded" required>
  
  <input id="price" type="number" placeholder="Price" class="w-full border p-2 rounded" required>

  <select id="category" onchange="loadSubcategories()" class="w-full border p-2 rounded" required>
    <option value="">Select Category</option>
    <option value="phones">Phones</option>
    <option value="phones_accessories">Accessories</option>
    <option value="computing">Computing</option>
    <option value="books">Books</option>
    <option value="hostel">Hostel</option>
    <option value="fashion">Fashion</option>
    <option value="electronics">Electronics</option>
    <option value="beauty">Beauty</option>
    <option value="services">Services</option>
  </select>

  <select id="subcategory" class="w-full border p-2 rounded" required></select>

  <textarea id="description" placeholder="Description" class="w-full border p-2 rounded"></textarea>

  <input id="image" type="file" required>

  <button class="bg-orange-600 text-white px-4 py-2 rounded w-full">Post</button>

</form>

<script>
const API = "https://marketplace-5nn2.onrender.com";

const subMap = {
  phones: ["Androids", "iPhones"],
  phones_accessories: ["Chargers", "Powerbanks", "Earbuds"],
  computing: ["Laptops", "Keyboards"],
  books: ["Textbooks"],
  hostel: ["Beds_Foam"],
  fashion: ["Clothes", "Shoes"],
  electronics: ["Speakers"],
  beauty: ["Skincare"],
  services: ["Graphic_Design"]
};

function loadSubcategories() {
  const cat = document.getElementById("category").value;
  const sub = document.getElementById("subcategory");

  sub.innerHTML = "";

  if (!subMap[cat]) return;

  subMap[cat].forEach(s => {
    sub.innerHTML += `<option value="${s}">${s}</option>`;
  });
}

document.getElementById("form").addEventListener("submit", async e => {
  e.preventDefault();

  const token = localStorage.getItem("token");

  const formData = new FormData();
  formData.append("title", title.value);
  formData.append("price", price.value);
  formData.append("description", description.value);
  formData.append("category", category.value);
  formData.append("subcategory", subcategory.value);
  formData.append("image", image.files[0]);

  const res = await fetch(`${API}/api/products/add`, {
    method: "POST",
    headers: { Authorization: token },
    body: formData
  });

  if (res.ok) {
    alert("Posted ✅");
    location.reload();
  } else {
    alert("Error ❌");
  }
});
</script>

</body>
</html>
