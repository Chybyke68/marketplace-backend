<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post Ad - CampusDealz</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { 
        extend: { 
          colors: { 
            brand: '#ea580c', 
            navy: '#1e293b',
            surface: '#f8fafc'
          } 
        } 
      }
    }
  </script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* Custom styling for standard file input */
    input[type=file]::file-selector-button {
      margin-right: 20px;
      border: none;
      background: #ea580c;
      padding: 8px 16px;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      font-weight: bold;
      transition: background .2s ease-in-out;
    }
    input[type=file]::file-selector-button:hover {
      background: #c2410c;
    }
  </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen font-sans pb-20 md:pb-0">

  <div id="app-loader" class="fixed inset-0 bg-white dark:bg-gray-900 z-[100] flex items-center justify-center transition-opacity duration-500">
    <img src="logo.svg" alt="Loading..." class="w-24 h-24 object-contain animate-pulse mix-blend-multiply dark:bg-white dark:p-2 dark:rounded-xl" onerror="this.style.display='none'">
  </div>
  <script>
    window.addEventListener('load', () => {
      const loader = document.getElementById('app-loader');
      if (loader) {
        loader.classList.add('opacity-0');
        setTimeout(() => loader.style.display = 'none', 500);
      }
    });
  </script>

  <header class="bg-white dark:bg-gray-800 shadow-sm sticky top-0 z-40 border-b border-gray-200 dark:border-gray-700">
    <div class="max-w-7xl mx-auto px-4 py-3">
      <div class="flex items-center justify-between gap-4">
        <div class="flex items-center gap-2">
          <img src="logo.svg" alt="Logo" class="w-8 h-8 object-contain mix-blend-multiply dark:bg-white dark:rounded dark:p-0.5" onerror="this.style.display='none'">
          <span class="text-xl font-black text-navy dark:text-white tracking-tight">Post New Ad</span>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-4 py-6 md:py-10">
    
    <div class="bg-white dark:bg-gray-800 rounded-2xl p-6 md:p-8 shadow-sm border border-gray-100 dark:border-gray-700">
      
      <div class="mb-6">
        <h1 class="text-2xl font-black text-navy dark:text-white">What are you selling?</h1>
        <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Fill out the details below to list your item on the marketplace.</p>
      </div>

      <form id="form" class="space-y-5">
        
        <div>
          <label for="title" class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-1.5">Ad Title</label>
          <input id="title" placeholder="e.g., iPhone 12 Pro Max - 256GB" class="w-full bg-gray-50 dark:bg-gray-700/50 border border-gray-200 dark:border-gray-600 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-brand/50 focus:border-brand transition-all dark:text-white placeholder-gray-400" required>
        </div>

        <div>
          <label for="price" class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-1.5">Price (₦)</label>
          <div class="relative">
            <span class="absolute left-4 top-3.5 text-gray-500 dark:text-gray-400 font-bold">₦</span>
            <input id="price" type="number" placeholder="0.00" class="w-full bg-gray-50 dark:bg-gray-700/50 border border-gray-200 dark:border-gray-600 rounded-xl pl-9 pr-4 py-3 focus:outline-none focus:ring-2 focus:ring-brand/50 focus:border-brand transition-all dark:text-white placeholder-gray-400" required>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <div>
            <label for="category" class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-1.5">Category</label>
            <select id="category" onchange="loadSubcategories()" class="w-full bg-gray-50 dark:bg-gray-700/50 border border-gray-200 dark:border-gray-600 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-brand/50 focus:border-brand transition-all dark:text-white appearance-none" required>
              <option value="" disabled selected>Select Category</option>
              <option value="phones">Phones</option>
              <option value="phones_accessories">Phones Accessories</option>
              <option value="computing">Computing</option>
              <option value="books">Books</option>
              <option value="hostel">Hostel</option>
              <option value="fashion">Fashion</option>
              <option value="electronics">Electronics</option>
              <option value="beauty">Beauty</option>
              <option value="services">Services</option>
            </select>
          </div>

          <div>
            <label for="subcategory" class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-1.5">Subcategory</label>
            <select id="subcategory" class="w-full bg-gray-50 dark:bg-gray-700/50 border border-gray-200 dark:border-gray-600 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-brand/50 focus:border-brand transition-all dark:text-white appearance-none" required>
              <option value="" disabled selected>Select Subcategory</option>
            </select>
          </div>
        </div>

        <div>
          <label for="description" class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-1.5">Description</label>
          <textarea id="description" rows="4" placeholder="Describe your item in detail (condition, features, reason for selling)..." class="w-full bg-gray-50 dark:bg-gray-700/50 border border-gray-200 dark:border-gray-600 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-brand/50 focus:border-brand transition-all dark:text-white placeholder-gray-400"></textarea>
        </div>

        <div>
          <label for="image" class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-1.5">Product Image</label>
          <div class="w-full bg-gray-50 dark:bg-gray-700/50 border-2 border-dashed border-gray-300 dark:border-gray-600 rounded-xl p-4 hover:border-brand dark:hover:border-brand transition-colors text-center">
            <input id="image" type="file" accept="image/*" class="w-full text-sm text-gray-500 dark:text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-bold file:bg-brand/10 file:text-brand hover:file:bg-brand/20 cursor-pointer" required>
          </div>
        </div>

        <button type="submit" id="submitBtn" class="w-full bg-brand hover:bg-orange-600 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-orange-500/30 transition-all flex items-center justify-center gap-2 mt-4">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
          Post Ad Now
        </button>

      </form>
    </div>
  </main>

  <nav class="md:hidden fixed bottom-0 w-full bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 flex justify-around items-center pb-safe pt-2 pb-2 z-50">
    <a href="index.html" class="flex flex-col items-center text-gray-400 hover:text-brand transition">
      <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
      <span class="text-[10px] font-bold">Home</span>
    </a>
    <a href="seller.html" class="flex flex-col items-center text-brand">
      <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
      <span class="text-[10px] font-bold">Sell</span>
    </a>
    <a href="messages.html" class="flex flex-col items-center text-gray-400 hover:text-brand transition relative">
        <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
        <span class="text-[10px] font-bold">Messages</span>
        <span id="msgBadge" class="absolute -top-1 right-1 bg-red-500 text-white text-[10px] px-1.5 py-0.5 rounded-full hidden">0</span>
    </a>
    <a href="profile.html" class="flex flex-col items-center text-gray-400 hover:text-brand transition">
      <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
      <span class="text-[10px] font-bold">Profile</span>
    </a>
  </nav>

  <script>
    const API = "https://marketplace-5nn2.onrender.com";

    // Reconciled subMap to match index.html perfectly
    const subMap = {
      phones: ["Androids", "iPhones"],
      phones_accessories: ["Chargers", "Powerbanks", "Earbuds", "Headphones", "Cases", "ScreenProtectors"],
      computing: ["Laptops", "Keyboards", "Mouses", "Storage_Devices"],
      books: ["Textbooks"],
      hostel: ["Beds_Foam", "Tables_Chairs", "Buckets_Mirrors", "Others"],
      fashion: ["Clothes", "Shoes", "Bags", "Watches", "Jewelry", "Others"],
      electronics: ["Speakers", "Smartwatches", "Gadgets", "Others"],
      beauty: ["Skincare", "Hair_Products", "Perfumes", "Makeup", "Others"],
      services: ["Graphic_Design", "Hair_Barbing", "Laundry", "Phone_Repair", "Others"]
    };

    function loadSubcategories() {
      const cat = document.getElementById("category").value;
      const sub = document.getElementById("subcategory");

      sub.innerHTML = '<option value="" disabled selected>Select Subcategory</option>';

      if (!subMap[cat]) return;

      subMap[cat].forEach(s => {
        sub.innerHTML += `<option value="${s}">${s.replaceAll("_", " ")}</option>`;
      });
    }

    document.getElementById("form").addEventListener("submit", async e => {
      e.preventDefault();

      const btn = document.getElementById("submitBtn");
      const originalText = btn.innerHTML;
      btn.innerHTML = `<span class="animate-spin text-xl">⏳</span> Posting...`;
      btn.disabled = true;

      const token = localStorage.getItem("token");

      const title = document.getElementById("title");
      const price = document.getElementById("price");
      const description = document.getElementById("description");
      const category = document.getElementById("category");
      const subcategory = document.getElementById("subcategory");
      const image = document.getElementById("image");

      const formData = new FormData();
      formData.append("title", title.value);
      formData.append("price", price.value);
      formData.append("description", description.value);
      formData.append("category", category.value);
      formData.append("subcategory", subcategory.value);
      
      if(image.files[0]){
        formData.append("image", image.files[0]);
      }

      try {
        const res = await fetch(`${API}/api/products/add`, {
          method: "POST",
          headers: { Authorization: token },
          body: formData
        });

        if (res.ok) {
          alert("Ad Posted Successfully! ✅");
          window.location.href = "my-ads.html"; // Redirects to my-ads or home after posting
        } else {
          alert("Failed to post ad. Please try again. ❌");
          btn.innerHTML = originalText;
          btn.disabled = false;
        }
      } catch(err) {
        console.error("Error:", err);
        alert("Network error. ❌");
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    });

    // Load unread count for bottom nav badge
    async function loadUnreadCount() {
      try {
        const token = localStorage.getItem("token");
        if (!token) return;
        const res = await fetch(`${API}/api/messages/unread-count`, {
          headers: { Authorization: token }
        });
        const data = await res.json();
        const badge = document.getElementById("msgBadge");

        if (data.count > 0) {
          badge.innerText = data.count;
          badge.classList.remove("hidden");
        } else {
          badge.classList.add("hidden");
        }
      } catch (error) {}
    }

    loadUnreadCount();
    setInterval(loadUnreadCount, 5000);
  </script>
</body>
</html>
