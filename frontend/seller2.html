<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post New Ad - Campus Dealz</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { 
        extend: { 
          colors: { 
            brand: '#ea580c', 
            navy: '#1e293b',
            surface: '#f8fafc'
          } 
        } 
      }
    }
  </script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen font-sans pb-24">

  <div id="app-loader" class="fixed inset-0 bg-white dark:bg-gray-900 z-[100] flex items-center justify-center transition-opacity duration-500">
    <img src="logo.svg" alt="Loading..." class="w-24 h-24 object-contain animate-pulse mix-blend-multiply dark:bg-white dark:p-2 dark:rounded-xl" onerror="this.style.display='none'">
  </div>

  <header class="bg-white dark:bg-gray-800 shadow-sm sticky top-0 z-40 border-b border-gray-200 dark:border-gray-700">
    <div class="max-w-7xl mx-auto px-4 py-3">
      <div class="flex items-center justify-between gap-4">
        <div class="flex items-center gap-2">
          <img src="logo.svg" alt="Logo" class="w-8 h-8 object-contain mix-blend-multiply dark:bg-white dark:rounded dark:p-0.5" onerror="this.style.display='none'">
          <span class="text-xl font-black text-navy dark:text-white tracking-tight">Post New Ad</span>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-4 py-8">
    <div class="bg-white dark:bg-gray-800 w-full rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 overflow-hidden">
      <div class="px-6 py-5 border-b border-gray-100 dark:border-gray-700">
        <h2 class="text-lg font-black text-navy dark:text-white">Product Details</h2>
        <p class="text-[10px] text-gray-500 dark:text-gray-400 font-bold uppercase tracking-widest mt-1">Provide accurate information to sell faster</p>
      </div>

      <form id="form" class="p-6 space-y-5">
        <div>
          <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1.5">Ad Title</label>
          <input id="title" placeholder="e.g. Dell Latitude 5490 Laptop" class="w-full px-4 py-3 border border-gray-200 dark:border-gray-700 rounded-xl bg-gray-50 dark:bg-gray-900 text-sm focus:outline-none focus:border-brand focus:ring-2 focus:ring-brand/20 transition-all" required/>
        </div>

        <div>
          <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1.5">Price (₦)</label>
          <input id="price" type="number" placeholder="0.00" class="w-full px-4 py-3 border border-gray-200 dark:border-gray-700 rounded-xl bg-gray-50 dark:bg-gray-900 text-sm focus:outline-none focus:border-brand focus:ring-2 focus:ring-brand/20 transition-all" required/>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1.5">Category</label>
            <select id="category" onchange="loadSubcategories()" class="w-full px-4 py-3 border border-gray-200 dark:border-gray-700 rounded-xl bg-gray-50 dark:bg-gray-900 text-sm focus:outline-none focus:border-brand focus:ring-2 focus:ring-brand/20 transition-all cursor-pointer" required>
                <option value="" disabled selected>Select Category</option>
                <option value="phones">📱 Phones</option>
                <option value="phones_accessories">📱 Accessories</option>
                <option value="computing">💻 Computing</option>
                <option value="books">📚 Books</option>
                <option value="hostel">🛏️ Hostel</option>
                <option value="fashion">👕 Fashion</option>
                <option value="electronics">🎮 Electronics</option>
                <option value="beauty">💄 Beauty</option>
                <option value="services">🎯 Services</option>
                <option value="others">🔄 Others</option>
            </select>
          </div>
          <div>
            <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1.5">Subcategory</label>
            <select id="subcategory" class="w-full px-4 py-3 border border-gray-200 dark:border-gray-700 rounded-xl bg-gray-50 dark:bg-gray-900 text-sm focus:outline-none focus:border-brand focus:ring-2 focus:ring-brand/20 transition-all cursor-pointer" required>
                <option value="" disabled selected>Select Subcategory</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1.5">Description</label>
          <textarea id="description" placeholder="Mention item condition, age, and any specific details..." class="w-full px-4 py-3 border border-gray-200 dark:border-gray-700 rounded-xl bg-gray-50 dark:bg-gray-900 text-sm focus:outline-none focus:border-brand focus:ring-2 focus:ring-brand/20 resize-none transition-all" rows="4" required></textarea>
        </div>

        <div id="imageUploadArea" class="relative border-2 border-dashed border-gray-300 dark:border-gray-600 rounded-xl p-8 text-center hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors group cursor-pointer">
            <input id="image" type="file" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" onchange="previewImage(event)" required/>
            <div id="uploadPrompt" class="text-gray-400 group-hover:text-brand transition-colors">
                <div class="text-4xl mb-2">📷</div>
                <span class="text-xs font-bold tracking-wide uppercase">Add Product Image</span>
            </div>
            <img id="imagePreview" class="hidden mx-auto h-40 w-auto object-cover rounded-xl shadow-md" alt="Preview"/>
        </div>

        <button type="submit" id="submitBtn" class="w-full bg-brand hover:bg-orange-600 text-white font-black py-4 rounded-xl shadow-lg shadow-orange-500/20 active:scale-95 transition-all text-sm tracking-widest uppercase">
          Publish Ad Now
        </button>
      </form>
    </div>
  </main>

  <nav class="md:hidden fixed bottom-0 w-full bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 flex justify-around items-center pb-safe pt-2 pb-2 z-50">
    <a href="index.html" class="flex flex-col items-center text-gray-400 hover:text-brand transition">
      <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
      <span class="text-[10px] font-bold">Home</span>
    </a>
    <a href="seller.html" class="flex flex-col items-center text-brand">
      <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
      <span class="text-[10px] font-bold">Sell</span>
    </a>
    <a href="messages.html" class="flex flex-col items-center text-gray-400 hover:text-brand transition relative">
        <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
        <span class="text-[10px] font-bold">Messages</span>
        <span id="msgBadge" class="absolute -top-1 right-1 bg-red-500 text-white text-[10px] px-1.5 py-0.5 rounded-full hidden">0</span>
    </a>
    <a href="profile.html" class="flex flex-col items-center text-gray-400 hover:text-brand transition">
      <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
      <span class="text-[10px] font-bold">Profile</span>
    </a>
  </nav>

  <script>
    const API = "https://marketplace-5nn2.onrender.com";

    // Standard subcategories
    const subMap = {
      phones: ["Androids", "iPhones"],
      phones_accessories: ["Chargers", "Powerbanks", "Earbuds", "Headphones", "Cases", "ScreenProtectors"],
      computing: ["Laptops", "Keyboards", "Mouses", "Storage_Devices"],
      books: ["Textbooks"],
      hostel: ["Beds_Foam", "Tables_Chairs", "Buckets_Mirrors", "Others"],
      fashion: ["Clothes", "Shoes", "Bags", "Watches", "Jewelry", "Others"],
      electronics: ["Speakers", "Smartwatches", "Gadgets", "Others"],
      beauty: ["Skincare", "Hair_Products", "Perfumes", "Makeup", "Others"],
      services: ["Graphic_Design", "Hair_Barbing", "Laundry", "Phone_Repair", "Others"],
      others: ["others"]
    };

    // Loader logic
    window.addEventListener('load', () => {
      const loader = document.getElementById('app-loader');
      if (loader) {
        loader.classList.add('opacity-0');
        setTimeout(() => loader.style.display = 'none', 500);
      }
    });

    function loadSubcategories() {
      const category = document.getElementById("category").value;
      const subSelect = document.getElementById("subcategory");
      subSelect.innerHTML = '<option value="" disabled selected>Select Subcategory</option>';
      if (!category || !subMap[category]) return;
      subMap[category].forEach(s => {
        const option = document.createElement("option");
        option.value = s;
        option.textContent = s.replaceAll("_", " ");
        subSelect.appendChild(option);
      });
    }

    function previewImage(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          document.getElementById('uploadPrompt').classList.add('hidden');
          const preview = document.getElementById('imagePreview');
          preview.src = e.target.result;
          preview.classList.remove('hidden');
        }
        reader.readAsDataURL(file);
      }
    }

    // Message badge functionality
    async function loadUnreadCount() {
      try {
        const token = localStorage.getItem("token");
        if (!token) return;
        const res = await fetch(`${API}/api/messages/unread-count`, {
          headers: { Authorization: token }
        });
        const data = await res.json();
        const badge = document.getElementById("msgBadge");
        if (data.count > 0) {
          badge.innerText = data.count;
          badge.classList.remove("hidden");
        } else {
          badge.classList.add("hidden");
        }
      } catch (e) {}
    }

    document.getElementById("form").addEventListener("submit", async e => {
      e.preventDefault();
      const token = localStorage.getItem("token");
      if (!token) {
        alert("Session expired. Please log in again ❌");
        return;
      }

      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      btn.innerHTML = `<span class="inline-block animate-spin mr-2">⏳</span> Publishing...`;

      const formData = new FormData();
      formData.append("title", document.getElementById("title").value);
      formData.append("price", document.getElementById("price").value);
      formData.append("description", document.getElementById("description").value);
      formData.append("category", document.getElementById("category").value);
      formData.append("subcategory", document.getElementById("subcategory").value);
      formData.append("image", document.getElementById("image").files[0]);

      try {
        const res = await fetch(`${API}/api/products/add`, {
          method: "POST",
          headers: { Authorization: token },
          body: formData
        });
        const data = await res.json();
        if (res.ok) {
          alert("Success! Your ad is live. ✅");
          window.location.href = "index.html";
        } else {
          alert(data.message || "Failed to publish ❌");
        }
      } catch (err) {
        alert("Connection error ❌");
      } finally {
        btn.disabled = false;
        btn.innerText = "Publish Ad Now";
      }
    });

    loadUnreadCount();
    setInterval(loadUnreadCount, 5000);
  </script>
</body>
</html>
