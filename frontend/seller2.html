<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post New Ad - Campus Dealz</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { 
        extend: { 
          colors: { 
            brand: '#ea580c', 
            navy: '#1e293b',
            surface: '#f8fafc'
          } 
        } 
      }
    }
  </script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen font-sans flex items-center justify-center p-4">

  <div id="app-loader" class="fixed inset-0 bg-white dark:bg-gray-900 z-[100] flex items-center justify-center transition-opacity duration-500">
    <img src="logo.svg" alt="Loading..." class="w-24 h-24 object-contain animate-pulse mix-blend-multiply dark:bg-white dark:p-2 dark:rounded-xl">
  </div>

  <div class="bg-white dark:bg-gray-800 w-full max-w-lg rounded-2xl shadow-xl overflow-hidden border border-gray-100 dark:border-gray-700">
    <div class="px-6 py-5 border-b border-gray-100 dark:border-gray-700">
      <h2 class="text-xl font-black text-navy dark:text-white">Post New Ad</h2>
      <p class="text-xs text-gray-500 dark:text-gray-400 font-bold uppercase tracking-widest mt-1">Fill in the details below</p>
    </div>

    <form id="form" class="p-6 space-y-5">
      <div>
        <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1.5">Product Title</label>
        <input id="title" placeholder="e.g. iPhone 12 Pro Max" class="w-full px-4 py-3 border border-gray-200 dark:border-gray-700 rounded-xl bg-gray-50 dark:bg-gray-900 text-sm focus:outline-none focus:border-brand focus:ring-2 focus:ring-brand/20 transition-all" required/>
      </div>

      <div>
        <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1.5">Price (₦)</label>
        <input id="price" type="number" placeholder="0.00" class="w-full px-4 py-3 border border-gray-200 dark:border-gray-700 rounded-xl bg-gray-50 dark:bg-gray-900 text-sm focus:outline-none focus:border-brand focus:ring-2 focus:ring-brand/20 transition-all" required/>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1.5">Category</label>
          <select id="category" onchange="loadSubcategories()" class="w-full px-4 py-3 border border-gray-200 dark:border-gray-700 rounded-xl bg-gray-50 dark:bg-gray-900 text-sm focus:outline-none focus:border-brand focus:ring-2 focus:ring-brand/20 transition-all cursor-pointer" required>
              <option value="" disabled selected>Select Category</option>
              <option value="phones">📱 Phones</option>
              <option value="phones_accessories">📱 Accessories</option>
              <option value="computing">💻 Computing</option>
              <option value="books">📚 Books</option>
              <option value="hostel">🛏️ Hostel</option>
              <option value="fashion">👕 Fashion</option>
              <option value="electronics">🎮 Electronics</option>
              <option value="beauty">💄 Beauty</option>
              <option value="services">🎯 Services</option>
              <option value="others">🔄 Others</option>
          </select>
        </div>
        <div>
          <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1.5">Subcategory</label>
          <select id="subcategory" class="w-full px-4 py-3 border border-gray-200 dark:border-gray-700 rounded-xl bg-gray-50 dark:bg-gray-900 text-sm focus:outline-none focus:border-brand focus:ring-2 focus:ring-brand/20 transition-all cursor-pointer" required>
              <option value="" disabled selected>Select Subcategory</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1.5">Description</label>
        <textarea id="description" placeholder="Provide details about condition, features, etc..." class="w-full px-4 py-3 border border-gray-200 dark:border-gray-700 rounded-xl bg-gray-50 dark:bg-gray-900 text-sm focus:outline-none focus:border-brand focus:ring-2 focus:ring-brand/20 resize-none transition-all" rows="3" required></textarea>
      </div>

      <div id="imageUploadArea" class="relative border-2 border-dashed border-gray-300 dark:border-gray-600 rounded-xl p-6 text-center hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors group cursor-pointer">
          <input id="image" type="file" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" onchange="previewImage(event)" required/>
          <div id="uploadPrompt" class="text-gray-400 group-hover:text-brand transition-colors">
              <div class="text-3xl mb-2">📸</div>
              <span class="text-xs font-bold tracking-wide uppercase">Tap to add a photo</span>
          </div>
          <img id="imagePreview" class="hidden mx-auto h-32 w-auto object-cover rounded-xl shadow-md" alt="Preview"/>
      </div>

      <button type="submit" id="submitBtn" class="w-full bg-brand hover:bg-orange-600 text-white font-black py-4 rounded-xl shadow-md active:scale-95 transition-all text-sm tracking-widest uppercase">
        Publish Ad
      </button>
    </form>
  </div>

  <script>
    const API = "https://marketplace-5nn2.onrender.com";

    // Subcategory mapping from index.html
    const subMap = {
      phones: ["Androids", "iPhones"],
      phones_accessories: ["Chargers", "Powerbanks", "Earbuds", "Headphones", "Cases", "ScreenProtectors"],
      computing: ["Laptops", "Keyboards", "Mouses", "Storage_Devices"],
      books: ["Textbooks"],
      hostel: ["Beds_Foam", "Tables_Chairs", "Buckets_Mirrors", "Others"],
      fashion: ["Clothes", "Shoes", "Bags", "Watches", "Jewelry", "Others"],
      electronics: ["Speakers", "Smartwatches", "Gadgets", "Others"],
      beauty: ["Skincare", "Hair_Products", "Perfumes", "Makeup", "Others"],
      services: ["Graphic_Design", "Hair_Barbing", "Laundry", "Phone_Repair", "Others"],
      others: ["others"]
    };

    // Loader logic
    window.addEventListener('load', () => {
      const loader = document.getElementById('app-loader');
      if (loader) {
        loader.classList.add('opacity-0');
        setTimeout(() => loader.style.display = 'none', 500);
      }
    });

    // Subcategory loader
    function loadSubcategories() {
      const category = document.getElementById("category").value;
      const subSelect = document.getElementById("subcategory");
      subSelect.innerHTML = '<option value="" disabled selected>Select Subcategory</option>';
      if (!category || !subMap[category]) return;
      subMap[category].forEach(s => {
        const option = document.createElement("option");
        option.value = s;
        option.textContent = s.replaceAll("_", " ");
        subSelect.appendChild(option);
      });
    }

    // Image preview
    function previewImage(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          document.getElementById('uploadPrompt').classList.add('hidden');
          const preview = document.getElementById('imagePreview');
          preview.src = e.target.result;
          preview.classList.remove('hidden');
        }
        reader.readAsDataURL(file);
      }
    }

    // Form submission
    document.getElementById("form").addEventListener("submit", async e => {
      e.preventDefault();
      const token = localStorage.getItem("token");
      if (!token) {
        alert("Please log in to post an ad ❌");
        return;
      }

      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      btn.innerText = "Publishing...";

      const formData = new FormData();
      formData.append("title", document.getElementById("title").value);
      formData.append("price", document.getElementById("price").value);
      formData.append("description", document.getElementById("description").value);
      formData.append("category", document.getElementById("category").value);
      formData.append("subcategory", document.getElementById("subcategory").value);
      formData.append("image", document.getElementById("image").files[0]);

      try {
        const res = await fetch(`${API}/api/products/add`, {
          method: "POST",
          headers: { Authorization: token },
          body: formData
        });
        const data = await res.json();

        if (res.ok) {
          alert("Ad is now live! ✅");
          window.location.href = "index.html"; // Redirect to home
        } else {
          alert(data.message || "Failed to post ad ❌");
        }
      } catch (err) {
        alert("Network error. Please try again ❌");
      } finally {
        btn.disabled = false;
        btn.innerText = "Publish Ad";
      }
    });
  </script>
</body>
</html>
