<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusDealz - Marketplace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: { brand: '#ea580c', navy: '#1e293b' } } }
    }
    // Check local storage for theme
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark')
    } else { 
      document.documentElement.classList.remove('dark') 
    }

    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
      localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
    }
  </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen transition-colors duration-200">

<div id="sidebarOverlay" class="fixed inset-0 bg-black/50 z-40 hidden opacity-0 transition-opacity duration-300" onclick="closeSidebar()"></div>

<div id="sidebar" class="fixed inset-y-0 left-0 w-72 bg-white dark:bg-gray-800 shadow-2xl z-50 transform -translate-x-full transition-transform duration-300 ease-in-out flex flex-col">
  <div class="p-5 flex justify-between items-center border-b border-gray-100 dark:border-gray-700">
    <div class="flex items-center gap-2">
      <span class="text-xl font-extrabold text-navy dark:text-white tracking-tight">Menu</span>
    </div>
    <button onclick="closeSidebar()" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 transition">
      <svg class="w-6 h-6 text-gray-600 dark:text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
    </button>
  </div>
  
  <div class="flex-grow overflow-y-auto p-4 space-y-6">
    <div>
      <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Categories</h3>
      <ul class="space-y-1">
        <li><a href="#" class="block px-3 py-2 rounded-lg hover:bg-orange-50 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-200 transition font-medium">📱 Electronics & Tech</a></li>
        <li><a href="#" class="block px-3 py-2 rounded-lg hover:bg-orange-50 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-200 transition font-medium">📚 Textbooks & Notes</a></li>
        <li><a href="#" class="block px-3 py-2 rounded-lg hover:bg-orange-50 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-200 transition font-medium">👕 Fashion & Clothing</a></li>
        <li><a href="#" class="block px-3 py-2 rounded-lg hover:bg-orange-50 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-200 transition font-medium">🛏️ Dorm Furniture</a></li>
        <li><a href="#" class="block px-3 py-2 rounded-lg hover:bg-orange-50 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-200 transition font-medium">🛠️ Campus Services</a></li>
      </ul>
    </div>
    <hr class="border-gray-100 dark:border-gray-700">
    
    <div>
      <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Settings & Account</h3>
      <ul class="space-y-1">
        <li><a href="#" class="block px-3 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-200 transition flex items-center gap-3 font-medium">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg> 
          My Profile</a>
        </li>
        <li><a href="#" class="block px-3 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-200 transition flex items-center gap-3 font-medium">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg> 
          Website Settings</a>
        </li>
      </ul>
    </div>
  </div>
  <div class="p-4 border-t border-gray-100 dark:border-gray-700">
     <button onclick="logout()" class="w-full text-left px-3 py-2 text-red-500 font-bold hover:bg-red-50 dark:hover:bg-gray-700 rounded-lg transition flex items-center gap-3">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
        Log Out
     </button>
  </div>
</div>

<nav class="bg-white dark:bg-gray-800 shadow-sm sticky top-0 z-30">
  <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
    <div class="flex items-center gap-2 md:gap-3">
      
      <button onclick="openSidebar()" class="p-2 -ml-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition">
        <svg class="w-6 h-6 text-navy dark:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
      </button>

      <div class="bg-white rounded-full p-1 border dark:border-none hidden sm:block">
        <img src="http://googleusercontent.com/generated_image_content/0" class="h-8 w-8 object-contain rounded-full" alt="Logo">
      </div>
      <span class="text-xl font-extrabold text-navy dark:text-white tracking-tight">CampusDealz</span>
    </div>
    
    <div class="flex items-center gap-4">
      <button onclick="toggleTheme()" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 transition">
        🌓
      </button>
      <button onclick="logout()" class="hidden md:block text-sm font-semibold text-red-500 hover:text-red-700 transition">Logout</button>
    </div>
  </div>
</nav>

<main class="max-w-7xl mx-auto p-5">
  <div class="mb-8">
    <h1 class="text-3xl font-bold mb-4 text-navy dark:text-white">Discover Deals</h1>
    <div class="relative">
      <input id="searchInput" placeholder="Search for textbooks, electronics, clothing..." class="w-full md:w-1/2 border-2 border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-900 dark:text-white rounded-full py-3 px-6 shadow-sm focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand transition-all"/>
    </div>
  </div>

  <div id="products" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
    </div>
</main>

<script>
const API = "https://marketplace-5nn2.onrender.com";

// Sidebar Navigation Logic
function openSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebarOverlay');
  overlay.classList.remove('hidden');
  
  // Timeout ensures 'display: block' applies before animation starts
  setTimeout(() => {
    overlay.classList.remove('opacity-0');
    sidebar.classList.remove('-translate-x-full');
  }, 10);
}

function closeSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebarOverlay');
  
  overlay.classList.add('opacity-0');
  sidebar.classList.add('-translate-x-full');
  
  // Wait for the CSS transition to finish before hiding
  setTimeout(() => {
    overlay.classList.add('hidden');
  }, 300); 
}

function logout() {
  localStorage.removeItem("token");
  window.location.href = "login.html";
}

async function loadProducts() {
  try {
    const res = await fetch(`${API}/api/products`);
    const data = await res.json();
    const container = document.getElementById("products");
    container.innerHTML = "";

    data.forEach(p => {
      container.innerHTML += `
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm hover:shadow-xl transition-all duration-300 overflow-hidden flex flex-col cursor-pointer border border-gray-100 dark:border-gray-700" onclick="view('${p.id}')">
          <div class="h-48 overflow-hidden bg-gray-200 dark:bg-gray-700">
            <img src="${p.image}" class="w-full h-full object-cover hover:scale-105 transition-transform duration-500" onerror="this.src='https://via.placeholder.com/300x200?text=No+Image'">
          </div>
          <div class="p-4 flex flex-col flex-grow">
            <h2 class="font-bold text-lg mb-1 truncate text-navy dark:text-white">${p.title}</h2>
            <p class="text-brand font-extrabold text-xl mt-auto">₦${p.price.toLocaleString()}</p>
          </div>
        </div>
      `;
    });
  } catch (error) {
    console.error("Failed to load products:", error);
  }
}

function view(id) {
  window.location.href = "product.html?id=" + id;
}

// Initialize
loadProducts();
</script>
</body>
</html>
