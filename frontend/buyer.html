<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Dealz</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { 
        extend: { 
          colors: { 
            brand: '#ea580c', 
            navy: '#1e293b',
            surface: '#f8fafc'
          } 
        } 
      }
    }
  </script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen font-sans pb-20 md:pb-0">

  <header class="bg-white dark:bg-gray-800 shadow-sm sticky top-0 z-40 border-b border-gray-200 dark:border-gray-700">
    <div class="max-w-7xl mx-auto px-4 py-3">
      <div class="flex items-center justify-between gap-4">
        
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 bg-brand rounded flex items-center justify-center text-white font-black text-xs tracking-tighter">CD</div>
          <span class="text-xl md:text-2xl font-black text-navy dark:text-white tracking-tight hidden sm:block">CampusDealz</span>
        </div>

        <div class="flex-grow max-w-2xl relative">
          <svg class="w-5 h-5 absolute left-3 top-2.5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
          <input type="text" placeholder="I am looking for..." class="w-full pl-10 pr-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-gray-50 dark:bg-gray-700 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand">
        </div>

        <div class="flex items-center gap-4">
          <a href="seller.html" class="hidden md:flex bg-brand hover:bg-orange-600 text-white px-6 py-2 rounded-lg font-bold text-sm shadow-sm transition">SELL</a>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-4 md:py-6">
    
    <div class="flex gap-4 md:gap-6 overflow-x-auto no-scrollbar mb-6 pb-2">
      <button class="flex flex-col items-center min-w-[70px] group">
        <div class="w-12 h-12 md:w-14 md:h-14 bg-white dark:bg-gray-800 rounded-full flex items-center justify-center text-xl shadow-sm border border-gray-200 dark:border-gray-700 group-hover:border-brand transition">📚</div>
        <span class="text-[11px] md:text-xs font-bold mt-2 text-gray-600 dark:text-gray-300">Books</span>
      </button>
      <button class="flex flex-col items-center min-w-[70px] group">
        <div class="w-12 h-12 md:w-14 md:h-14 bg-white dark:bg-gray-800 rounded-full flex items-center justify-center text-xl shadow-sm border border-gray-200 dark:border-gray-700 group-hover:border-brand transition">💻</div>
        <span class="text-[11px] md:text-xs font-bold mt-2 text-gray-600 dark:text-gray-300">Tech</span>
      </button>
      <button class="flex flex-col items-center min-w-[70px] group">
        <div class="w-12 h-12 md:w-14 md:h-14 bg-white dark:bg-gray-800 rounded-full flex items-center justify-center text-xl shadow-sm border border-gray-200 dark:border-gray-700 group-hover:border-brand transition">👕</div>
        <span class="text-[11px] md:text-xs font-bold mt-2 text-gray-600 dark:text-gray-300">Fashion</span>
      </button>
      <button class="flex flex-col items-center min-w-[70px] group">
        <div class="w-12 h-12 md:w-14 md:h-14 bg-white dark:bg-gray-800 rounded-full flex items-center justify-center text-xl shadow-sm border border-gray-200 dark:border-gray-700 group-hover:border-brand transition">🛏️</div>
        <span class="text-[11px] md:text-xs font-bold mt-2 text-gray-600 dark:text-gray-300">Hostel</span>
      </button>
    </div>

    <h2 class="font-black text-lg mb-4 text-navy dark:text-white flex items-center gap-2">Trending Ads <span class="w-2 h-2 bg-brand rounded-full animate-pulse"></span></h2>

    <div id="products-container" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-3 md:gap-4">
      </div>

  </main>

  <nav class="md:hidden fixed bottom-0 w-full bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 flex justify-around items-center pb-safe pt-2 pb-2 z-50">
    <a href="buyer.html" class="flex flex-col items-center text-brand">
      <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
      <span class="text-[10px] font-bold">Home</span>
    </a>
    <a href="seller.html" class="flex flex-col items-center text-gray-400 hover:text-brand transition">
      <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
      <span class="text-[10px] font-bold">Sell</span>
    </a>
    <a href="messages.html" class="flex flex-col items-center text-gray-400 hover:text-brand transition">
      <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
      <span class="text-[10px] font-bold">Messages</span>
    </a>
    <a href="#" class="flex flex-col items-center text-gray-400 hover:text-brand transition">
      <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
      <span class="text-[10px] font-bold">Profile</span>
    </a>
  </nav>

  <script>
    const API = "https://marketplace-5nn2.onrender.com";

    async function loadProducts() {
      const container = document.getElementById("products-container");
      try {
        const res = await fetch(`${API}/api/products`);
        let data = await res.json();

        if (!data || !Array.isArray(data)) {
          container.innerHTML = "Failed to load products ❌";
          return;
        }

        container.innerHTML = "";

        data.forEach(p => {
          // Changed to Jiji Card Style: Square image on top, text below.
          container.innerHTML += `
            <div class="bg-white dark:bg-gray-800 rounded-lg shadow-sm hover:shadow-md transition-all duration-200 overflow-hidden flex flex-col cursor-pointer border border-gray-200 dark:border-gray-700" onclick="view('${p.id}')">
              <div class="aspect-square w-full bg-gray-100 dark:bg-gray-700 relative">
                <img src="${p.image}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/300x300?text=No+Image'">
              </div>
              <div class="p-2 md:p-3 flex flex-col flex-grow">
                <h2 class="text-xs md:text-sm text-gray-700 dark:text-gray-200 line-clamp-2 mb-1">${p.title}</h2>
                <p class="text-brand font-black text-sm md:text-lg mt-auto">₦${p.price.toLocaleString()}</p>
              </div>
            </div>
          `;
        });
      } catch (error) {
        console.error("Failed to load products:", error);
      }
    }

    function view(id) {
      window.location.href = "product.html?id=" + id;
    }

    loadProducts();
  </script>
</body>
</html>
