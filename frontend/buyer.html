<!DOCTYPE html>
<html>
<head>
  <title>CampusDealz - Buyer</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-5 bg-gray-100">

<h1 class="text-2xl font-bold mb-4">Marketplace</h1>

<button onclick="logout()" class="bg-red-500 text-white px-3 py-1 mb-4 rounded">
Logout
</button>

<input id="searchInput" placeholder="Search..." class="border p-2 w-full mb-3"/>

<div id="products" class="grid grid-cols-2 gap-4"></div>

<script>
const API = "https://marketplace-5nn2.onrender.com";

function logout() {
  localStorage.removeItem("token");
  window.location.href = "login.html";
}

async function loadProducts() {
  const res = await fetch(`${API}/api/products`);
  const data = await res.json();

  const container = document.getElementById("products");
  container.innerHTML = "";

  data.forEach(p => {
    container.innerHTML += `
      <div class="bg-white p-3 rounded shadow">
        <img src="${p.image}" class="w-full h-40 object-cover">
        <h2>${p.title}</h2>
        <p>₦${p.price}</p>
        <button onclick="view('${p.id}')" class="bg-blue-500 text-white px-2 py-1 mt-2">View</button>
      </div>
    `;
  });
}

function view(id) {
  window.location.href = "product.html?id=" + id;
}

loadProducts();
</script>

</body>
</html>
