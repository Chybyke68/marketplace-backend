<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unizik Student Marketplace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { 
        extend: { 
          colors: { 
            brand: '#ea580c', // Keeping your original orange brand color
            navy: '#1e293b',
            surface: '#f8fafc'
          } 
        } 
      }
    }
  </script>
  <style>
    /* Hide scrollbar for category row but allow scrolling */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen font-sans pb-20 md:pb-0">

  <header class="bg-white dark:bg-gray-800 shadow-sm sticky top-0 z-40 border-b border-gray-200 dark:border-gray-700">
    <div class="max-w-7xl mx-auto px-4 py-3">
      
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="text-xl md:text-2xl font-extrabold text-navy dark:text-white tracking-tight">Unizik Marketplace</span>
        </div>

        <div class="hidden md:flex flex-grow max-w-xl mx-8 relative">
          <svg class="w-5 h-5 absolute left-3 top-2.5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
          <input type="text" placeholder="Search items..." class="w-full pl-10 pr-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-gray-50 dark:bg-gray-700 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand w-full">
        </div>

        <div class="flex items-center gap-4">
          <nav class="hidden md:flex items-center gap-6 font-medium text-gray-600 dark:text-gray-300">
            <a href="buyer.html" class="text-brand hover:text-brand">Home</a>
            <a href="seller.html" class="hover:text-brand transition">Sell</a>
            <a href="#" class="hover:text-brand transition">Messages</a>
            <a href="#" class="hover:text-brand transition">Profile</a>
          </nav>
          
          <button class="md:hidden p-2 text-gray-600 dark:text-gray-300">
            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
          </button>
        </div>
      </div>

    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-4 md:py-8">
    
    <div class="md:hidden relative mb-6">
      <svg class="w-5 h-5 absolute left-4 top-3.5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
      <input type="text" placeholder="Search items..." class="w-full pl-11 pr-4 py-3 border border-gray-300 dark:border-gray-700 rounded-xl bg-white dark:bg-gray-800 shadow-sm focus:outline-none focus:border-brand">
    </div>

    <div class="flex gap-4 md:gap-8 overflow-x-auto no-scrollbar mb-6 pb-2 border-b border-gray-200 dark:border-gray-800">
      <button class="flex flex-col items-center min-w-[70px] md:min-w-[90px] group">
        <div class="w-14 h-14 md:w-16 md:h-16 bg-gray-200 dark:bg-gray-700 rounded-xl flex items-center justify-center text-2xl group-hover:bg-orange-100 transition shadow-sm border border-gray-300 dark:border-gray-600">
          📚
        </div>
        <span class="text-xs md:text-sm font-medium mt-2 text-gray-700 dark:text-gray-300">Books</span>
      </button>
      
      <button class="flex flex-col items-center min-w-[70px] md:min-w-[90px] group">
        <div class="w-14 h-14 md:w-16 md:h-16 bg-gray-200 dark:bg-gray-700 rounded-xl flex items-center justify-center text-2xl group-hover:bg-orange-100 transition shadow-sm border border-gray-300 dark:border-gray-600">
          💻
        </div>
        <span class="text-xs md:text-sm font-medium mt-2 text-gray-700 dark:text-gray-300">Electronics</span>
      </button>

      <button class="flex flex-col items-center min-w-[70px] md:min-w-[90px] group">
        <div class="w-14 h-14 md:w-16 md:h-16 bg-gray-200 dark:bg-gray-700 rounded-xl flex items-center justify-center text-2xl group-hover:bg-orange-100 transition shadow-sm border border-gray-300 dark:border-gray-600">
          👕
        </div>
        <span class="text-xs md:text-sm font-medium mt-2 text-gray-700 dark:text-gray-300">Fashion</span>
      </button>

      <button class="flex flex-col items-center min-w-[70px] md:min-w-[90px] group">
        <div class="w-14 h-14 md:w-16 md:h-16 bg-gray-200 dark:bg-gray-700 rounded-xl flex items-center justify-center text-2xl group-hover:bg-orange-100 transition shadow-sm border border-gray-300 dark:border-gray-600">
          🛏️
        </div>
        <span class="text-xs md:text-sm font-medium mt-2 text-gray-700 dark:text-gray-300">Hostel</span>
      </button>
    </div>

    <div class="flex items-center gap-4 text-sm md:text-base font-semibold text-gray-600 dark:text-gray-400 mb-6 pb-4 border-b border-gray-200 dark:border-gray-800">
      <button class="text-brand border-b-2 border-brand pb-1">All</button>
      <span class="text-gray-300 dark:text-gray-700">|</span>
      <button class="hover:text-gray-900 dark:hover:text-white pb-1">₦ Price</button>
      <span class="text-gray-300 dark:text-gray-700">|</span>
      <button class="hover:text-gray-900 dark:hover:text-white pb-1">Recent</button>
    </div>

    <div id="products-container" class="flex flex-col md:grid md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6">
      </div>

  </main>

  <nav class="md:hidden fixed bottom-0 w-full bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 flex justify-around items-center pb-safe pt-2 pb-2 z-50">
    <a href="buyer.html" class="flex flex-col items-center text-brand">
      <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
      <span class="text-[10px] font-medium">Home</span>
    </a>
    <a href="seller.html" class="flex flex-col items-center text-gray-500 hover:text-brand transition">
      <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
      <span class="text-[10px] font-medium">Sell</span>
    </a>
    <a href="#" class="flex flex-col items-center text-gray-500 hover:text-brand transition relative">
      <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
      <span class="text-[10px] font-medium">Messages</span>
    </a>
    <a href="#" class="flex flex-col items-center text-gray-500 hover:text-brand transition">
      <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
      <span class="text-[10px] font-medium">Profile</span>
    </a>
  </nav>

  <script>
    const API = "https://marketplace-5nn2.onrender.com";

    async function loadProducts() {
      const container = document.getElementById("products-container");
      try {
        const res = await fetch(`${API}/api/products`);
        let data = await res.json();
        
        // Mock data if API fails or is empty, to demonstrate layout
        if (!data || data.length === 0) {
            data = [
                { id: 1, title: "Engineering Math Textbook", price: 5500, seller: "John Doe", image: "https://via.placeholder.com/300x300?text=Book" },
                { id: 2, title: "MacBook Pro 2019", price: 450000, seller: "Jane Smith", image: "https://via.placeholder.com/300x300?text=Laptop" },
                { id: 3, title: "Standing Fan (Fairly Used)", price: 12000, seller: "Mike O.", image: "https://via.placeholder.com/300x300?text=Fan" },
                { id: 4, title: "Vintage Denim Jacket", price: 4500, seller: "Sarah K.", image: "https://via.placeholder.com/300x300?text=Jacket" }
            ];
        }

        container.innerHTML = "";

        data.forEach(p => {
          // The card class switches from a horizontal flex row (mobile) to a vertical flex col (desktop)
          container.innerHTML += `
            <div class="bg-white dark:bg-gray-800 rounded-lg md:rounded-2xl shadow-sm md:hover:shadow-xl transition-all duration-300 overflow-hidden flex flex-row md:flex-col cursor-pointer border border-gray-200 dark:border-gray-700" onclick="view('${p.id}')">
              
              <div class="w-32 h-32 md:w-full md:h-48 flex-shrink-0 bg-gray-100 dark:bg-gray-700 border-r md:border-r-0 md:border-b border-gray-200 dark:border-gray-700">
                <img src="${p.image}" class="w-full h-full object-cover md:hover:scale-105 transition-transform duration-500" onerror="this.src='https://via.placeholder.com/300x300?text=No+Image'">
              </div>
              
              <div class="p-3 md:p-4 flex flex-col flex-grow justify-center md:justify-start">
                <h2 class="font-semibold md:font-bold text-base md:text-lg mb-1 truncate text-navy dark:text-white">${p.title}</h2>
                <p class="text-brand font-bold md:font-extrabold text-lg md:text-xl my-1 md:my-2">₦${p.price.toLocaleString()}</p>
                <p class="text-xs md:text-sm text-gray-500 dark:text-gray-400 mt-auto">By: ${p.seller || "Student Seller"}</p>
              </div>

            </div>
          `;
        });
      } catch (error) {
        console.error("Failed to load products:", error);
      }
    }

    function view(id) {
      window.location.href = "product.html?id=" + id;
    }

    loadProducts();
  </script>
</body>
</html>
