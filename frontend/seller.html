  <script>
    const API = "https://marketplace-5nn2.onrender.com";
    let myProducts = [];
    let editingProductId = null;

    function openForm() {
      document.getElementById("formModal").classList.remove("hidden");
      if (!editingProductId) {
          document.getElementById("form").reset();
          document.getElementById("formTitle").innerText = "Post Item";
          document.getElementById("submitBtn").innerText = "Publish Ad";
          document.getElementById("imagePreview").classList.add("hidden");
          document.getElementById("uploadPrompt").classList.remove("hidden");
      }
    }

    function closeForm() {
      document.getElementById("formModal").classList.add("hidden");
      editingProductId = null;
    }

    function previewImage(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          document.getElementById('uploadPrompt').classList.add('hidden');
          const preview = document.getElementById('imagePreview');
          preview.src = e.target.result;
          preview.classList.remove('hidden');
        }
        reader.readAsDataURL(file);
      }
    }

  async function loadMyAds() {
  const token = localStorage.getItem("token");
  const params = new URLSearchParams(window.location.search);
  const userId = params.get("user");
  let currentUserId = null;

  if (token) {
    try {
      const user = JSON.parse(atob(token.split(".")[1]));
      currentUserId = user.id;
    } catch (e) { console.log("Invalid token"); }
  }

  let url;
  if (userId) {
    url = `${API}/api/products?seller=${userId}`;
    document.getElementById("statsSection").style.display = "none";
    document.getElementById("inventoryLabel").style.display = "none";
    document.getElementById("logoutBtn").style.display = "none";
  } else {
    url = `${API}/api/products/my`;
    document.getElementById("statsSection").style.display = "grid";
    document.getElementById("inventoryLabel").style.display = "block";
    document.getElementById("navTitle").innerText = "Seller Center";
  }

  try {
    const res = await fetch(url, {
      headers: token ? { Authorization: token } : {}
    });
    const data = await res.json();
    myProducts = data;

    if (userId && data.length > 0) {
      const storeName = data[0].users?.store_name || "Seller Store";
      document.getElementById("storeHeader").innerText = storeName;
      document.getElementById("navTitle").innerText = storeName;
    } else {
      document.getElementById("storeHeader").innerText = "";
    }

    if (userId) { document.getElementById("form").style.display = "none"; }
    document.getElementById("activeAdsCount").innerText = data.length;
    renderAds(data, currentUserId);
  } catch (err) { console.error(err); }
}

function renderAds(ads, currentUserId) {
  const container = document.getElementById("products-container");
  container.innerHTML = "";
  if (ads.length === 0) {
    container.innerHTML = `<div class="p-8 text-center text-gray-400 bg-white dark:bg-gray-800 rounded border border-gray-200 dark:border-gray-700"><p>No products available.</p></div>`;
    return;
  }
  ads.forEach(p => {
    const isOwner = currentUserId === p.user_id;
    container.innerHTML += `
     <div onclick="openProduct('${p.id}')" 
          class="bg-white dark:bg-gray-800 p-3 rounded shadow-sm border border-gray-200 dark:border-gray-700 flex gap-4 items-center group cursor-pointer hover:shadow-md transition">
        <div class="h-16 w-16 md:h-20 md:w-20 overflow-hidden rounded bg-gray-100 flex-shrink-0">
          <img src="${p.image}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/150'">
        </div>
        <div class="flex-grow min-w-0">
          <h3 class="font-bold text-sm text-navy dark:text-white truncate mb-1">${p.title}</h3>
          <p class="text-brand font-black text-sm md:text-base">₦${Number(p.price).toLocaleString()}</p>
        </div>
       ${isOwner ? `
        <div class="flex flex-row md:flex-col gap-2">
          <button onclick="event.stopPropagation(); editAd('${p.id}')"
            class="p-2 bg-gray-50 dark:bg-gray-700 hover:bg-gray-200 rounded text-gray-600">
          ✏️
           </button>
          <button onclick="event.stopPropagation(); deleteAd('${p.id}')"
             class="p-2 hover:bg-red-50 rounded text-red-500">
            🗑️
           </button>
          </div>
          ` : ""}
      </div>
    `;
  });
}

  phones: ["Androids", "iPhones"],
  phones_accessories: ["Chargers", "Powerbanks", "Earbuds", "Headphones", "Cases", "ScreenProtectors"],
  computing: ["Laptops", "Keyboards", "Mouses", "Storage_Devices"],

  electronics: ["Speakers", "Smartwatches", "Gadgets", "Others"],
  beauty: ["Skincare", "Hair_Products", "Perfumes", "Makeup", "Others"],
  services: ["Graphic_Design", "Hair_Barbing", "Laundry", "Phone_Repair", "Others"],
  others: ["others"]
};

function loadSubcategories() {
  const category = document.getElementById("category").value;
  const subSelect = document.getElementById("subcategory");

  subSelect.innerHTML = "";

  // Handle the default empty state
  if (!category) {
    subSelect.innerHTML = '<option value="" disabled selected>Select Subcategory</option>';
    return;
  }

  const sub = subMap[category];
  
  if (sub) {
    // Add the default select placeholder for the subcategory dropdown too
    subSelect.innerHTML = '<option value="" disabled selected>Select Subcategory</option>';
    sub.forEach(s => {
      subSelect.innerHTML += `<option value="${s}">${s.replaceAll("_", " ")}</option>`;
    });
  }
}

// 🔥 load default
loadSubcategories();

function openProduct(id) { window.location.href = `product.html?id=${id}`; }

    function filterAds() {
        const query = document.getElementById("inventorySearch").value.toLowerCase();
        const filtered = myProducts.filter(p => p.title.toLowerCase().includes(query));
        let cId = null;
        try { cId = JSON.parse(atob(localStorage.getItem("token").split(".")[1])).id; } catch(e){}
        renderAds(filtered, cId);
    }

    function editAd(id) {
      const product = myProducts.find(p => p.id == id);
      if (!product) return;
      editingProductId = id;
      document.getElementById("title").value = product.title;
      document.getElementById("price").value = product.price;
      document.getElementById("category").value = product.category || "Books";
      document.getElementById("description").value = product.description || "";
      document.getElementById("imagePreview").src = product.image;
      document.getElementById("imagePreview").classList.remove("hidden");
      document.getElementById("uploadPrompt").classList.add("hidden");
      document.getElementById("formTitle").innerText = "Edit Ad Details";
      document.getElementById("submitBtn").innerText = "Update Listing";
      openForm();
    }

    document.getElementById("form").addEventListener("submit", async e => {
      e.preventDefault();
      const token = localStorage.getItem("token");
      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      btn.innerText = "Processing...";
      try {
        if (editingProductId) {
          const res = await fetch(`${API}/api/products/${editingProductId}`, {
            method: "PUT",
            headers: { Authorization: token, "Content-Type": "application/json" },
            body: JSON.stringify({
              title: document.getElementById("title").value,
              price: document.getElementById("price").value,
              description: document.getElementById("description").value,
              category: document.getElementById("category").value
            })
          });
          if (res.ok) alert("Listing updated! ✅");
        } else {
          const formData = new FormData();
          formData.append("title", document.getElementById("title").value);
          formData.append("price", document.getElementById("price").value);
          formData.append("description", document.getElementById("description").value);
          formData.append("category", document.getElementById("category").value);
          formData.append("subcategory", document.getElementById("subcategory").value);
          formData.append("image", document.getElementById("image").files[0]);
          const res = await fetch(`${API}/api/products/add`, {
            method: "POST",
            headers: { Authorization: token },
            body: formData
          });
          // if (res.ok) alert("Listing is now live! ✅");
          const data = await res.json();

if (!res.ok) {
  console.log("ERROR:", data);
  alert(data.message || "Upload failed ❌");
  return;
}

alert("Listing is now live! ✅");
        }
        closeForm();
        loadMyAds();
      } catch (err) { alert("Action failed ❌"); }
      finally { btn.disabled = false; btn.innerText = "Publish Ad"; }
    });

    async function deleteAd(id) {
      if (!confirm("Are you sure you want to remove this listing?")) return;
      await fetch(`${API}/api/products/${id}`, {
        method: "DELETE",
        headers: { Authorization: localStorage.getItem("token") }
      });
      loadMyAds();
    }

    function logout() { localStorage.removeItem("token"); window.location.href = "login.html"; }
    loadMyAds();
  </script>
