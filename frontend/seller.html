<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Dealz - Seller Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { 
        extend: { 
          colors: { 
            brand: '#ea580c', 
            navy: '#1e293b',
            surface: '#f8fafc'
          } 
        } 
      }
    }
  </script>
  <style>
    /* Hide scrollbar but allow scrolling */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen font-sans pb-20 md:pb-0">

  <header class="bg-white dark:bg-gray-800 shadow-sm sticky top-0 z-40 border-b border-gray-200 dark:border-gray-700">
    <div class="max-w-7xl mx-auto px-4 py-3">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="text-xl md:text-2xl font-extrabold text-navy dark:text-white tracking-tight">Unizik Marketplace</span>
        </div>
        <div class="flex items-center gap-4">
          <nav class="hidden md:flex items-center gap-6 font-medium text-gray-600 dark:text-gray-300">
            <a href="buyer.html" class="hover:text-brand transition">Home</a>
            <a href="seller.html" class="text-brand hover:text-brand transition">Sell</a>
            <a href="#" class="hover:text-brand transition" onclick="logout()">Logout</a>
          </nav>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-4 md:py-8">
    <div class="flex justify-between items-end mb-6 border-b border-gray-200 dark:border-gray-800 pb-4">
      <div>
        <h1 class="text-2xl md:text-3xl font-extrabold text-navy dark:text-white">Seller Dashboard</h1>
      </div>
      <button onclick="openModal()" class="bg-brand text-white px-4 py-2 rounded-lg font-bold text-sm shadow-lg">＋ Post New Ad</button>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 md:gap-8">
      <section class="lg:col-span-1 space-y-4">
        <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700">
            <p class="text-xs font-bold text-gray-400 uppercase tracking-widest">Active Ads</p>
            <h3 id="activeAdsCount" class="text-3xl font-black mt-1">0</h3>
        </div>
      </section>

      <section class="lg:col-span-2 space-y-4">
        <h2 class="text-lg font-bold text-navy dark:text-white">Manage Your Ads</h2>
        <div id="products-container" class="flex flex-col gap-4">
          </div>
      </section>
    </div>
  </main>

  <div id="productModal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
    <div class="bg-white dark:bg-gray-800 w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden">
      <div class="px-6 py-4 border-b border-gray-100 dark:border-gray-700 flex justify-between items-center">
        <h2 id="modalTitle" class="text-lg font-bold text-navy dark:text-white">Post New Item</h2>
        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600">✕</button>
      </div>

      <form id="form" class="p-6 space-y-4">
        <input id="title" placeholder="Item Title" class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-xl bg-gray-50 dark:bg-gray-700 text-sm focus:outline-none focus:border-brand" required/>
        
        <div class="grid grid-cols-2 gap-3">
          <input id="price" type="number" placeholder="Price (₦)" class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-xl bg-gray-50 dark:bg-gray-700 text-sm focus:outline-none focus:border-brand" required/>
          <select id="category" class="w-full px-3 py-3 border border-gray-300 dark:border-gray-600 rounded-xl bg-gray-50 dark:bg-gray-700 text-sm focus:outline-none focus:border-brand">
            <option value="Books">📚 Books</option>
            <option value="Electronics">💻 Electronics</option>
            <option value="Fashion">👕 Fashion</option>
            <option value="Hostel">🛏️ Hostel</option>
          </select>
        </div>

        <textarea id="description" placeholder="Description..." class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-xl bg-gray-50 dark:bg-gray-700 text-sm focus:outline-none focus:border-brand resize-none" rows="3" required></textarea>

        <div id="imageUploadArea" class="relative border-2 border-dashed border-gray-300 dark:border-gray-600 rounded-xl p-6 text-center">
            <input id="image" type="file" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" onchange="previewImage(event)"/>
            <div id="uploadPrompt" class="text-gray-400">
               <span class="text-xs font-bold">Click to upload photo</span>
            </div>
            <img id="imagePreview" class="hidden mx-auto h-24 w-auto object-cover rounded-lg" alt="Preview"/>
        </div>

        <button type="submit" id="submitBtn" class="w-full bg-brand hover:bg-orange-600 text-white font-extrabold py-3.5 rounded-xl transition-all">
          Publish Ad
        </button>
      </form>
    </div>
  </div>

  <script>
    const API = "https://marketplace-5nn2.onrender.com";
    let myProducts = [];
    let editingProductId = null; // Tracks if we are editing

    // --- Modal Controls ---
    function openModal(isEdit = false) {
      document.getElementById("productModal").classList.remove("hidden");
      if (!isEdit) {
        editingProductId = null;
        document.getElementById("form").reset();
        document.getElementById("modalTitle").innerText = "Post New Item";
        document.getElementById("submitBtn").innerText = "Publish Ad";
        document.getElementById("imagePreview").classList.add("hidden");
        document.getElementById("uploadPrompt").classList.remove("hidden");
        document.getElementById("imageUploadArea").classList.remove("hidden");
      }
    }

    function closeModal() {
      document.getElementById("productModal").classList.add("hidden");
    }

    function previewImage(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          document.getElementById('uploadPrompt').classList.add('hidden');
          const preview = document.getElementById('imagePreview');
          preview.src = e.target.result;
          preview.classList.remove('hidden');
        }
        reader.readAsDataURL(file);
      }
    }

    // --- Data Management ---
    async function loadMyAds() {
      const token = localStorage.getItem("token");
      try {
        const res = await fetch(`${API}/api/products/my`, { headers: { Authorization: token } });
        const data = await res.json();
        myProducts = data;
        document.getElementById("activeAdsCount").innerText = data.length;
        
        const container = document.getElementById("products-container");
        container.innerHTML = "";
        data.forEach(p => {
          container.innerHTML += `
            <div class="bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 flex gap-4 items-center">
              <img src="${p.image}" class="w-20 h-20 object-cover rounded-lg" onerror="this.src='https://via.placeholder.com/150'">
              <div class="flex-grow min-w-0">
                <h3 class="font-bold text-navy dark:text-white truncate">${p.title}</h3>
                <p class="text-brand font-bold">₦${p.price.toLocaleString()}</p>
              </div>
              <div class="flex flex-col gap-2">
                <button onclick="editAd('${p.id}')" class="text-xs bg-gray-100 dark:bg-gray-700 px-3 py-1.5 rounded-lg font-bold">Edit</button>
                <button onclick="deleteAd('${p.id}')" class="text-xs text-red-500 font-bold">Delete</button>
              </div>
            </div>`;
        });
      } catch(err) { console.error(err); }
    }

    // Prepare Modal for Editing
    function editAd(id) {
      const product = myProducts.find(p => p.id == id);
      if (!product) return;

      editingProductId = id;
      openModal(true);

      document.getElementById("modalTitle").innerText = "Edit Product";
      document.getElementById("submitBtn").innerText = "Update Product";
      
      // Fill form with existing data
      document.getElementById("title").value = product.title;
      document.getElementById("price").value = product.price;
      document.getElementById("category").value = product.category || "Books";
      document.getElementById("description").value = product.description || "";
      
      // Show existing image
      document.getElementById("imagePreview").src = product.image;
      document.getElementById("imagePreview").classList.remove("hidden");
      document.getElementById("uploadPrompt").classList.add("hidden");
      
      // Note: In edit mode, usually we don't force a re-upload unless they click the area
    }

    // Unified Submit (Add or Edit)
    document.getElementById("form").addEventListener("submit", async e => {
      e.preventDefault();
      const token = localStorage.getItem("token");
      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      btn.innerText = "Processing...";

      try {
        if (editingProductId) {
          // --- UPDATE (PUT) ---
          const res = await fetch(`${API}/api/products/${editingProductId}`, {
            method: "PUT",
            headers: { 
                Authorization: token,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
              title: document.getElementById("title").value,
              price: document.getElementById("price").value,
              description: document.getElementById("description").value,
              category: document.getElementById("category").value
            })
          });
          if (res.ok) alert("Product updated! ✅");
        } else {
          // --- ADD (POST) ---
          const formData = new FormData();
          formData.append("title", document.getElementById("title").value);
          formData.append("price", document.getElementById("price").value);
          formData.append("description", document.getElementById("description").value);
          formData.append("category", document.getElementById("category").value);
          formData.append("image", document.getElementById("image").files[0]);

          const res = await fetch(`${API}/api/products/add`, {
            method: "POST",
            headers: { Authorization: token },
            body: formData
          });
          if (res.ok) alert("Product added! ✅");
        }
        
        closeModal();
        loadMyAds();
      } catch (err) {
        alert("An error occurred.");
      } finally {
        btn.disabled = false;
        btn.innerText = editingProductId ? "Update Product" : "Publish Ad";
      }
    });

    async function deleteAd(id) {
      if (!confirm("Delete this ad?")) return;
      await fetch(`${API}/api/products/${id}`, {
        method: "DELETE",
        headers: { Authorization: localStorage.getItem("token") }
      });
      loadMyAds();
    }

    function logout() { localStorage.removeItem("token"); window.location.href = "login.html"; }

    loadMyAds();
  </script>
</body>
</html>
