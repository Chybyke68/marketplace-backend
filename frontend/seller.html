<!DOCTYPE html>
<html>
<head>
  <title>CampusDealz - Seller</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-5 bg-gray-100">

<h1 class="text-2xl font-bold mb-4">Seller Dashboard</h1>

<button onclick="logout()" class="bg-red-500 text-white px-3 py-1 mb-4 rounded">
Logout
</button>

<form id="form" class="bg-white p-4 rounded mb-4">
  <input id="title" placeholder="Title" class="border p-2 w-full mb-2"/>
  <input id="price" placeholder="Price" class="border p-2 w-full mb-2"/>
  <input id="image" type="file" class="mb-2"/>
  <button class="bg-blue-500 text-white px-3 py-1">Add</button>
</form>

<div id="products"></div>

<script>
const API = "https://marketplace-5nn2.onrender.com";

function logout() {
  localStorage.removeItem("token");
  window.location.href = "login.html";
}

async function loadMy() {
  const token = localStorage.getItem("token");

  const res = await fetch(`${API}/api/products/my`, {
    headers: { Authorization: token }
  });

  const data = await res.json();

  const box = document.getElementById("products");
  box.innerHTML = "";

  data.forEach(p => {
    box.innerHTML += `
      <div class="bg-white p-3 mb-2">
        ${p.title} - ₦${p.price}
      </div>
    `;
  });
}

document.getElementById("form").addEventListener("submit", async e => {
  e.preventDefault();

  const token = localStorage.getItem("token");

  const form = new FormData();
  form.append("title", title.value);
  form.append("price", price.value);
  form.append("image", image.files[0]);

  await fetch(`${API}/api/products/add`, {
    method: "POST",
    headers: { Authorization: token },
    body: form
  });

  loadMy();
});

loadMy();
</script>

</body>
</html>
