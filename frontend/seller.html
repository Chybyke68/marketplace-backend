<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusDealz - Seller Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: { brand: '#ea580c', navy: '#1e293b' } } }
    }
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark')
    } else { document.documentElement.classList.remove('dark') }

    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
      localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
    }
  </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen transition-colors duration-200">

<div id="sidebarOverlay" class="fixed inset-0 bg-black/50 z-40 hidden opacity-0 transition-opacity duration-300" onclick="closeSidebar()"></div>

<div id="sidebar" class="fixed inset-y-0 left-0 w-72 bg-white dark:bg-gray-800 shadow-2xl z-50 transform -translate-x-full transition-transform duration-300 ease-in-out flex flex-col">
  <div class="p-5 flex justify-between items-center border-b border-gray-100 dark:border-gray-700">
    <span class="text-xl font-extrabold text-navy dark:text-white">Seller Menu</span>
    <button onclick="closeSidebar()" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
    </button>
  </div>
  <div class="flex-grow p-4 space-y-4">
    <a href="buyer.html" class="block px-3 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 font-medium">🛒 Switch to Buying</a>
    <a href="#" class="block px-3 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 font-medium">⚙️ Shop Settings</a>
  </div>
  <div class="p-4 border-t dark:border-gray-700">
     <button onclick="logout()" class="w-full text-left px-3 py-2 text-red-500 font-bold flex items-center gap-3">
        Logout
     </button>
  </div>
</div>

<nav class="bg-white dark:bg-gray-800 shadow-sm sticky top-0 z-30">
  <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <button onclick="openSidebar()" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700">
        <svg class="w-6 h-6 text-navy dark:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
      </button>
      <span class="text-xl font-extrabold text-navy dark:text-white">Seller Hub</span>
    </div>
    <button onclick="toggleTheme()" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700">🌓</button>
  </div>
</nav>

<main class="max-w-4xl mx-auto p-5">
  
  <section class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 mb-8">
    <h2 class="text-xl font-bold mb-6 flex items-center gap-2">
      <span class="bg-orange-100 text-orange-600 p-2 rounded-lg">✨</span> Post New Ad
    </h2>
    
    <form id="form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="md:col-span-2">
        <input id="title" placeholder="What are you selling?" class="w-full border-2 border-gray-100 dark:border-gray-700 bg-gray-50 dark:bg-gray-900 p-3 rounded-xl focus:border-brand outline-none transition" required/>
      </div>
      
      <div class="relative">
        <span class="absolute left-3 top-3 text-gray-400 font-bold">₦</span>
        <input id="price" type="number" placeholder="Price" class="w-full border-2 border-gray-100 dark:border-gray-700 bg-gray-50 dark:bg-gray-900 p-3 pl-8 rounded-xl focus:border-brand outline-none transition" required/>
      </div>

      <select id="category" class="w-full border-2 border-gray-100 dark:border-gray-700 bg-gray-50 dark:bg-gray-900 p-3 rounded-xl focus:border-brand outline-none transition">
        <option value="Electronics">📱 Electronics</option>
        <option value="Textbooks">📚 Textbooks</option>
        <option value="Fashion">👕 Fashion</option>
        <option value="Home">🛏️ Dorm Gear</option>
        <option value="Other">🌀 Others</option>
      </select>

      <select id="condition" class="w-full border-2 border-gray-100 dark:border-gray-700 bg-gray-50 dark:bg-gray-900 p-3 rounded-xl focus:border-brand outline-none transition">
        <option value="New">Brand New</option>
        <option value="Used">Lightly Used</option>
        <option value="Refurbished">Refurbished</option>
      </select>

      <input id="location" placeholder="Hostel/Faculty Location" class="w-full border-2 border-gray-100 dark:border-gray-700 bg-gray-50 dark:bg-gray-900 p-3 rounded-xl focus:border-brand outline-none transition" required/>

      <div class="md:col-span-2">
        <label class="block text-sm font-bold text-gray-500 mb-2">Product Photo</label>
        <input id="image" type="file" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-orange-50 file:text-orange-700 hover:file:bg-orange-100 cursor-pointer" required/>
      </div>

      <button class="md:col-span-2 bg-brand hover:bg-orange-600 text-white font-bold py-4 rounded-xl shadow-lg shadow-orange-200 dark:shadow-none transition-all mt-2">
        Post Advertisement
      </button>
    </form>
  </section>

  <h2 class="text-xl font-bold mb-4">My Active Ads</h2>
  <div id="products" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    </div>
</main>

<script>
const API = "https://marketplace-5nn2.onrender.com";

function openSidebar() {
  document.getElementById('sidebarOverlay').classList.remove('hidden');
  setTimeout(() => {
    document.getElementById('sidebarOverlay').classList.remove('opacity-0');
    document.getElementById('sidebar').classList.remove('-translate-x-full');
  }, 10);
}

function closeSidebar() {
  document.getElementById('sidebarOverlay').classList.add('opacity-0');
  document.getElementById('sidebar').classList.add('-translate-x-full');
  setTimeout(() => document.getElementById('sidebarOverlay').classList.add('hidden'), 300);
}

function logout() {
  localStorage.removeItem("token");
  window.location.href = "login.html";
}

async function loadMy() {
  const token = localStorage.getItem("token");
  const res = await fetch(`${API}/api/products/my`, {
    headers: { Authorization: token }
  });
  const data = await res.json();
  const box = document.getElementById("products");
  box.innerHTML = "";

  data.forEach(p => {
    box.innerHTML += `
      <div class="bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm border dark:border-gray-700 flex gap-4">
        <img src="${p.image}" class="w-20 h-20 object-cover rounded-lg">
        <div class="flex-grow">
          <h3 class="font-bold text-navy dark:text-white truncate">${p.title}</h3>
          <p class="text-brand font-bold text-sm">₦${p.price.toLocaleString()}</p>
          <div class="flex gap-2 mt-2">
            <button onclick="markSold('${p.id}')" class="text-[10px] bg-green-100 text-green-700 px-2 py-1 rounded font-bold uppercase">Mark Sold</button>
            <button onclick="deleteAd('${p.id}')" class="text-[10px] bg-red-100 text-red-700 px-2 py-1 rounded font-bold uppercase">Delete</button>
          </div>
        </div>
      </div>
    `;
  });
}

document.getElementById("form").addEventListener("submit", async e => {
  e.preventDefault();
  const token = localStorage.getItem("token");
  const formData = new FormData();
  
  formData.append("title", document.getElementById("title").value);
  formData.append("price", document.getElementById("price").value);
  formData.append("category", document.getElementById("category").value);
  formData.append("condition", document.getElementById("condition").value);
  formData.append("location", document.getElementById("location").value);
  formData.append("image", document.getElementById("image").files[0]);

  const res = await fetch(`${API}/api/products/add`, {
    method: "POST",
    headers: { Authorization: token },
    body: formData
  });

  if (res.ok) {
    alert("Ad posted successfully! 🚀");
    location.reload();
  } else {
    alert("Error posting ad.");
  }
});

// Placeholder functions for management
async function markSold(id) { alert("Feature coming soon: Updating status to 'Sold'"); }
async function deleteAd(id) { alert("Feature coming soon: Deleting ad"); }

loadMy();
</script>
</body>
</html>
