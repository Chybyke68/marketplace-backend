<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Info - CampusDealz</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: '#ea580c', navy: '#1e293b' } } } }
  </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen font-sans pb-10">

  <header class="bg-white dark:bg-gray-800 shadow-sm sticky top-0 z-40 border-b dark:border-gray-700">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center gap-4">
      <div class="cursor-pointer p-2 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-full transition" onclick="window.location.href='settings.html'">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
      </div>
      <span class="text-xl font-black text-navy dark:text-white">Personal Info</span>
    </div>
  </header>

  <main class="max-w-xl mx-auto px-4 py-8">
    <div class="flex flex-col items-center mb-8">
      <div class="relative group">
        <img id="profileImg" src="https://ui-avatars.com/api/?name=User&background=ea580c&color=fff" class="w-24 h-24 rounded-full border-4 border-white dark:border-gray-800 shadow-md object-cover">
        <button class="absolute bottom-0 right-0 bg-brand text-white p-1.5 rounded-full border-2 border-white dark:border-gray-800 shadow-sm">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" stroke-width="2"></path><path d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" stroke-width="2"></path></svg>
        </button>
      </div>
    </div>

    <div class="space-y-4">
      <div class="bg-white dark:bg-gray-800 rounded-2xl p-5 border dark:border-gray-700 shadow-sm">
        <div class="flex justify-between items-center mb-1">
          <label class="text-xs font-bold text-gray-400 uppercase tracking-widest">Full Name</label>
          <button onclick="toggleEdit('name')" id="btn-name" class="text-brand">
            <svg class="w-5 h-5" id="icon-name" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </button>
        </div>
        <div id="display-name" class="text-lg font-bold">Loading...</div>
        <input id="input-name" class="hidden w-full bg-gray-50 dark:bg-gray-900 border-2 border-brand p-2 rounded-xl outline-none">
      </div>

      <div class="bg-white dark:bg-gray-800 rounded-2xl p-5 border dark:border-gray-700 shadow-sm">
        <div class="flex justify-between items-center mb-1">
          <label class="text-xs font-bold text-gray-400 uppercase tracking-widest">Location</label>
          <button onclick="toggleEdit('location')" id="btn-location" class="text-brand">
            <svg class="w-5 h-5" id="icon-location" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </button>
        </div>
        <div id="display-location" class="text-lg font-bold">Not set</div>
        <input id="input-location" class="hidden w-full bg-gray-50 dark:bg-gray-900 border-2 border-brand p-2 rounded-xl outline-none">
      </div>

      <div class="bg-white dark:bg-gray-800 rounded-2xl p-5 border dark:border-gray-700 shadow-sm">
        <div class="flex justify-between items-center mb-1">
          <label class="text-xs font-bold text-gray-400 uppercase tracking-widest">Sex</label>
          <button onclick="toggleEdit('sex')" id="btn-sex" class="text-brand">
            <svg class="w-5 h-5" id="icon-sex" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </button>
        </div>
        <div id="display-sex" class="text-lg font-bold capitalize">Male</div>
        <select id="input-sex" class="hidden w-full bg-gray-50 dark:bg-gray-900 border-2 border-brand p-2 rounded-xl outline-none">
          <option value="male">Male</option>
          <option value="female">Female</option>
        </select>
      </div>
    </div>
  </main>

  <script>
    const API = "https://marketplace-5nn2.onrender.com";
    let isEditing = {};

    async function load() {
      const token = localStorage.getItem("token");
      const res = await fetch(`${API}/api/auth/me`, { headers: { Authorization: token } });
      const user = await res.json();
      
      document.getElementById("display-name").innerText = user.name || "Enter Name";
      document.getElementById("input-name").value = user.name || "";
      document.getElementById("display-location").innerText = user.location || "Not set";
      document.getElementById("input-location").value = user.location || "";
      document.getElementById("display-sex").innerText = user.sex || "male";
      document.getElementById("input-sex").value = user.sex || "male";
      if(user.name) document.getElementById("profileImg").src = `https://ui-avatars.com/api/?name=${user.name}&background=ea580c&color=fff`;
    }

    async function toggleEdit(field) {
      const display = document.getElementById(`display-${field}`);
      const input = document.getElementById(`input-${field}`);
      const icon = document.getElementById(`icon-${field}`);

      if (!isEditing[field]) {
        display.classList.add('hidden');
        input.classList.remove('hidden');
        input.focus();
        icon.outerHTML = `<svg class="w-6 h-6 text-green-500" id="icon-${field}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>`;
        isEditing[field] = true;
      } else {
        const newValue = input.value;
        const token = localStorage.getItem("token");
        
        await fetch(`${API}/api/auth/update`, {
          method: "PUT",
          headers: { "Content-Type": "application/json", Authorization: token },
          body: JSON.stringify({ [field]: newValue })
        });

        display.innerText = newValue || "Not set";
        display.classList.remove('hidden');
        input.classList.add('hidden');
        icon.outerHTML = `<svg class="w-5 h-5" id="icon-${field}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>`;
        isEditing[field] = false;
      }
    }

    load();
    if (localStorage.theme === 'dark') document.documentElement.classList.add('dark');
  </script>
</body>
</html>
